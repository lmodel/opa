        inlined: true
        required: true
      features:
        description: The features, keyed by name, each with the version that introduced it.
        range: OpaVersionEntry
        multivalued: true
        inlined: true
        required: true
      keywords:
        description: The keywords, keyed by name, each with the version that introduced it.
        range: OpaVersionEntry
        multivalued: true
        inlined: true
        required: true
  OpaVersionEntry:
    description: A built-in function, feature or keyword, and the OPA version that introduced it.
