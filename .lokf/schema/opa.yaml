        alias: _categories
        multivalued: true
        inlined: true
        required: true
      implementations:
        description: The implementations of Rego besides OPA that the catalogue tracks.
        range: OpaImplementation
        alias: _implementations
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: true
    extra_slots:
