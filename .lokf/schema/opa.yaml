      openpolicyagent_type:
        description: The kind of statement.
        range: string
        required: true
        equals_string: ResultSetAddStmt
  OpaResultSetAddStmtBody:
    description: ResultSetAddStmt adds a value into the result set returned by the query plan.
    exact_mappings:
    - opa_plan:ResultSetAddStmt
    attributes:
      value:
        range: integer
        required: true
        description: The local added to the result set.
    is_a: OpaStmtBody
  OpaReturnLocalStmt:
    is_a: OpaStmt
    description: A statement of kind ReturnLocalStmt, with its fields in `stmt`.
    attributes:
      stmt:
        description: The statement's fields.
        range: OpaReturnLocalStmtBody
        required: true
        inlined: true
    slots:
    - openpolicyagent_type
    slot_usage:
      openpolicyagent_type:
        description: The kind of statement.
        range: string
        required: true
        equals_string: ReturnLocalStmt
  OpaReturnLocalStmtBody:
    description: ReturnLocalStmt represents a return statement that yields a local value.
    exact_mappings:
    - opa_plan:ReturnLocalStmt
    is_a: OpaStmtBody
    slots:
    - openpolicyagent_source
    slot_usage:
      openpolicyagent_source:
        range: integer
        required: true
        description: The local returned.
  OpaScanStmt:
    is_a: OpaStmt
    description: A statement of kind ScanStmt, with its fields in `stmt`.
    attributes:
      stmt:
        description: The statement's fields.
        range: OpaScanStmtBody
        required: true
        inlined: true
    slots:
    - openpolicyagent_type
    slot_usage:
      openpolicyagent_type:
        description: The kind of statement.
        range: string
        required: true
        equals_string: ScanStmt
  OpaScanStmtBody:
    description: ScanStmt represents a linear scan over a composite value. The source may be a scalar
      in which case the block will never execute.
    exact_mappings:
    - opa_plan:ScanStmt
    attributes:
      block:
        range: OpaBlock
        inlined: true
        description: The block run for each key and value.
      key:
        range: integer
        required: true
        description: The local that receives each key.
      value:
        range: integer
        required: true
        description: The local that receives each value.
    is_a: OpaStmtBody
    slots:
    - openpolicyagent_source
    slot_usage:
      openpolicyagent_source:
        range: integer
        required: true
        description: The local whose value is scanned.
  OpaSetAddStmt:
    is_a: OpaStmt
    description: A statement of kind SetAddStmt, with its fields in `stmt`.
    attributes:
      stmt:
        description: The statement's fields.
        range: OpaSetAddStmtBody
        required: true
        inlined: true
    slots:
    - openpolicyagent_type
    slot_usage:
      openpolicyagent_type:
        description: The kind of statement.
        range: string
        required: true
        equals_string: SetAddStmt
  OpaSetAddStmtBody:
    description: SetAddStmt represents a dynamic add operation of an element into a set.
    exact_mappings:
    - opa_plan:SetAddStmt
    attributes:
      set:
        range: integer
        required: true
        description: The local that holds the set.
      value:
        range: OpaOperand
        inlined: true
        required: true
        description: The value.
    is_a: OpaStmtBody
  OpaWithStmt:
    is_a: OpaStmt
    description: A statement of kind WithStmt, with its fields in `stmt`.
    attributes:
      stmt:
        description: The statement's fields.
        range: OpaWithStmtBody
        required: true
        inlined: true
    slots:
    - openpolicyagent_type
    slot_usage:
      openpolicyagent_type:
        description: The kind of statement.
        range: string
        required: true
        equals_string: WithStmt
  OpaWithStmtBody:
    description: WithStmt replaces the Local or a portion of the document referred to by the Local with
      the Value and executes the contained block. If the Path is non-empty, the Value is upserted into
      the Local.
    exact_mappings:
    - opa_plan:WithStmt
    attributes:
      block:
        range: OpaBlock
        inlined: true
        description: The block the statement runs.
      local:
        range: integer
        required: true
        description: The local whose value, or part of it, is replaced.
      path:
        range: integer
        multivalued: true
        description: The path within the local's value to replace, as indices of static strings. Empty
          replaces the whole value.
      value:
        range: OpaOperand
        inlined: true
        required: true
        description: The replacement value.
    is_a: OpaStmtBody
  OpaOperand:
    abstract: true
    description: Operand represents a value that a statement operates on. OPA writes it as its kind in
      `type` and the value in `value`.
    exact_mappings:
    - opa_plan:Operand
    - opa_plan:Val
  OpaBoolOperand:
    is_a: OpaOperand
    description: Bool represents a constant boolean.
    attributes:
      value:
        description: The operand's value.
        range: boolean
        required: true
    slots:
    - openpolicyagent_type
    slot_usage:
      openpolicyagent_type:
        description: The kind of operand.
        range: string
        required: true
        equals_string: bool
  OpaLocalOperand:
    is_a: OpaOperand
    description: A local variable, by its number.
    attributes:
      value:
        description: The operand's value.
        range: integer
        required: true
    slots:
    - openpolicyagent_type
    slot_usage:
      openpolicyagent_type:
        description: The kind of operand.
        range: string
        required: true
        equals_string: local
  OpaStringIndexOperand:
    is_a: OpaOperand
    description: StringIndex represents the index into the plan's list of constant strings of a constant
      string.
    attributes:
      value:
        description: The operand's value.
        range: integer
        required: true
    slots:
    - openpolicyagent_type
    slot_usage:
      openpolicyagent_type:
        description: The kind of operand.
        range: string
        required: true
        equals_string: string_index
slots:
  openpolicyagent_body:
    description: The body of an HTTP request.
    slot_uri: openpolicyagent:body
    aliases:
    - body
  openpolicyagent_revision:
    description: A bundle's revision, a string the bundle's author chooses.
    slot_uri: openpolicyagent:revision
    aliases:
    - revision
  openpolicyagent_source:
    description: 'What a plan statement reads: a local, or an operand.'
    slot_uri: openpolicyagent:source
    aliases:
    - source
  openpolicyagent_target:
    description: The local a plan statement writes its result to.
    slot_uri: openpolicyagent:target
    aliases:
    - target
  openpolicyagent_type:
    description: 'The kind of an object: of a Rego type, a plan statement or an operand, or a type written
      as OPA prints types.'
    slot_uri: openpolicyagent:type
    aliases:
    - type
  openpolicyagent_version:
    description: 'A version: an implementation''s, a Wasm ABI''s major number or a file''s Rego version.'
    slot_uri: openpolicyagent:version
    aliases:
    - version
  file:
    description: Index, in the plan's static files, of the policy file the statement comes from.
    range: integer
  col:
    description: Column where the statement's source text starts.
    range: integer
  row:
    description: Line where the statement's source text starts.
    range: integer
  end_col:
    description: Column where the statement's source text ends.
    range: integer
  end_row:
    description: Line where the statement's source text ends.
    range: integer
enums:
  OpaFutureKeyword:
    description: The future keywords the capabilities files OPA includes name.
    permissible_values:
      and: {}
      contains: {}
      every: {}
      if: {}
      in: {}
      not: {}
      or: {}
  OpaFeature:
    description: The language features the capabilities files OPA includes name.
    permissible_values:
      keywords_in_refs: {}
      rego_v1: {}
      rego_v1_import: {}
      rego_v2: {}
      rego_v2_import: {}
      rule_head_ref_string_prefixes: {}
      rule_head_refs: {}
      template_strings: {}
notes:
- 'Adapted for LOKF by `lokf adapt`. re-rooted on lokf:Concept: OpaCapabilities, OpaBuiltin, OpaManifest,
  OpaPolicy; renamed, IRIs unchanged: body -> openpolicyagent_body, revision -> openpolicyagent_revision,
  source -> openpolicyagent_source, target -> openpolicyagent_target, type -> openpolicyagent_type, version
  -> openpolicyagent_version; folded into LOKF''s: OpaType.description -> description, OpaBuiltin.description
  -> description, OpaBuiltinMetadata.description -> description, OpaBuiltinArgument.description -> description,
  OpaBuiltinResult.description -> description; kept from folding: OpaBuiltinCategory.name, OpaBuiltinArgument.name,
  OpaBuiltinResult.name, OpaBuiltin.name, OpaType.name, OpaBuiltinFunc.name, OpaPlan.name, OpaFunc.name,
  OpaVersionEntry.name.'
