        required: true
        equals_string: any
      description:
        range: string
  OpaArrayType:
    is_a: OpaType
    description: An array, with a type per position in `static` and one for the rest in `dynamic`.
    attributes:
      static:
        description: The type of each element by position.
        range: OpaType
        multivalued: true
        inlined: true
        inlined_as_list: true
      dynamic:
        description: The type of the elements after the static ones.
        range: OpaType
        inlined: true
    slots:
    - openpolicyagent_type
    slot_usage:
      openpolicyagent_type:
        description: The kind of type.
        range: string
        required: true
        equals_string: array
      description:
        range: string
  OpaBooleanType:
    is_a: OpaType
    description: A boolean.
    slots:
    - openpolicyagent_type
    slot_usage:
      openpolicyagent_type:
        description: The kind of type.
        range: string
        required: true
        equals_string: boolean
      description:
        range: string
  OpaFunctionType:
