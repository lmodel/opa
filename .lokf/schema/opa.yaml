        required: true
        inlined: true
      value:
        description: The type of the values.
        range: OpaType
        required: true
        inlined: true
  OpaCapabilities:
    description: What an OPA version supports, which a policy can be checked against.
    attributes:
      builtins:
        description: The built-in functions.
        range: OpaBuiltin
        multivalued: true
        inlined: true
        inlined_as_list: true
      future_keywords:
        description: The keywords a policy may import from future.keywords.
        range: OpaFutureKeyword
        multivalued: true
      wasm_abi_versions:
        description: The Wasm ABI versions supported.
        range: OpaWasmAbiVersion
        multivalued: true
        inlined: true
        inlined_as_list: true
      features:
        description: The language features supported.
        range: OpaFeature
        multivalued: true
      allow_net:
        description: The hosts OPA may connect to, as host names or IP addresses. OPA reaches any host
