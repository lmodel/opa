      operand_b:
        range: integer
        required: true
        description: The local that holds the second object.
        alias: b
    is_a: OpaStmtBody
    slots:
    - openpolicyagent_target
    slot_usage:
      openpolicyagent_target:
        range: integer
        required: true
        description: The local that receives the result.
  OpaResetLocalStmt:
    is_a: OpaStmt
    description: A statement of kind ResetLocalStmt, with its fields in `stmt`.
    attributes:
      stmt:
        description: The statement's fields.
        range: OpaResetLocalStmtBody
        required: true
        inlined: true
    slots:
    - openpolicyagent_type
    slot_usage:
      openpolicyagent_type:
        description: The kind of statement.
        range: string
        required: true
        equals_string: ResetLocalStmt
  OpaResetLocalStmtBody:
    description: ResetLocalStmt resets a local variable to 0.
    exact_mappings:
    - opa_plan:ResetLocalStmt
    is_a: OpaStmtBody
    slots:
    - openpolicyagent_target
    slot_usage:
      openpolicyagent_target:
        range: integer
        required: true
        description: The local that receives the result.
  OpaResultSetAddStmt:
    is_a: OpaStmt
    description: A statement of kind ResultSetAddStmt, with its fields in `stmt`.
    attributes:
      stmt:
        description: The statement's fields.
        range: OpaResultSetAddStmtBody
        required: true
        inlined: true
    slots:
    - openpolicyagent_type
    slot_usage:
      openpolicyagent_type:
        description: The kind of statement.
        range: string
        required: true
        equals_string: ResultSetAddStmt
  OpaResultSetAddStmtBody:
    description: ResultSetAddStmt adds a value into the result set returned by the query plan.
    exact_mappings:
    - opa_plan:ResultSetAddStmt
    attributes:
      value:
        range: integer
        required: true
        description: The local added to the result set.
    is_a: OpaStmtBody
  OpaReturnLocalStmt:
    is_a: OpaStmt
    description: A statement of kind ReturnLocalStmt, with its fields in `stmt`.
    attributes:
      stmt:
        description: The statement's fields.
        range: OpaReturnLocalStmtBody
        required: true
        inlined: true
    slots:
    - openpolicyagent_type
    slot_usage:
      openpolicyagent_type:
        description: The kind of statement.
        range: string
        required: true
        equals_string: ReturnLocalStmt
  OpaReturnLocalStmtBody:
    description: ReturnLocalStmt represents a return statement that yields a local value.
    exact_mappings:
    - opa_plan:ReturnLocalStmt
    is_a: OpaStmtBody
    slots:
    - openpolicyagent_source
    slot_usage:
      openpolicyagent_source:
        range: integer
        required: true
        description: The local returned.
  OpaScanStmt:
    is_a: OpaStmt
    description: A statement of kind ScanStmt, with its fields in `stmt`.
    attributes:
      stmt:
        description: The statement's fields.
        range: OpaScanStmtBody
        required: true
        inlined: true
    slots:
    - openpolicyagent_type
    slot_usage:
      openpolicyagent_type:
        description: The kind of statement.
        range: string
        required: true
        equals_string: ScanStmt
  OpaScanStmtBody:
    description: ScanStmt represents a linear scan over a composite value. The source may be a scalar
      in which case the block will never execute.
    exact_mappings:
    - opa_plan:ScanStmt
    attributes:
      block:
        range: OpaBlock
        inlined: true
        description: The block run for each key and value.
      key:
        range: integer
        required: true
        description: The local that receives each key.
      value:
        range: integer
        required: true
        description: The local that receives each value.
    is_a: OpaStmtBody
    slots:
    - openpolicyagent_source
    slot_usage:
      openpolicyagent_source:
        range: integer
        required: true
        description: The local whose value is scanned.
  OpaSetAddStmt:
    is_a: OpaStmt
    description: A statement of kind SetAddStmt, with its fields in `stmt`.
    attributes:
      stmt:
        description: The statement's fields.
        range: OpaSetAddStmtBody
        required: true
        inlined: true
    slots:
    - openpolicyagent_type
    slot_usage:
      openpolicyagent_type:
        description: The kind of statement.
        range: string
        required: true
        equals_string: SetAddStmt
  OpaSetAddStmtBody:
    description: SetAddStmt represents a dynamic add operation of an element into a set.
    exact_mappings:
    - opa_plan:SetAddStmt
    attributes:
      set:
        range: integer
        required: true
        description: The local that holds the set.
      value:
        range: OpaOperand
        inlined: true
        required: true
        description: The value.
    is_a: OpaStmtBody
  OpaWithStmt:
    is_a: OpaStmt
    description: A statement of kind WithStmt, with its fields in `stmt`.
    attributes:
      stmt:
        description: The statement's fields.
        range: OpaWithStmtBody
        required: true
        inlined: true
    slots:
    - openpolicyagent_type
    slot_usage:
      openpolicyagent_type:
        description: The kind of statement.
        range: string
        required: true
        equals_string: WithStmt
  OpaWithStmtBody:
    description: WithStmt replaces the Local or a portion of the document referred to by the Local with
      the Value and executes the contained block. If the Path is non-empty, the Value is upserted into
      the Local.
    exact_mappings:
    - opa_plan:WithStmt
    attributes:
      block:
        range: OpaBlock
        inlined: true
        description: The block the statement runs.
      local:
        range: integer
        required: true
        description: The local whose value, or part of it, is replaced.
      path:
        range: integer
        multivalued: true
        description: The path within the local's value to replace, as indices of static strings. Empty
          replaces the whole value.
      value:
        range: OpaOperand
        inlined: true
        required: true
        description: The replacement value.
    is_a: OpaStmtBody
  OpaOperand:
    abstract: true
    description: Operand represents a value that a statement operates on. OPA writes it as its kind in
      `type` and the value in `value`.
    exact_mappings:
    - opa_plan:Operand
    - opa_plan:Val
  OpaBoolOperand:
    is_a: OpaOperand
    description: Bool represents a constant boolean.
    attributes:
      value:
        description: The operand's value.
        range: boolean
        required: true
    slots:
    - openpolicyagent_type
    slot_usage:
      openpolicyagent_type:
        description: The kind of operand.
        range: string
        required: true
        equals_string: bool
  OpaLocalOperand:
    is_a: OpaOperand
    description: A local variable, by its number.
    attributes:
      value:
        description: The operand's value.
        range: integer
        required: true
    slots:
    - openpolicyagent_type
    slot_usage:
      openpolicyagent_type:
        description: The kind of operand.
        range: string
        required: true
        equals_string: local
  OpaStringIndexOperand:
    is_a: OpaOperand
    description: StringIndex represents the index into the plan's list of constant strings of a constant
      string.
    attributes:
      value:
        description: The operand's value.
        range: integer
        required: true
    slots:
    - openpolicyagent_type
    slot_usage:
      openpolicyagent_type:
        description: The kind of operand.
        range: string
        required: true
        equals_string: string_index
  OpaDecisionLogEvent:
    description: 'A decision OPA made: the query or path, the input and result, the bundles and the instance
      behind it, and when and for whom it was made.'
    attributes:
      labels:
        description: 'The labels of the OPA instance that made the decision: its `id`, its `version` and
          those the configuration sets.'
        range: OpaLabels
        inlined: true
      decision_id:
        description: The decision's id, which OPA also returns to the client.
        required: true
      batch_decision_id:
        description: The id that groups the decisions of one batch request.
      trace_id:
        description: The request's trace id in W3C trace context, with tracing on.
      span_id:
        description: The request's span id in W3C trace context, with tracing on.
      bundles:
        description: The bundles whose policy made the decision, by name.
        range: OpaDecisionBundle
        multivalued: true
        inlined: true
      path:
        description: The decision's path in the data tree, such as `http/example/authz/allow`.
      query:
        description: The ad hoc query the Query API received.
      input:
        description: The input of the query.
        range: OpaValue
        any_of:
        - range: OpaValue
        - range: OpaValue
          multivalued: true
      result:
        description: The result the client received.
        range: OpaValue
        any_of:
        - range: OpaValue
        - range: OpaValue
          multivalued: true
      intermediate_results:
        description: The intermediate results the evaluation recorded, when OPA runs with the environment
          variable OPA_DECISIONS_INTERMEDIATE_RESULTS set.
        range: OpaObject
        inlined: true
      mapped_result:
        description: The result of a decision made through OPA's Go SDK, as its result mapper wrote it.
        range: OpaValue
        any_of:
        - range: OpaValue
        - range: OpaValue
          multivalued: true
      nd_builtin_cache:
        description: What each non-deterministic built-in function returned, by function and arguments,
          with `nd_builtin_cache` on.
        range: OpaObject
        inlined: true
      erased:
        description: JSON pointers to the fields a mask policy removed.
        multivalued: true
      masked:
        description: JSON pointers to the fields a mask policy replaced.
        multivalued: true
      error:
        description: The error the evaluation raised, as OPA writes it in JSON.
        range: OpaValue
        any_of:
        - range: OpaValue
        - range: OpaValue
          multivalued: true
      requested_by:
        description: The address of the client that asked.
      metrics:
        description: The query's metrics, by name.
        range: OpaObject
        inlined: true
      req_id:
        description: The number OPA gave the HTTP request, which its request and response logs also carry.
        range: integer
        minimum_value: 0
      rule_labels:
        description: The merged `labels` annotations of each rule the evaluation used.
        range: OpaObject
        multivalued: true
        inlined: true
        inlined_as_list: true
      request_context:
        description: The parts of the HTTP request the configuration asks OPA to log.
        range: OpaRequestContext
        inlined: true
      custom:
        description: Fields the server or a plugin adds, such as `request_metadata`, which holds the top-level
          keys of a Data API request body other than `input`.
        range: OpaObject
        inlined: true
    slots:
    - openpolicyagent_revision
    - openpolicyagent_timestamp
    slot_usage:
      openpolicyagent_revision:
        description: The revision of the bundle that made the decision, under the legacy `bundle` configuration.
        deprecated: OPA marks the key deprecated and writes `bundles` instead.
      openpolicyagent_timestamp:
        description: When OPA made the decision.
        range: datetime
        required: true
  OpaDecisionBundle:
    description: A bundle whose policy made a decision.
    attributes:
      name:
        description: The bundle's name.
        key: true
        slot_uri: schema:name
    slots:
    - openpolicyagent_revision
    slot_usage:
      openpolicyagent_revision:
        description: The bundle's revision when OPA made the decision.
  OpaRequestContext:
    description: The parts of the request that a decision log event logs.
    attributes:
      http:
        description: The logged parts of the HTTP request.
        range: OpaHttpRequestContext
        inlined: true
  OpaHttpRequestContext:
    description: The logged parts of an HTTP request.
    attributes:
      headers:
        description: The headers the configuration names, each with its values.
        range: OpaStringListMap
        inlined: true
  OpaStatusReport:
    description: 'A report on an OPA instance: the state of its bundles, its decision log uploads and
      its plugins, and its metrics.'
    attributes:
      labels:
        description: The labels of the OPA instance that sends the report.
        range: OpaLabels
        inlined: true
      bundle:
        description: The status of the one bundle of the legacy `bundle` configuration.
        range: OpaBundleStatus
        inlined: true
        deprecated: OPA marks the key deprecated and writes `bundles` instead.
      bundles:
        description: The status of each bundle OPA downloads, by name.
        range: OpaBundleStatus
        multivalued: true
        inlined: true
      discovery:
        description: The status of the discovery bundle.
        range: OpaBundleStatus
        inlined: true
      decision_logs:
        description: The status of the decision log uploads.
        range: OpaDecisionLogStatus
        inlined: true
      metrics:
        description: The instance's metrics, under the name of their provider, such as `prometheus`.
        range: OpaObject
        inlined: true
      plugins:
        description: The state of each plugin, by name.
        range: OpaPluginStatus
        multivalued: true
        inlined: true
  OpaBundleStatus:
    description: 'The status of a bundle: its active revision, when OPA last asked for, downloaded and
      activated it, and the errors of the last attempt.'
    comments:
    - OPA writes Go's zero time, 0001-01-01T00:00:00Z, for a time that has not come yet, such as the last
      activation of a bundle that never activated.
    attributes:
      name:
        description: The bundle's name.
        key: true
        required: true
        slot_uri: schema:name
      active_revision:
        description: The revision of the bundle OPA last activated.
      last_successful_activation:
        description: When OPA last activated the bundle.
        range: datetime
        required: true
      size:
        description: The bundle's size in bytes.
        range: integer
      last_successful_download:
        description: When OPA last downloaded the bundle.
        range: datetime
        required: true
      last_successful_request:
        description: When a request for the bundle last succeeded.
        range: datetime
        required: true
      last_request:
        description: When OPA last asked for the bundle.
        range: datetime
        required: true
      code:
        description: The error code, when the last download or activation failed.
      message:
        description: What went wrong, in words.
      errors:
        description: The parse and compile errors of the last activation.
        range: OpaObject
        multivalued: true
        inlined: true
        inlined_as_list: true
      metrics:
        description: The metrics of the last download and activation.
        range: OpaObject
        inlined: true
      http_code:
        description: The HTTP status code of a download the server refused.
        range: integer
    slots:
    - openpolicyagent_type
    slot_usage:
      openpolicyagent_type:
        description: The bundle's type.
        range: OpaBundleType
  OpaDecisionLogStatus:
    description: The status of the decision log uploads.
    attributes:
      code:
        description: The error code, when the last upload failed.
      message:
        description: What went wrong, in words.
      http_code:
        description: The HTTP status code of an upload the server refused.
        range: integer
      metrics:
        description: The decision logger's metrics.
        range: OpaObject
        inlined: true
  OpaPluginStatus:
    description: The state of a plugin.
    attributes:
      name:
        description: The plugin's name.
        key: true
        slot_uri: schema:name
      state:
        description: The plugin's state.
        range: OpaPluginState
        required: true
      message:
        description: More about the state, in words.
slots:
  openpolicyagent_body:
    description: The body of an HTTP request.
    slot_uri: openpolicyagent:body
    aliases:
    - body
  openpolicyagent_revision:
    description: A bundle's revision, a string the bundle's author chooses.
    slot_uri: openpolicyagent:revision
    aliases:
    - revision
  openpolicyagent_source:
    description: 'What a plan statement reads: a local, or an operand.'
    slot_uri: openpolicyagent:source
    aliases:
    - source
  openpolicyagent_target:
    description: The local a plan statement writes its result to.
    slot_uri: openpolicyagent:target
    aliases:
    - target
  openpolicyagent_timestamp:
    description: When OPA made a decision.
    slot_uri: openpolicyagent:timestamp
    aliases:
    - timestamp
  openpolicyagent_type:
    description: 'The kind of an object: of a Rego type, a plan statement, an operand or a bundle, or
      a type written as OPA prints types.'
    slot_uri: openpolicyagent:type
    aliases:
    - type
  openpolicyagent_version:
    description: 'A version: an implementation''s, a Wasm ABI''s major number or a file''s Rego version.'
    slot_uri: openpolicyagent:version
    aliases:
    - version
  file:
    description: Index, in the plan's static files, of the policy file the statement comes from.
    range: integer
  col:
    description: Column where the statement's source text starts.
    range: integer
  row:
    description: Line where the statement's source text starts.
    range: integer
  end_col:
    description: Column where the statement's source text ends.
    range: integer
  end_row:
    description: Line where the statement's source text ends.
    range: integer
enums:
  OpaFutureKeyword:
    description: The future keywords the capabilities files OPA includes name.
    permissible_values:
      and: {}
      contains: {}
      every: {}
      if: {}
      in: {}
      not: {}
      or: {}
  OpaFeature:
    description: The language features the capabilities files OPA includes name.
    permissible_values:
      keywords_in_refs: {}
      rego_v1: {}
      rego_v1_import: {}
      rego_v2: {}
      rego_v2_import: {}
      rule_head_ref_string_prefixes: {}
      rule_head_refs: {}
      template_strings: {}
  OpaPluginState:
    description: The states a plugin reports.
    permissible_values:
      NOT_READY:
        description: Not in an error state, but not yet ready for normal operation, as at start-up.
      OK:
        description: Working normally.
      ERROR:
        description: In an error state, and not to be taken as working.
      WARN:
        description: Working, but degraded or in a state a person may need to fix.
  OpaBundleType:
    description: The types of bundle.
    permissible_values:
      delta:
        description: A delta bundle, whose JSON Patch operations change the data OPA holds.
      snapshot:
        description: A whole bundle, whose files replace what OPA held under its roots.
notes:
- 'Adapted for LOKF by `lokf adapt`. re-rooted on lokf:Concept: OpaCapabilities, OpaBuiltin, OpaManifest,
  OpaPolicy; renamed, IRIs unchanged: body -> openpolicyagent_body, revision -> openpolicyagent_revision,
  source -> openpolicyagent_source, target -> openpolicyagent_target, timestamp -> openpolicyagent_timestamp,
  type -> openpolicyagent_type, version -> openpolicyagent_version; folded into LOKF''s: OpaType.description
  -> description, OpaBuiltin.description -> description, OpaBuiltinMetadata.description -> description,
  OpaBuiltinArgument.description -> description, OpaBuiltinResult.description -> description; kept from
  folding: OpaBuiltinCategory.name, OpaBuiltinArgument.name, OpaBuiltinResult.name, OpaBuiltin.name, OpaType.name,
  OpaBuiltinFunc.name, OpaPlan.name, OpaFunc.name, OpaVersionEntry.name, OpaDecisionBundle.name, OpaBundleStatus.name,
  OpaPluginStatus.name.'
