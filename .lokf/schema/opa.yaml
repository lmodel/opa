  OpaStringType:
    is_a: OpaType
    description: A string.
    slots:
    - openpolicyagent_type
    slot_usage:
      openpolicyagent_type:
        description: The kind of type.
        range: string
        required: true
        equals_string: string
      description:
        range: string
  OpaStaticProperty:
    description: A known key of an object type and the type of its value.
    attributes:
      key:
