---
# Written by scripts/opa_to_linkml.py from OPA's files. Edit the script, not this file.
id: https://w3id.org/lmodel/opa/common
name: common
title: OPA common types
description: >-
  Types that more than one OPA format uses: an open JSON object, and the Rego type declarations
  that capabilities and plans carry for built-in functions.
version: 1.22.2
source: >-
  https://github.com/open-policy-agent/opa/blob/482d9e368c2ddfed67ced59259fa6a247bb5f1e5/v1/types/types.go
license: Apache-2.0
see_also:
  - https://lmodel.github.io/opa
  - https://www.openpolicyagent.org/docs
annotations:
  upstream_tag: v1.22.2
  upstream_commit: 482d9e368c2ddfed67ced59259fa6a247bb5f1e5
  upstream_release_date: '2026-11-05'
  upstream_license: Apache-2.0
prefixes:
  openpolicyagent: https://w3id.org/lmodel/opa/
  linkml: https://w3id.org/linkml/
default_prefix: openpolicyagent
default_range: string
imports:
  - linkml:types
classes:
  OpaObject:
    description: A JSON object whose keys OPA leaves open.
    extra_slots:
      allowed: true
  OpaValue:
    description: Any JSON value.
    class_uri: linkml:Any
  OpaType:
    abstract: true
    description: >-
      A Rego type, as OPA's types package writes it in JSON. A named type is an argument or
      result of a built-in function, with a name and a description.
    attributes:
      name:
        description: The argument's or result's name, on a named type.
      description:
        description: What the argument or result holds, on a named type.
  OpaAnyType:
    is_a: OpaType
    description: A union of the types it lists in `of`, or any value when it lists none.
    attributes:
      type:
        description: The kind of type.
        range: string
        required: true
        equals_string: any
      of:
        description: The types the union admits.
        range: OpaType
        multivalued: true
        inlined: true
        inlined_as_list: true
  OpaArrayType:
    is_a: OpaType
    description: >-
      An array, with a type per position in `static` and one for the rest in `dynamic`.
    attributes:
      type:
        description: The kind of type.
        range: string
        required: true
        equals_string: array
      static:
        description: The type of each element by position.
        range: OpaType
        multivalued: true
        inlined: true
        inlined_as_list: true
      dynamic:
        description: The type of the elements after the static ones.
        range: OpaType
        inlined: true
  OpaBooleanType:
    is_a: OpaType
    description: A boolean.
    attributes:
      type:
        description: The kind of type.
        range: string
        required: true
        equals_string: boolean
  OpaFunctionType:
    is_a: OpaType
    description: A function, with its arguments, its result and a variadic argument type.
    attributes:
      type:
        description: The kind of type.
        range: string
        required: true
        equals_string: function
      args:
        description: The argument types, in order.
        range: OpaType
        multivalued: true
        inlined: true
        inlined_as_list: true
      result:
        description: The result type.
        range: OpaType
        inlined: true
      variadic:
        description: The type of any further arguments.
        range: OpaType
        inlined: true
  OpaNullType:
    is_a: OpaType
    description: The null value.
    attributes:
      type:
        description: The kind of type.
        range: string
        required: true
        equals_string: 'null'
  OpaNumberType:
    is_a: OpaType
    description: A number.
    attributes:
      type:
        description: The kind of type.
        range: string
        required: true
        equals_string: number
  OpaObjectType:
    is_a: OpaType
    description: >-
      An object, with typed known keys in `static` and a key and value type for the rest in
      `dynamic`.
    attributes:
      type:
        description: The kind of type.
        range: string
        required: true
        equals_string: object
      static:
        description: The known keys and the types of their values.
        range: OpaStaticProperty
        multivalued: true
        inlined: true
        inlined_as_list: true
      dynamic:
        description: The key type and value type of the other keys.
        range: OpaDynamicProperty
        inlined: true
  OpaSetType:
    is_a: OpaType
    description: A set, whose members have the type in `of`.
    attributes:
      type:
        description: The kind of type.
        range: string
        required: true
        equals_string: set
      of:
        description: The type of the set's members.
        range: OpaType
        inlined: true
  OpaStringType:
    is_a: OpaType
    description: A string.
    attributes:
      type:
        description: The kind of type.
        range: string
        required: true
        equals_string: string
  OpaStaticProperty:
    description: A known key of an object type and the type of its value.
    attributes:
      key:
        description: The key, as a JSON value.
        range: OpaValue
        required: true
      value:
        description: The type of the key's value.
        range: OpaType
        required: true
        inlined: true
  OpaDynamicProperty:
    description: The key type and value type that an object type gives its other keys.
    attributes:
      key:
        description: The type of the keys.
        range: OpaType
        required: true
        inlined: true
      value:
        description: The type of the values.
        range: OpaType
        required: true
        inlined: true
