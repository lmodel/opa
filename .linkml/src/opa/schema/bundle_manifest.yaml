---
# Written by scripts/opa_to_linkml.py from OPA's files. Edit the script, not this file.
id: https://w3id.org/lmodel/opa/bundle_manifest
name: bundle_manifest
title: OPA bundle manifest
description: >-
  The `.manifest` file of an OPA bundle: the bundle's revision, the data roots it owns, its
  Wasm modules, its Rego version and any metadata. It renders OPA's JSON Schema for the manifest,
  generated from v1/bundle/bundle.go.
version: 1.22.2
source: >-
  https://github.com/open-policy-agent/opa/blob/482d9e368c2ddfed67ced59259fa6a247bb5f1e5/v1/bundle/manifest.schema.json
license: Apache-2.0
see_also:
  - https://lmodel.github.io/opa
  - https://www.openpolicyagent.org/docs
  - https://openpolicyagent.org/schemas/bundle/v1/manifest.schema.json
annotations:
  upstream_tag: v1.22.2
  upstream_commit: 482d9e368c2ddfed67ced59259fa6a247bb5f1e5
  upstream_release_date: '2026-11-05'
  upstream_license: Apache-2.0
prefixes:
  openpolicyagent: https://w3id.org/lmodel/opa/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  opa_manifest: >-
    https://openpolicyagent.org/schemas/bundle/v1/manifest.schema.json#/$defs/
default_prefix: openpolicyagent
default_range: string
imports:
  - linkml:types
  - common
classes:
  OpaManifest:
    description: A bundle manifest. OPA's schema leaves the manifest open to other keys.
    exact_mappings:
      - opa_manifest:Manifest
    extra_slots:
      allowed: true
    attributes:
      file_rego_versions:
        range: OpaFileRegoVersion
        description: Rego versions for single files, which override `rego_version`.
        multivalued: true
        inlined: true
      metadata:
        range: OpaObject
        inlined: true
        description: Metadata the bundle's author adds.
      rego_version:
        range: integer
        description: 'The Rego version of the bundle''s files: 0 for v0, 1 for v1.'
      revision:
        range: string
        required: true
        description: The bundle's revision, a string the bundle's author chooses.
      roots:
        range: string
        multivalued: true
        description: >-
          The paths in the data tree the bundle owns. A bundle without the key owns the whole
          tree.
      wasm:
        range: OpaWasmResolver
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: The Wasm modules the bundle holds, and the entrypoints they resolve.
    tree_root: true
  OpaWasmResolver:
    description: A Wasm module in a bundle, and the entrypoint it resolves.
    exact_mappings:
      - opa_manifest:WasmResolver
    attributes:
      annotations:
        range: OpaObject
        inlined: true
        multivalued: true
        inlined_as_list: true
        description: The entrypoint's Rego annotations. OPA's schema leaves their shape open.
      entrypoint:
        range: string
        description: The entrypoint the module resolves.
      module:
        range: string
        description: The module's path in the bundle.
  OpaFileRegoVersion:
    description: The Rego version of one file in the bundle.
    attributes:
      path:
        description: The file's path in the bundle.
        key: true
      version:
        description: The file's Rego version.
        range: integer
        required: true
