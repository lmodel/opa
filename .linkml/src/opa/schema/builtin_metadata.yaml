---
# Written by scripts/opa_to_linkml.py from OPA's files. Edit the script, not this file.
id: https://w3id.org/lmodel/opa/builtin_metadata
name: builtin_metadata
title: OPA built-in function metadata
description: >-
  builtin_metadata.json, which OPA's genbuiltinmetadata command writes for the documentation:
  each built-in function with its arguments, its result, the OPA versions that have it and
  the other implementations that support it, keyed by name.
version: 1.22.2
source: >-
  https://github.com/open-policy-agent/opa/blob/482d9e368c2ddfed67ced59259fa6a247bb5f1e5/internal/cmd/genbuiltinmetadata/main.go
license: Apache-2.0
see_also:
  - https://lmodel.github.io/opa
  - https://www.openpolicyagent.org/docs
annotations:
  upstream_tag: v1.22.2
  upstream_commit: 482d9e368c2ddfed67ced59259fa6a247bb5f1e5
  upstream_release_date: '2026-11-05'
  upstream_license: Apache-2.0
prefixes:
  openpolicyagent: https://w3id.org/lmodel/opa/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
default_prefix: openpolicyagent
default_range: string
imports:
  - linkml:types
classes:
  OpaBuiltinMetadataCatalog:
    tree_root: true
    description: >-
      The catalogue: two keys that start with an underscore, and one key per built-in function,
      whose value describes it.
    attributes:
      categories:
        description: The categories, each with the names of its functions.
        range: OpaBuiltinCategory
        alias: _categories
        multivalued: true
        inlined: true
      implementations:
        description: The implementations of Rego besides OPA that the catalogue tracks.
        range: OpaImplementation
        alias: _implementations
        multivalued: true
        inlined: true
        inlined_as_list: true
    extra_slots:
      range_expression:
        range: OpaBuiltinMetadata
  OpaBuiltinCategory:
    description: A category of built-in functions.
    attributes:
      name:
        description: The category's name.
        key: true
        slot_uri: schema:name
      builtins:
        description: The names of the category's functions.
        multivalued: true
        required: true
  OpaImplementation:
    description: An implementation of Rego besides OPA.
    attributes:
      id:
        description: The implementation's key in each function's `implementations`.
        required: true
        slot_uri: schema:identifier
      label:
        description: The implementation's display name.
        required: true
      repo:
        description: The implementation's GitHub repository, as owner/name.
        required: true
      version:
        description: The implementation's version the catalogue reflects.
        required: true
        slot_uri: schema:version
  OpaBuiltinMetadata:
    description: What the catalogue says about one built-in function.
    attributes:
      description:
        description: What the function does.
        slot_uri: schema:description
      introduced:
        description: The OPA version that added the function.
        required: true
      available:
        description: The OPA versions that have the function, and `edge`.
        multivalued: true
        required: true
      wasm:
        description: Whether OPA's Wasm target implements the function.
        range: boolean
        required: true
      args:
        description: The arguments, in order.
        range: OpaBuiltinArgument
        multivalued: true
        inlined: true
        inlined_as_list: true
        required: true
      result:
        description: The result.
        range: OpaBuiltinResult
        inlined: true
        required: true
      implementations:
        description: >-
          The other implementations that support the function, with the version that added
          it.
        range: OpaImplementationSupport
        multivalued: true
        inlined: true
        required: true
      infix:
        description: The infix operator that calls the function.
      relation:
        description: Whether the function acts as a relation.
        range: boolean
      deprecated:
        description: Whether the function is deprecated.
        range: boolean
  OpaBuiltinArgument:
    description: An argument of a built-in function.
    attributes:
      name:
        description: The argument's name.
        slot_uri: schema:name
      description:
        description: What the argument holds.
        slot_uri: schema:description
      type:
        description: >-
          The argument's type, written as OPA prints types, such as `array[string]`.
        required: true
  OpaBuiltinResult:
    description: The result of a built-in function. Some functions declare none.
    attributes:
      name:
        description: The result's name.
        slot_uri: schema:name
      description:
        description: What the result holds.
        slot_uri: schema:description
      type:
        description: The result's type, written as OPA prints types.
  OpaImplementationSupport:
    description: >-
      An implementation that supports a function, and the version that added it.
    attributes:
      implementation:
        description: The implementation's id.
        key: true
      version:
        description: The implementation's version that added the function.
        required: true
        slot_uri: schema:version
