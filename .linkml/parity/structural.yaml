---
# Tier 3 of the parity check: each case of the corpus in tests/test_parity.py where the
# schema's verdict differs from OPA's JSON Schema's, with its reason. `here` says what
# the schema does with the case. The test fails when a case the file does not list
# differs, or when a listed case no longer differs.
differences:
  - definition: BlockStmt
    here: accepts
    cases:
      - drop:blocks
    reason: OPA's schema requires the key but allows null as its value. LinkML
      cannot state a required key whose value may be null, so the slot is optional
      here, and a document without the key passes.
  - definition: BuiltinFunc
    here: accepts
    cases:
      - drop:decl
    reason: OPA's schema requires the key but allows null as its value. LinkML
      cannot state a required key whose value may be null, so the slot is optional
      here, and a document without the key passes.
  - definition: BuiltinFunc
    here: rejects
    cases:
      - full
      - minimal
    reason: OPA's schema leaves a built-in function's declaration opaque. Here
      it is the function type OPA's Go code writes, so an object that is not a
      function type fails.
  - definition: CallDynamicStmt
    here: accepts
    cases:
