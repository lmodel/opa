  aims_entry_annex_a_control:
    description: The Annex A control a Statement of Applicability entry concerns.
    range: AimsAnnexAControl
  aims_objective_categories:
    description: The kinds of objective the record bears on.
    range: AimsObjectiveCategory
    multivalued: true
  aims_risk_source_categories:
    description: The kinds of risk source the record bears on.
    range: AimsRiskSourceCategory
    multivalued: true
enums:
  AimsClause:
    description: The numbered clauses and subclauses of the standard from 4 to 10, by their numbers. A
      value's description is this project's own summary, and the clause headings and the requirements
      are ISO's.
    in_subset:
    - aims_core
    permissible_values:
      clause_4:
        title: '4'
        description: Why the system exists and what it reaches.
      clause_4_1:
        title: '4.1'
        description: Matters inside and outside that bear on the system, climate among them, and the part
          the organization plays with AI.
      clause_4_2:
        title: '4.2'
        description: Who has a stake in the system, and what they want from it.
      clause_4_3:
        title: '4.3'
        description: Where the system stops, stated in writing.
      clause_4_4:
        title: '4.4'
        description: Having the system and its processes in place, and keeping them up.
      clause_5:
        title: '5'
        description: What top management must do.
      clause_5_1:
        title: '5.1'
        description: How top management shows it leads and backs the system.
      clause_5_2:
        title: '5.2'
        description: Management's written direction on AI.
      clause_5_3:
        title: '5.3'
        description: Who holds which duty and power, including who checks conformity and who reports on
          performance.
      clause_6:
        title: '6'
        description: Deciding what to do before doing it.
      clause_6_1:
        title: '6.1'
        description: Dealing with what could go well or badly.
      clause_6_1_1:
        title: 6.1.1
        description: Criteria for risk, and the actions planned on risks and opportunities.
      clause_6_1_2:
        title: 6.1.2
        description: A repeatable way to find, analyse and rank AI risks.
      clause_6_1_3:
        title: 6.1.3
        description: Choosing treatments and controls, with the Statement of Applicability and the plan.
      clause_6_1_4:
        title: 6.1.4
        description: A way to work out what AI systems may do to people and society.
      clause_6_2:
        title: '6.2'
        description: Measurable aims for AI, and how each will be reached.
      clause_6_3:
        title: '6.3'
        description: Changing the system in an orderly way.
      clause_7:
        title: '7'
        description: What the system needs in order to run.
      clause_7_1:
        title: '7.1'
        description: Providing what the system needs.
      clause_7_2:
        title: '7.2'
        description: People's ability to do the work, and the evidence of it.
      clause_7_3:
        title: '7.3'
        description: What those who work for the organization must know.
      clause_7_4:
        title: '7.4'
        description: Who is told what, when and how.
      clause_7_5:
        title: '7.5'
        description: Keeping information under control.
      clause_7_5_1:
        title: 7.5.1
        description: Which information the system holds.
      clause_7_5_2:
        title: 7.5.2
        description: Naming, formatting, reviewing and approving it.
      clause_7_5_3:
        title: 7.5.3
        description: Keeping it to hand and protected.
      clause_8:
        title: '8'
        description: Carrying out what was planned.
      clause_8_1:
        title: '8.1'
        description: Running and controlling the processes, including those from outside.
      clause_8_2:
        title: '8.2'
        description: Carrying out risk assessments, on schedule and when things change.
      clause_8_3:
        title: '8.3'
        description: Carrying out the treatment plan and checking that it works.
      clause_8_4:
        title: '8.4'
        description: Carrying out impact assessments, on schedule and when things change.
      clause_9:
        title: '9'
        description: Checking how the system is doing.
      clause_9_1:
        title: '9.1'
        description: What is measured, how and when, and what the results mean.
      clause_9_2:
        title: '9.2'
        description: Audits the organization runs on itself.
      clause_9_2_1:
        title: 9.2.1
        description: What such an audit must establish, and how often.
      clause_9_2_2:
        title: 9.2.2
        description: The plan for those audits, and how impartial they are.
      clause_9_3:
        title: '9.3'
        description: Top management's own look at the system.
      clause_9_3_1:
        title: 9.3.1
        description: How often it looks, and to what end.
      clause_9_3_2:
        title: 9.3.2
        description: What it must take in.
      clause_9_3_3:
        title: 9.3.3
        description: What it must produce.
      clause_10:
        title: '10'
        description: Getting better and putting things right.
      clause_10_1:
        title: '10.1'
        description: Making the system better over time.
      clause_10_2:
        title: '10.2'
        description: Dealing with an unmet requirement and removing its cause.
  AimsControlArea:
    description: The nine areas Annex A sorts its controls into, under names of this project's own. An
      area's number is its annotation.
    in_subset:
    - aims_annex_a
    permissible_values:
      policy_direction:
        title: A.2
        description: Written direction from management on AI, and how it fits with other policies.
        annotations:
          annex_a_clause: A.2
          control_count: '3'
      accountability:
        title: A.3
        description: Who answers for AI within the organization's walls, and the way worries are raised.
        annotations:
          annex_a_clause: A.3
          control_count: '2'
      system_resources:
        title: A.4
        description: 'What each AI system draws on: components, data, tools, computing and people.'
        annotations:
          annex_a_clause: A.4
          control_count: '5'
      impact_assessment:
        title: A.5
        description: Working out what AI systems may do to people and society.
        annotations:
          annex_a_clause: A.5
          control_count: '4'
      system_life_cycle:
        title: A.6
        description: Building and running AI systems, from the goals set for them to their logs.
        annotations:
          annex_a_clause: A.6
          control_count: '9'
      data_management:
        title: A.7
        description: 'The data AI systems use: how it is managed, obtained, kept fit, traced and readied.'
        annotations:
          annex_a_clause: A.7
          control_count: '5'
      stakeholder_information:
        title: A.8
        description: What users and others are told about a system, and their way to report harm.
        annotations:
          annex_a_clause: A.8
          control_count: '4'
      responsible_use:
        title: A.9
        description: How AI systems are put to use, against the organization's goals and the systems'
          documents.
        annotations:
          annex_a_clause: A.9
          control_count: '3'
      external_relationships:
        title: A.10
        description: Duties shared with partners, suppliers and customers.
        annotations:
          annex_a_clause: A.10
          control_count: '3'
  AimsAnnexAControl:
    description: The 38 reference controls of Annex A, by number. A value's title holds the number and
      a name of this project's own, and its description says in this project's words what the control
      asks for.
    comments:
    - The headings and the control text are ISO's, and appear nowhere here.
    in_subset:
    - aims_annex_a
    annotations:
      control_count: '38'
      iso42001_clause: Annex A
    permissible_values:
      a_2_2:
        title: A.2.2 Written direction on AI
        description: Set down in writing how the organization means to treat AI systems.
        annotations:
          area: policy_direction
      a_2_3:
        title: A.2.3 Fit with other policies
        description: Find where the organization's other policies touch its aims for AI, in either direction.
        annotations:
          area: policy_direction
      a_2_4:
        title: A.2.4 Regular policy check
        description: Look at the AI policy again on a schedule and whenever the need arises, to see that
          it still serves.
        annotations:
          area: policy_direction
      a_3_2:
        title: A.3.2 Who answers for what
        description: Decide who carries which duty for AI, as the organization's needs dictate.
        annotations:
          area: accountability
      a_3_3:
        title: A.3.3 A way to raise worries
        description: Give people a way to raise worries about the organization's part in a system, at
          any point in that system's life.
        annotations:
          area: accountability
      a_4_2:
        title: A.4.2 Inventory of what is needed
        description: List what each stage of a system's life, and other AI work, draws on.
        annotations:
          area: system_resources
      a_4_3:
        title: A.4.3 Record of data used
        description: Record facts about the data a system draws on.
        annotations:
          area: system_resources
      a_4_4:
        title: A.4.4 Record of tools used
        description: Record facts about the tools a system draws on.
        annotations:
          area: system_resources
      a_4_5:
        title: A.4.5 Record of infrastructure used
        description: Record facts about the hardware and computing a system draws on.
        annotations:
          area: system_resources
      a_4_6:
        title: A.4.6 Record of the people involved
        description: Record who works on a system across its whole life, and what skills they bring.
        annotations:
          area: system_resources
      a_5_2:
        title: A.5.2 Method for weighing consequences
        description: Set up a way to work out what a system could do to people and society over its life.
        annotations:
          area: impact_assessment
      a_5_3:
        title: A.5.3 Keeping assessment results
        description: Write down what each impact assessment found, and hold on to it for a set time.
        annotations:
          area: impact_assessment
      a_5_4:
        title: A.5.4 Effects on people
        description: Work out and record how a system could affect single persons or particular groups
          over its life.
        annotations:
          area: impact_assessment
      a_5_5:
        title: A.5.5 Effects on society
        description: Work out and record how a system could affect society over its life.
        annotations:
          area: impact_assessment
      a_6_1_2:
        title: A.6.1.2 Goals for building
        description: Set goals that steer responsible building, and work measures for them into the development
          cycle.
        annotations:
          area: system_life_cycle
          control_objective: A.6.1
      a_6_1_3:
        title: A.6.1.3 Defined ways of building
        description: Set down the particular processes for designing and building a system responsibly.
        annotations:
          area: system_life_cycle
          control_objective: A.6.1
      a_6_2_2:
        title: A.6.2.2 What a system must do
        description: Write down what a new system, or a large upgrade to one, must meet.
        annotations:
          area: system_life_cycle
          control_objective: A.6.2
      a_6_2_3:
        title: A.6.2.3 Build records
        description: Write down how a system was designed and built, against the goals and the requirements.
        annotations:
          area: system_life_cycle
          control_objective: A.6.2
      a_6_2_4:
        title: A.6.2.4 Checks and their criteria
        description: Set the checks that verify and validate a system, and say when each applies.
        annotations:
          area: system_life_cycle
          control_objective: A.6.2
      a_6_2_5:
        title: A.6.2.5 Going live
        description: Keep a plan for putting a system into service, and meet its conditions first.
        annotations:
          area: system_life_cycle
          control_objective: A.6.2
      a_6_2_6:
        title: A.6.2.6 Running and watching
        description: 'Set down what keeping a system in service takes: at least watching it, fixing it,
          updating it and supporting it.'
        annotations:
          area: system_life_cycle
          control_objective: A.6.2
      a_6_2_7:
        title: A.6.2.7 Documents per audience
        description: Decide what technical documents each kind of reader needs, and give them those documents
          in a suitable form.
        annotations:
          area: system_life_cycle
          control_objective: A.6.2
      a_6_2_8:
        title: A.6.2.8 Keeping logs
        description: Decide at which points in a system's life it keeps event logs, and keep them at least
          while it is in service.
        annotations:
          area: system_life_cycle
          control_objective: A.6.2
      a_7_2:
        title: A.7.2 Managing data for building
        description: Set down and follow processes that manage the data used to build systems.
        annotations:
          area: data_management
      a_7_3:
        title: A.7.3 Obtaining and choosing data
        description: Record how the data a system uses was obtained and picked.
        annotations:
          area: data_management
      a_7_4:
        title: A.7.4 Data fit for purpose
        description: State what quality data must have, and see that the data used to build and run a
          system has it.
        annotations:
          area: data_management
      a_7_5:
        title: A.7.5 Tracing where data came from
        description: Keep a process that records where data came from and what happened to it, while it
          and the system last.
        annotations:
          area: data_management
      a_7_6:
        title: A.7.6 Readying data
        description: Set criteria for choosing how data is made ready, and name the methods to use.
        annotations:
          area: data_management
      a_8_2:
        title: A.8.2 What users are told
        description: Work out what those who use a system need to know, and tell them.
        annotations:
          area: stakeholder_information
      a_8_3:
        title: A.8.3 Letting outsiders report harm
        description: Give people outside the organization a way to report harm a system has done.
        annotations:
          area: stakeholder_information
      a_8_4:
        title: A.8.4 Telling users about incidents
        description: Keep a plan for telling those who use a system when something goes wrong.
        annotations:
          area: stakeholder_information
      a_8_5:
        title: A.8.5 Duties to inform others
        description: Work out what the organization owes others by way of reports about a system.
        annotations:
          area: stakeholder_information
      a_9_2:
        title: A.9.2 Defined ways of using
        description: Set down the processes for using AI systems responsibly.
        annotations:
          area: responsible_use
      a_9_3:
        title: A.9.3 Goals for use
        description: Set goals that steer how AI systems are used responsibly.
        annotations:
          area: responsible_use
      a_9_4:
        title: A.9.4 Staying within documented use
        description: See that a system is used only as intended and as its documents say.
        annotations:
          area: responsible_use
      a_10_2:
        title: A.10.2 Sharing out duties
        description: Settle who carries which duty across a system's life, among the organization and
          those it deals with.
        annotations:
          area: external_relationships
      a_10_3:
        title: A.10.3 What is bought in
        description: Keep a process that holds what suppliers provide to how the organization means to
          treat AI.
        annotations:
          area: external_relationships
      a_10_4:
        title: A.10.4 Buyers' needs
        description: See that how the organization treats AI takes account of what its customers expect
          and want.
        annotations:
          area: external_relationships
  AimsLifecycleStage:
    description: The eight stages of the generic life cycle model that ISO/IEC 22989:2022 gives, which
      ISO/IEC 42001 points to.
    comments:
    - The standard lets an organization set its own stages, so a process can name its own model in aims_development_life_cycle_model.
    in_subset:
    - aims_ai_system_records
    annotations:
      annex_b_item: B.6.1.3
    permissible_values:
      inception:
        description: Someone sees a need, weighs whether to meet it, and sets goals.
      design_and_development:
        description: The system is designed and built.
      verification_and_validation:
        description: The system is checked against what was asked of it.
      deployment:
        description: The system is put into service.
      operation_and_monitoring:
        description: The system runs and is watched.
      continuous_validation:
        description: A system that goes on learning is checked again as it changes.
      re_evaluation:
        description: The system's results are weighed against its goals afresh.
      retirement:
        description: The system is taken out of service.
  AimsAiRole:
    description: The parts an organization or a person can play towards AI systems. The six families are
      those of ISO/IEC 22989:2022, and each more specific role names its family in an annotation.
    comments:
    - The standard says the list is open, so a part it does not name takes the family it falls under.
    in_subset:
    - aims_core
    annotations:
      iso42001_clause: '4.1'
    permissible_values:
      ai_provider:
        description: Offers AI systems or platforms to others.
      ai_platform_provider:
        description: Offers a platform that others build AI services on.
        annotations:
          role_family: ai_provider
      ai_product_or_service_provider:
        description: Offers goods or services that hold an AI system.
        annotations:
          role_family: ai_provider
      ai_producer:
        description: Makes AI systems.
      ai_developer:
        description: Writes and trains what goes into a system.
        annotations:
          role_family: ai_producer
      ai_designer:
        description: Decides how a system should work.
        annotations:
          role_family: ai_producer
      ai_operator:
        description: Keeps a system running.
        annotations:
          role_family: ai_producer
      ai_tester_or_evaluator:
        description: Checks how well a system does.
        annotations:
          role_family: ai_producer
      ai_deployer:
        description: Puts a system into service.
        annotations:
          role_family: ai_producer
      ai_human_factor_professional:
        description: Looks after how people and a system work together.
        annotations:
          role_family: ai_producer
      domain_expert:
        description: Knows the field a system is used in.
        annotations:
          role_family: ai_producer
      ai_impact_assessor:
        description: Weighs what a system may do to people and society.
        annotations:
          role_family: ai_producer
      procurer:
        description: Buys systems or their parts.
        annotations:
          role_family: ai_producer
      ai_governance_professional:
        description: Oversees how AI is run and held to account.
        annotations:
          role_family: ai_producer
      ai_customer:
        description: Takes AI systems from a provider.
      ai_user:
        description: Works with a system directly.
        annotations:
          role_family: ai_customer
      ai_partner:
        description: Helps others make or run AI systems.
      ai_system_integrator:
        description: Joins a system to others.
        annotations:
          role_family: ai_partner
      data_provider:
        description: Supplies data for a system.
        annotations:
          role_family: ai_partner
      ai_subject:
        description: Is affected by what a system decides or does.
      data_subject:
        description: Is someone a system's data is about.
        annotations:
          role_family: ai_subject
      other_subject:
        description: Is affected in some other way.
        annotations:
          role_family: ai_subject
      relevant_authority:
        description: Sets or enforces rules for AI.
      policy_maker:
        description: Sets the rules.
        annotations:
          role_family: relevant_authority
      regulator:
        description: Enforces the rules.
        annotations:
          role_family: relevant_authority
  AimsPiiRole:
    description: The parts a party can play when personal data passes through AI, which ISO/IEC 29100
      describes.
    in_subset:
    - aims_core
    annotations:
      annex_b_item: B.10.2
    permissible_values:
      pii_controller:
        description: Decides why and how personal data is processed.
        close_mappings:
        - iso29100:PfPiiController
      joint_pii_controller:
        description: Makes those decisions together with another party.
        broad_mappings:
        - iso29100:PfPiiController
      pii_processor:
        description: Processes personal data on a controller's behalf.
        close_mappings:
        - iso29100:PfPiiProcessor
  AimsObjectivePurpose:
    description: What an AI objective is for. Clause 6.2 asks for objectives in general, and two Annex
      A controls ask for objectives of a narrower kind.
    in_subset:
    - aims_core
    annotations:
      iso42001_clause: '6.2'
    permissible_values:
      organizational:
        description: An objective for the whole system.
        annotations:
          iso42001_clause: '6.2'
      responsible_development:
        description: A goal that steers how systems are built.
        annotations:
          annex_a_control: A.6.1.2
      responsible_use:
        description: A goal that steers how systems are used.
        annotations:
          annex_a_control: A.9.3
  AimsObjectiveCategory:
    description: 'Kinds of objective an organization may set for AI: those Annex C lists, two more from
      the guidance on responsible use, and other.'
    in_subset:
    - aims_core
    annotations:
      annex_c_item: C.2
    permissible_values:
      accountability:
        description: Someone stays answerable for what a system helps to do.
        annotations:
          annex_c_item: C.2.1
      ai_expertise:
        description: The organization has people with the skills AI calls for.
        annotations:
          annex_c_item: C.2.2
      training_and_test_data:
        description: Good data to train and check a system is to hand.
        annotations:
          annex_c_item: C.2.3
      environmental_impact:
        description: A system's effect on the environment is kept in view.
        annotations:
          annex_c_item: C.2.4
      fairness:
        description: Automated decisions do not wrong particular persons or groups.
        annotations:
          annex_c_item: C.2.5
      maintainability:
        description: Defects can be mended and new needs met.
        annotations:
          annex_c_item: C.2.6
      privacy:
        description: Data about people, sensitive data above all, is neither misused nor exposed.
        annotations:
          annex_c_item: C.2.7
      robustness:
        description: A system does as well on unseen data as on what it was trained on.
        annotations:
          annex_c_item: C.2.8
      safety:
        description: Nobody's life or health, and no property or part of nature, comes to harm.
        annotations:
          annex_c_item: C.2.9
      security:
        description: Threats peculiar to AI are met, beyond the usual ones.
        annotations:
          annex_c_item: C.2.10
      transparency_and_explainability:
        description: Those concerned can see how a system works and why it gave a result.
        annotations:
          annex_c_item: C.2.11
      reliability:
        description: A system keeps doing what it is meant to.
        annotations:
          annex_b_item: B.9.3
      accessibility:
        description: A system can be used by people with differing abilities.
        annotations:
          annex_b_item: B.9.3
      other:
        description: A kind of objective the organization sets for itself.
  AimsRiskSourceCategory:
    description: 'Kinds of source a risk from AI can come from: those Annex C lists, and other.'
    in_subset:
    - aims_risk_management
    annotations:
      annex_c_item: C.3
    permissible_values:
      complex_environment:
        description: A system works where situations vary widely, so its results are less sure.
        annotations:
          annex_c_item: C.3.1
      opaque_system:
        description: The organization cannot tell people enough about a system.
        annotations:
          annex_c_item: C.3.2
      level_of_automation:
        description: How much a system does alone, which bears on safety or fairness among others.
        annotations:
          annex_c_item: C.3.3
      machine_learning:
        description: The data a model learns from, or how it was gathered, is flawed.
        annotations:
          annex_c_item: C.3.4
      hardware:
        description: Faulty parts, or moving a trained model to other equipment.
        annotations:
          annex_c_item: C.3.5
      life_cycle:
        description: Flaws anywhere in a system's life, from design to retirement.
        annotations:
          annex_c_item: C.3.6
      technology_readiness:
        description: A technology is too new to know well, or so old it breeds complacency.
        annotations:
          annex_c_item: C.3.7
      other:
        description: A source the organization names for itself.
  AimsImpactSubject:
    description: Who an AI system's impact falls on.
    in_subset:
    - aims_risk_management
    annotations:
      iso42001_clause: 6.1.4
    permissible_values:
      individuals:
        description: Particular persons.
      groups_of_individuals:
        description: Groups of persons, such as children or workers.
      societies:
        description: Society at large.
  AimsImpactArea:
    description: 'Areas where AI systems can touch people or society: those the guidance on impact assessment
      names as examples, and other.'
    in_subset:
    - aims_risk_management
    permissible_values:
      fairness:
        description: Treating persons and groups even-handedly.
        annotations:
          annex_b_item: B.5.4
      accountability:
        description: Someone staying answerable for the outcome.
        annotations:
          annex_b_item: B.5.4
      transparency_and_explainability:
        description: Being able to see how a system works and why it gave a result.
        annotations:
          annex_b_item: B.5.4
      security_and_privacy:
        description: Keeping people's information safe and private.
        annotations:
          annex_b_item: B.5.4
      safety_and_health:
        description: Physical and mental harm and wellbeing.
        annotations:
          annex_b_item: B.5.4, B.5.5
      financial:
        description: What people stand to gain or lose in money.
        annotations:
          annex_b_item: B.5.4
      accessibility:
        description: Whether people with differing abilities can use a system.
        annotations:
          annex_b_item: B.5.4
      human_rights:
        description: Rights everyone holds.
        annotations:
          annex_b_item: B.5.2, B.5.4
      environmental_sustainability:
        description: Natural resources and emissions.
        annotations:
          annex_b_item: B.5.5
      economic:
        description: Jobs, access to finance, taxes and trade.
        annotations:
          annex_b_item: B.5.5
      government:
        description: Lawmaking, political falsehoods, defence of the state and the courts.
        annotations:
          annex_b_item: B.5.5
      culture_and_values:
        description: What a society holds to, and the biases a system can feed.
        annotations:
          annex_b_item: B.5.5
      other:
        description: An area the organization names for itself.
  AimsImpactDirection:
    description: Whether an impact helps or harms.
    in_subset:
    - aims_risk_management
    annotations:
      annex_b_item: B.5.3
    permissible_values:
      positive:
        description: It helps.
      negative:
        description: It harms.
  AimsResourceProvider:
    description: Who provides a resource an AI system draws on.
    in_subset:
    - aims_ai_system_records
    annotations:
      annex_b_item: B.4.2
    permissible_values:
      organization:
        description: The organization itself.
      customer:
        description: One of its customers.
      third_party:
        description: Someone else.
  AimsDataCategory:
    description: The parts data can play in machine learning.
    in_subset:
    - aims_ai_system_records
    annotations:
      annex_b_item: B.4.3
    permissible_values:
      training:
        description: Data a model learns from.
      validation:
        description: Data used to tune a model and compare versions of it.
      test:
        description: Data held back to see how a finished model does.
      production:
        description: Data a system meets in service.
  AimsDataPreparationMethod:
    description: 'Common ways of making data ready for AI: those the guidance names, and other.'
    in_subset:
    - aims_ai_system_records
    annotations:
      annex_b_item: B.7.6
    permissible_values:
      statistical_exploration:
        description: Looking at how the values are spread, and describing them.
      cleaning:
        description: Mending wrong values and dealing with gaps.
      imputation:
        description: Filling gaps by a method.
      normalization:
        description: Reshaping values to a common distribution or range.
      scaling:
        description: Bringing values to comparable sizes.
      labelling:
        description: Marking the values a model is to predict.
      encoding:
        description: Turning categories into numbers.
      other:
        description: A method the organization names for itself.
  AimsAiThreat:
    description: 'Threats to information security peculiar to AI: those the guidance names, and other.'
    in_subset:
    - aims_ai_system_records
    annotations:
      annex_b_item: B.6.2.3, B.6.2.6
    permissible_values:
      data_poisoning:
        description: Slipping bad data in to spoil what a model learns.
      model_stealing:
        description: Copying a model by querying it or by taking it.
      model_inversion:
        description: Working back from a model to the data it learned from.
      other:
        description: A threat the organization names for itself.
  AimsImplementationStatus:
    description: How far a control or a plan has been put into effect.
    in_subset:
    - aims_annex_a
    comments:
    - An Annex A control the organization leaves out has no implementation status; the Statement of Applicability
      records it as an AimsExcludedControl.
    permissible_values:
      not_started:
        description: Nothing has been done yet.
      planned:
        description: The work is planned, with a timeline.
      in_progress:
        description: The work is under way.
      implemented:
        description: The work is done and in operation.
  AimsRiskTreatmentOption:
    description: The ways of treating a risk, by the names ISO 31000 gives them.
    comments:
    - ISO/IEC 42001 asks an organization to choose options and names none, so these come from ISO 31000,
      as they do in lmodel/iso27001.
    in_subset:
    - aims_risk_management
    permissible_values:
      modify:
        description: Change the risk with controls that lower its likelihood or its consequences.
        aliases:
        - mitigate
        - reduce
      retain:
        description: Keep the risk as it is, with management's approval.
        aliases:
        - accept
      avoid:
        description: Remove the risk by stopping or changing what gives rise to it.
        aliases:
        - terminate
      share:
        description: Share the risk with another party, such as an insurer or a supplier.
        aliases:
        - transfer
  AimsRiskLevel:
    description: A five-point scale of risk level, for an organization that adopts it. ISO/IEC 42001 leaves
      the scale to the organization.
    in_subset:
    - aims_risk_management
    permissible_values:
      very_low:
        description: Small enough to need no action.
      low:
        description: Managed by routine procedures.
      medium:
        description: Needs management's attention and planned controls.
      high:
        description: Needs treatment first and escalation.
      critical:
        description: Threatens the organization's objectives and needs action at once.
  AimsLikelihood:
    description: A five-point scale of likelihood, for an organization that adopts it. ISO/IEC 42001 leaves
      the scale to the organization.
    in_subset:
    - aims_risk_management
    permissible_values:
      rare:
        description: Not expected to happen.
        annotations:
          numeric_value: '1'
      unlikely:
        description: Could happen, but is not expected to.
        annotations:
          numeric_value: '2'
      possible:
        description: Might happen at some point.
        annotations:
          numeric_value: '3'
      likely:
        description: Will probably happen.
        annotations:
          numeric_value: '4'
      almost_certain:
        description: Expected to happen.
        annotations:
          numeric_value: '5'
  AimsConsequence:
    description: A five-point scale of consequence, for an organization that adopts it. ISO/IEC 42001
      leaves the scale to the organization.
    in_subset:
    - aims_risk_management
    permissible_values:
      negligible:
        description: No noticeable effect.
        annotations:
          numeric_value: '1'
      minor:
        description: An effect normal operations absorb.
        annotations:
          numeric_value: '2'
      moderate:
        description: An effect that needs management to step in.
        annotations:
          numeric_value: '3'
      major:
        description: A serious effect on people, objectives or reputation.
        annotations:
          numeric_value: '4'
      severe:
        description: An effect that threatens lives or the organization's survival.
        annotations:
          numeric_value: '5'
  AimsDocumentKind:
    description: The kinds of documented information an AimsDocumentedInformation record holds. Policies
      have records of their own.
    in_subset:
    - aims_documented_information
    permissible_values:
      procedure:
        description: The steps for carrying out an activity the same way each time.
      standard:
        description: Mandatory requirements for a technology or a process.
      guideline:
        description: Recommended practice that supports a policy or a procedure.
      record:
        description: Evidence of what was done or achieved.
      plan:
        description: How the organization means to reach an objective.
      report:
        description: The formal output of an assessment, audit or review.
  AimsAuditType:
    description: Who carries out an audit, relative to the organization audited, as ISO 19011 sorts audits.
    in_subset:
    - aims_performance_evaluation
    annotations:
      iso42001_clause: '9.2'
    permissible_values:
      first_party:
        description: The organization audits itself, or someone audits it on its behalf.
        aliases:
        - internal
      second_party:
        description: A party with an interest in the organization audits it, such as a customer.
      third_party:
        description: An independent body audits it, such as a certification body or a regulator.
  AimsAuditFindingType:
    description: The kinds of audit finding.
    in_subset:
    - aims_performance_evaluation
    permissible_values:
      major_nonconformity:
        description: A requirement not met in a way that puts the system's results in doubt.
      minor_nonconformity:
        description: A requirement not met in an isolated way that leaves its results in reach.
      observation:
        description: A condition that could lead to a nonconformity if left alone.
        aliases:
        - opportunity_for_improvement
      positive_finding:
        description: Evidence of practice that works well.
  AimsIncidentCategory:
    description: What an incident involving an AI system concerns. ISO/IEC 42001 tells apart an incident
      of the system itself from one about security of information or about privacy.
    in_subset:
    - aims_ai_system_records
    annotations:
      annex_b_item: B.8.4
    permissible_values:
      ai_system:
        description: The system itself misbehaved or failed.
      information_security:
        description: Information was exposed, altered or made unavailable.
      privacy:
        description: Personal data was exposed or misused.
      safety:
        description: Someone or something was put in danger.
      other:
        description: Something the organization names for itself.
  AimsManagementSystemStandard:
    description: Management system standards Annex D names as ones to run this system beside, and other.
    in_subset:
    - aims_core
    annotations:
      annex_d_item: D.2
    permissible_values:
      iso_iec_27001:
        description: Managing information security.
      iso_iec_27701:
        description: Managing privacy of information.
      iso_9001:
        description: Managing quality.
      iso_22000:
        description: Managing food safety.
      iso_13485:
        description: Managing quality of medical devices.
      other:
        description: Another management system standard, generic or for one sector.
classes:
  AimsRecordMixin:
    mixin: true
    description: 'What every record of the system has, so that other records can refer to it: an identifier,
      a title and a description.'
    comments:
    - It is a mixin, not a base class, so that the adapt copy can re-root some record classes on LOKF's
      Concept and leave the others as they are. lokf adapt replaces aims_id with LOKF's id, and a class
      that declares id itself must descend from Concept.
    slots:
    - id
    - title
    - description
    slot_usage:
      title:
        required: true
        pattern: ^\s*\S
        range: string
      description:
        range: string
  AimsDocumentControlMixin:
    mixin: true
    description: 'The control that documented information is kept under: who wrote, owns and approved
      it, when it takes effect and is reviewed, how it is classified, kept and changed, and whether it
      came from outside.'
    in_subset:
    - aims_documented_information
    annotations:
      iso42001_clause: '7.5'
    attributes:
      aims_document_reference:
        description: The reference the organization's document control gives it.
        annotations:
          iso42001_clause: 7.5.2
      aims_document_version:
        description: The version of the document.
        annotations:
          iso42001_clause: 7.5.3
      aims_document_author:
        description: Who wrote the document.
        annotations:
          iso42001_clause: 7.5.2
      aims_document_owner:
        description: Who answers for the document's content and upkeep.
      aims_document_format:
        description: The document's format, such as its language or software version.
        annotations:
          iso42001_clause: 7.5.2
      aims_document_medium:
        description: What the document is held on, such as paper or an electronic system.
        annotations:
          iso42001_clause: 7.5.2
      aims_document_approver:
        description: Who approved the document.
        annotations:
          iso42001_clause: 7.5.2
      aims_document_approval_date:
        description: When the document was approved.
        range: date
        annotations:
          iso42001_clause: 7.5.2
      aims_document_effective_date:
        description: When the document takes effect.
        range: date
      aims_document_last_review_date:
        description: When the document was last reviewed.
        range: date
        annotations:
          iso42001_clause: 7.5.2
      aims_document_next_review_date:
        description: When the document is next due for review.
        range: date
      aims_document_status:
        description: Where the document stands in its life, in the organization's own terms, such as draft,
          approved or withdrawn.
      aims_document_classification:
        description: The information classification the document carries.
        annotations:
          iso42001_clause: 7.5.3
      aims_document_retention:
        description: How long the document is kept, as an ISO 8601 duration.
        range: aims_duration
        annotations:
          iso42001_clause: 7.5.3
      aims_document_disposition:
        description: What becomes of the document when that time is up.
        annotations:
          iso42001_clause: 7.5.3
      aims_document_distribution:
        description: Who gets the document, how they reach it and what they may do with it.
        multivalued: true
        annotations:
          iso42001_clause: 7.5.3
      aims_document_storage:
        description: How the document is stored so that it stays legible.
        annotations:
          iso42001_clause: 7.5.3
      aims_document_change_control:
        description: How changes to the document are controlled, such as version control.
        annotations:
          iso42001_clause: 7.5.3
      aims_document_external_origin:
        description: Whether the document comes from outside the organization and is kept because the
          system needs it.
        range: boolean
        annotations:
          iso42001_clause: 7.5.3
      aims_document_external_source:
        description: Who the document came from, when it comes from outside.
        annotations:
          iso42001_clause: 7.5.3
  AimsManagementSystem:
    mixins:
    - AimsRecordMixin
    description: 'One organization''s management system for AI: its scope and context, and every record
      it keeps, each kind in a list of its own.'
    in_subset:
    - aims_core
    annotations:
      iso42001_clause: '4.4'
    close_mappings:
    - iso27001:IsmsManagementSystem
    attributes:
      aims_organization:
        description: The organization that runs the system.
        range: AimsOrganization
        inlined: true
      aims_top_management:
        description: The person or group that runs the organization from the very top.
      aims_governing_body:
        description: The body top management answers to, such as a board, where there is one.
      aims_leadership_evidence:
        description: What shows that top management leads and commits to the system.
        multivalued: true
        annotations:
          iso42001_clause: '5.1'
      aims_scope:
        description: How far the system reaches, in the organization's words.
        annotations:
          iso42001_clause: '4.3'
      aims_scope_boundaries:
        description: Where the system stops.
        multivalued: true
        annotations:
          iso42001_clause: '4.3'
      aims_scope_applicability:
        description: What in the organization's work the system applies to.
        multivalued: true
        annotations:
          iso42001_clause: '4.3'
      aims_processes:
        description: The processes the system needs and how they work together.
        annotations:
          iso42001_clause: '4.4'
      aims_internal_issues:
        description: The matters inside the organization that bear on the system.
        multivalued: true
        annotations:
          iso42001_clause: '4.1'
      aims_external_issues:
        description: The matters outside the organization that bear on the system.
        multivalued: true
        annotations:
          iso42001_clause: '4.1'
      aims_planned_changes:
        description: The changes to the system that are planned.
        multivalued: true
        annotations:
          iso42001_clause: '6.3'
      aims_external_services:
        description: What the system takes from outside the organization and keeps under control.
        multivalued: true
        annotations:
          iso42001_clause: '8.1'
      aims_integrated_standards:
        description: Other standards for management systems that this one is run beside.
        range: AimsManagementSystemStandard
        multivalued: true
        annotations:
          annex_d_item: D.2
      aims_certification_status:
        description: Where the system stands with certification, in the organization's own terms.
      aims_certification_body:
        description: The body that certifies the system.
      aims_certification_date:
        description: When the system was certified.
        range: date
      aims_recertification_date:
        description: When the system is next due for recertification.
        range: date
      aims_interested_parties:
        description: The interested parties the system takes into account.
        range: AimsInterestedParty
        multivalued: true
        inlined: true
        inlined_as_list: true
      aims_policy:
        description: The AI policy.
        range: AimsPolicy
        inlined: true
      aims_topic_specific_policies:
        description: The policies on single topics under the AI policy.
        range: AimsTopicSpecificPolicy
        multivalued: true
        inlined: true
        inlined_as_list: true
      aims_roles:
        description: The roles that carry the system's duties and powers.
        range: AimsRole
        multivalued: true
        inlined: true
        inlined_as_list: true
      aims_objectives:
        description: The AI objectives.
        range: AimsObjective
        multivalued: true
        inlined: true
        inlined_as_list: true
      aims_planned_actions:
        description: The actions planned on risks and opportunities.
        range: AimsPlannedAction
        multivalued: true
        inlined: true
        inlined_as_list: true
      aims_risk_assessment_process:
        description: The process for assessing AI risks.
        range: AimsRiskAssessmentProcess
        inlined: true
      aims_risk_treatment_process:
        description: The process for treating AI risks.
        range: AimsRiskTreatmentProcess
        inlined: true
      aims_impact_assessment_process:
        description: The process for assessing what AI systems may do to people and society.
        range: AimsImpactAssessmentProcess
        inlined: true
      aims_risk_assessments:
        description: The risk assessments carried out.
        range: AimsRiskAssessment
        multivalued: true
        inlined: true
        inlined_as_list: true
      aims_risks:
        description: The risks identified, the risk register.
        range: AimsRisk
        multivalued: true
        inlined: true
        inlined_as_list: true
      aims_risk_treatment_plans:
        description: The risk treatment plans.
        range: AimsRiskTreatmentPlan
        multivalued: true
        inlined: true
        inlined_as_list: true
      aims_impact_assessments:
        description: The impact assessments carried out.
        range: AimsImpactAssessment
        multivalued: true
        inlined: true
        inlined_as_list: true
      aims_statement_of_applicability:
        description: The Statement of Applicability.
        range: AimsStatementOfApplicability
        inlined: true
      aims_controls:
        description: The controls the organization has determined it needs.
        range: AimsControl
        multivalued: true
        inlined: true
        inlined_as_list: true
      aims_systems:
        description: The AI systems the management system covers.
        range: AimsAiSystem
        multivalued: true
        inlined: true
        inlined_as_list: true
      aims_system_resources:
        description: The resources those AI systems draw on, each told apart by its type.
