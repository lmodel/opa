- lokf
subsets:
  aims_core:
    description: The records of the system's context, leadership, planning and support (clauses 4 to 7).
  aims_risk_management:
    description: The records of risk assessment, risk treatment and impact assessment (clauses 6.1, 8.2,
      8.3 and 8.4).
  aims_annex_a:
    description: The Annex A reference controls, the organization's own controls and the Statement of
      Applicability.
  aims_ai_system_records:
    description: The AI systems, their resources, data and documents, and what is told to those who use
      or depend on them (Annex A, areas A.4 and A.6 to A.9).
  aims_external_parties:
    description: The relationships with partners, suppliers and customers (Annex A, area A.10).
  aims_performance_evaluation:
    description: The records of monitoring, internal audit and management review (clause 9).
  aims_improvement:
    description: 'The records of getting better: improvements, nonconformities and what corrects them
      (clause 10).'
  aims_documented_information:
    description: The records that are documented information under document control (clause 7.5).
types:
  aims_duration:
    typeof: string
    base: str
    uri: xsd:duration
    description: A length of time as ISO 8601 writes it, such as P7Y for seven years or P30D for thirty
      days.
    comments:
    - The pattern is that of xsd:duration, which has no weeks, so two weeks is P14D.
    pattern: ^P(?=[0-9T])([0-9]+Y)?([0-9]+M)?([0-9]+D)?(T(?=[0-9])([0-9]+H)?([0-9]+M)?([0-9]+S)?)?$
slots:
  aims_resource_type:
    description: 'The kind of resource: AimsComponentResource, AimsDataResource, AimsToolingResource,
      AimsComputingResource or AimsHumanResource.'
    range: string
  aims_entry_type:
    description: The kind of entry, AimsIncludedControl or AimsExcludedControl.
    range: string
  aims_relationship_type:
    description: 'The kind of record: AimsThirdPartyRelationship, AimsSupplierRelationship or AimsCustomerRelationship.'
    range: string
  aims_event_type:
    description: The kind of record, AimsSystemEvent or AimsIncident.
    range: string
  aims_responsible_role:
    description: The role that answers for the record's activity or outcome.
    range: AimsRole
  aims_relevant_controls:
    description: The organization's controls that the record concerns.
    range: AimsControl
    multivalued: true
  aims_ai_systems:
    description: The AI systems the record concerns.
    range: AimsAiSystem
    multivalued: true
  aims_implementation_state:
    description: How far the control or the plan has been put into effect.
    range: AimsImplementationStatus
  aims_cited_clauses:
    description: The clauses of the standard the record answers to or concerns.
    range: AimsClause
    multivalued: true
  aims_cited_annex_a_controls:
    description: The controls of Annex A the record answers to or concerns.
    range: AimsAnnexAControl
    multivalued: true
  aims_life_cycle_stages:
