      aims_finding_evidence:
        description: The objective evidence for the finding.
      aims_finding_root_cause:
        description: What the analysis of the finding's cause found.
      aims_finding_risk:
        description: What the finding means for risk.
      aims_finding_recommendation:
        description: What the auditor recommends.
      aims_finding_auditee_response:
        description: How the auditee responded.
      aims_finding_corrective_action:
        description: The corrective action the finding led to.
        range: AimsCorrectiveAction
      aims_finding_nonconformity:
        description: The nonconformity the finding recorded, for a finding of one.
        range: AimsNonconformity
        annotations:
          iso42001_clause: '10.2'
      aims_finding_closure_status:
        description: Whether the finding is closed, in the organization's own terms.
