  AimsSupplierRelationship:
    is_a: AimsThirdPartyRelationship
    description: 'A relationship with a supplier to the organization''s AI work: what it provides, the
      risk that brings, and how it is held to the organization''s approach.'
    in_subset:
    - aims_external_parties
    annotations:
      annex_a_control: A.10.3
    attributes:
      aims_supplier_provides:
        description: What it provides, such as data, models, software or a whole system.
        multivalued: true
        annotations:
          annex_b_item: B.10.3
      aims_supplier_risk:
        description: How much risk what it provides brings.
        range: AimsRiskLevel
        annotations:
          annex_b_item: B.10.3
      aims_supplier_requirements:
        description: What the organization asks of the supplier.
        multivalued: true
        annotations:
          annex_b_item: B.10.3
      aims_supplier_monitoring:
        description: How the supplier is watched and judged over time.
        annotations:
          annex_b_item: B.10.3
      aims_supplier_integration:
        description: How what it provides is joined to the organization's systems.
        annotations:
          annex_b_item: B.10.3
      aims_supplier_corrective_actions:
        description: What the supplier was asked to put right.
        multivalued: true
        annotations:
          annex_b_item: B.10.3
  AimsCustomerRelationship:
    is_a: AimsThirdPartyRelationship
    description: 'A relationship with a customer of the organization''s AI work: what it expects, who
      answers for what, and which limits it was told of.'
    in_subset:
    - aims_external_parties
    annotations:
      annex_a_control: A.10.4
    attributes:
      aims_customer_expectations:
        description: What the customer expects and wants.
        multivalued: true
        annotations:
          annex_a_control: A.10.4
      aims_customer_agreement:
        description: The contract or terms of use that apply.
        annotations:
          annex_b_item: B.10.4
      aims_customer_responsibility_split:
        description: What the provider answers for, and what the customer answers for.
        annotations:
          annex_b_item: B.10.4
      aims_customer_communicated_limits:
        description: What the customer was told the system cannot do, or where it stops being valid.
        multivalued: true
        annotations:
          annex_b_item: B.10.4
  AimsSystemEvent:
    mixins:
    - AimsRecordMixin
    description: Something that happened with a system and was reported, by monitoring, by a user or by
      someone outside, and the assessment of whether it is an incident. An event assessed as an incident
      is recorded as an AimsIncident.
    in_subset:
    - aims_ai_system_records
    annotations:
      annex_a_control: A.8.3
    slots:
    - aims_event_type
    - aims_ai_systems
    slot_usage:
      aims_event_type:
        required: true
    attributes:
      aims_event_occurred_at:
        description: When the event happened, or when it was first noticed.
        range: datetime
      aims_event_reporter:
        description: Who reported the event.
      aims_event_source:
        description: How the event came to light, such as a log, monitoring or a report from outside.
      aims_event_adverse_impact:
        description: The harm that was reported, if any.
        annotations:
          annex_a_control: A.8.3
      aims_event_assessment:
        description: What the assessment of the event found.
  AimsIncident:
    is_a: AimsSystemEvent
    description: 'An event assessed as an incident: what it concerns, how severe it is, what was done,
      who was told, and what was learned.'
    in_subset:
    - aims_ai_system_records
    annotations:
      annex_a_control: A.8.4
    attributes:
      aims_incident_category:
        description: What the incident concerns.
        range: AimsIncidentCategory
        annotations:
          annex_b_item: B.8.4
      aims_incident_threats:
        description: The threats peculiar to AI that the incident involved.
        range: AimsAiThreat
        multivalued: true
      aims_incident_severity:
        description: How severe the incident is.
        range: AimsRiskLevel
      aims_incident_impact_areas:
        description: The areas of impact the incident touched.
        range: AimsImpactArea
        multivalued: true
      aims_incident_detection_method:
        description: How the incident was detected.
      aims_incident_response_actions:
        description: What was done in response.
        multivalued: true
      aims_incident_recovery_actions:
        description: What was done to restore normal operation.
        multivalued: true
      aims_incident_root_cause:
        description: What caused the incident.
      aims_incident_lessons_learned:
        description: What the organization learned from it.
        multivalued: true
      aims_incident_notification_required:
        description: Whether users, authorities or others had to be told.
        range: boolean
        annotations:
          annex_b_item: B.8.4
      aims_incident_notifications:
        description: Whom the organization told, and when.
        multivalued: true
        annotations:
          annex_a_control: A.8.4
      aims_incident_corrective_actions:
        description: The corrective actions the incident led to.
        range: AimsCorrectiveAction
        multivalued: true
      aims_incident_closed_at:
        description: When the incident was closed.
        range: datetime
  AimsConcernReportingProcess:
    mixins:
    - AimsRecordMixin
    - AimsDocumentControlMixin
    description: 'The way people raise worries about the organization''s part in a system: how it keeps
      them safe, who looks into a worry, and how fast it answers.'
    in_subset:
    - aims_ai_system_records
    - aims_documented_information
    annotations:
      annex_a_control: A.3.3
    attributes:
      aims_concern_process_confidentiality:
        description: The ways a person can stay unnamed or keep a report private.
        multivalued: true
        annotations:
          annex_b_item: B.3.3
      aims_concern_process_audience:
        description: How staff and contractors learn of it and reach it.
        annotations:
          annex_b_item: B.3.3
      aims_concern_process_investigators:
        description: Who looks into a report, and what powers they hold.
        annotations:
          annex_b_item: B.3.3
      aims_concern_process_escalation:
        description: How a report reaches management in good time.
        annotations:
          annex_b_item: B.3.3
      aims_concern_process_reprisal_protection:
        description: How those who report or investigate are shielded from reprisal.
        annotations:
          annex_b_item: B.3.3
      aims_concern_process_response_time:
        description: How soon a report is answered.
        annotations:
          annex_b_item: B.3.3
  AimsConcernReport:
    mixins:
    - AimsRecordMixin
    description: One worry someone raised about the organization's part in a system, and how it was looked
      into and settled.
    in_subset:
    - aims_ai_system_records
    annotations:
      annex_a_control: A.3.3
    slots:
    - aims_ai_systems
    attributes:
      aims_concern_reported_on:
        description: When the worry was raised.
        range: date
      aims_concern_reporter:
        description: Who raised it, unless they stayed unnamed.
      aims_concern_anonymous:
        description: Whether the person stayed unnamed.
        range: boolean
      aims_concern_channel:
        description: How it was raised.
      aims_concern_life_cycle_stage:
        description: The stage of the system's life it concerns.
        range: AimsLifecycleStage
      aims_concern_severity:
        description: How serious it is.
        range: AimsRiskLevel
      aims_concern_investigator:
        description: Who looked into it.
      aims_concern_investigation_status:
        description: Where the inquiry stands, in the organization's own terms.
      aims_concern_findings:
        description: What the inquiry found.
      aims_concern_escalation:
        description: Whether and how it went up to management.
      aims_concern_response_due:
        description: When an answer is due.
        range: date
      aims_concern_responded_on:
        description: When it was answered.
        range: date
      aims_concern_resolution:
        description: How it was settled.
      aims_concern_reprisal_protection:
        description: What was done to shield those involved from reprisal.
      aims_concern_incidents:
        description: The incidents it relates to.
        range: AimsIncident
        multivalued: true
      aims_concern_nonconformities:
        description: The nonconformities it relates to.
        range: AimsNonconformity
        multivalued: true
notes:
- 'Adapted for LOKF by `lokf adapt`. re-rooted on lokf:Concept: AimsPolicy, AimsTopicSpecificPolicy, AimsRole,
  AimsControl, AimsAiSystem, AimsSystemResource, AimsDevelopmentProcess, AimsResponsibleUseProcess, AimsDocumentedInformation,
  AimsOperationalProcedure; dropped for LOKF''s: aims_id; folded into LOKF''s: title -> title, description
  -> description; designators demoted: aims_resource_type, aims_entry_type, aims_relationship_type, aims_event_type.'
