        annotations:
          iso42001_clause: 6.1.4
      aims_impact_demographic_groups:
        description: The groups of people the system is meant for or touches.
        multivalued: true
        annotations:
          annex_b_item: B.5.3
      aims_impact_system_complexity:
        description: How complex the system is.
        annotations:
          annex_b_item: B.5.3
      aims_impact_human_role:
        description: What part people play beside the system, and their means of oversight.
        annotations:
          annex_b_item: B.5.3
      aims_impact_failures:
        description: The failures that can be foreseen, their effects and what limits them.
