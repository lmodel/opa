      aims_implementation_state:
        required: true
    attributes:
      aims_included_control:
        description: The organization's control the entry includes.
        range: AimsControl
      aims_included_risks:
        description: The risks the control answers to.
        range: AimsRisk
        multivalued: true
      aims_included_evidence:
        description: What shows that the control is in place.
      aims_included_target_date:
        description: When the control is to be in place, if it is not yet.
        range: date
  AimsExcludedControl:
