    - description: A finding that names a nonconformity record is a finding of a nonconformity.
      preconditions:
        slot_conditions:
          aims_finding_nonconformity:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          aims_finding_type:
            equals_string_in:
            - major_nonconformity
            - minor_nonconformity
    attributes:
      aims_finding_type:
        description: What kind of finding it is.
        range: AimsAuditFindingType
        required: true
      aims_finding_control:
        description: The organization's control the finding concerns.
