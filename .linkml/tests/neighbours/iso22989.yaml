      iso22989_clause: 7.4.2
    attributes:
      aic_prediction_system:
        description: The system that produced it.
        range: AicSystem
        required: true
      aic_prediction_value:
        description: What it says.
        required: true
      aic_prediction_confidence:
        description: How sure the system was, from 0 to 1.
        range: float
        minimum_value: 0
        maximum_value: 1
  AicDecision:
    mixins:
    - AicRecordMixin
