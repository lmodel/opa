# Generated by `lokf adapt` from iso22989.yaml (iso22989 2022); do not edit.
# Imports lokf: a domain schema lists this file beside it (SPEC 6.2).
id: https://w3id.org/lmodel/iso22989-lokf
name: iso22989
title: ISO/IEC 22989:2022 AI concepts and terminology
description: 'A LinkML vocabulary for describing an AI system in the terms of ISO/IEC 22989:2022: the
  system and its kinds, its models, data and tasks, its place in the life cycle, the parties around it,
  the trustworthiness claims made for it, and the fields and applications it belongs to.'
version: '2022'
source: https://www.iso.org/standard/74296.html
license: Apache-2.0
see_also:
- https://lmodel.github.io/iso22989
- https://www.iso.org/standard/74296.html
annotations:
  standard: ISO/IEC 22989:2022
  edition: '1'
  publication_date: '2022-07-19'
  iso_open_data_date: '2026-11-05'
comments:
- The version is the edition the schema models, and source is ISO's page for that edition. ISO Open Data's
  records of it and of the two amendments in progress are copied to src/iso22989/schema/iso-open-data/
  as of the date in the annotations, and scripts/check_upstream_release.py reports when ISO publishes
  one of them or another edition. The release tags are the schema's own versions.
- ISO/IEC 22989 is copyright ISO and IEC, and none of its text is reproduced here. Each element cites
  what it renders by number, in the iso22989_term annotation for a term of Clause 3 and the iso22989_clause
  annotation for a clause, and its description is this project's own words. A reader with a licensed copy
  looks the standard's wording up there by those numbers.
- tests/iso22989_numbers.yaml lists every term number and says which element renders it, or why none does.
- Every record that other records refer to has an aic_id, and a reference holds that identifier. AicEcosystem
  holds each kind of record in a list of its own.
default_prefix: iso22989
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  iso22989: https://w3id.org/lmodel/iso22989/
  schema: http://schema.org/
  gist_ontology: https://w3id.org/semanticarts/ns/ontology/gist/
  nist_ai_100_1: https://w3id.org/lmodel/nist-ai-100-1/
  spdx_ai: https://spdx.org/rdf/3.0.1/terms/AI/
  spdx_dataset: https://spdx.org/rdf/3.0.1/terms/Dataset/
  uco-observable: https://ontology.unifiedcyberontology.org/uco/observable/
  uco-role: https://ontology.unifiedcyberontology.org/uco/role/
imports:
- linkml:types
- lokf
subsets:
  aic_systems:
    description: AI systems, their kinds and their parts (clauses 5.1 to 5.9, 5.13 and 8.2).
  aic_data:
    description: Datasets and the work done on them (clauses 5.10 and 8.6).
  aic_machine_learning:
    description: Models and how they learn (clauses 5.11, 5.12 and 8.4).
  aic_iot:
    description: Connected devices and physical systems (clause 5.14).
  aic_trustworthiness:
    description: Claims about an AI system and checks on it (clauses 5.15 and 5.16).
  aic_stakeholders:
    description: The parties around an AI system (clause 5.19).
  aic_lifecycle:
    description: The stages of an AI system's life and the work in each (clause 6).
  aic_functional_view:
    description: How a system moves from data to acting on its results (clause 7).
  aic_ecosystem:
    description: What surrounds AI systems, such as computing resources (clause 8).
  aic_fields_and_applications:
    description: The fields of AI and where systems are applied (clauses 9 and 10).
slots:
  aic_system_type:
    description: 'Which class this record is: AicSystem or a kind of it.'
    range: string
    required: true
  aic_model_type:
    description: 'Which class this record is: AicModel or a kind of it.'
    range: string
    required: true
enums:
  AicSystemScope:
    description: How wide a range of problems a system can take on.
    in_subset:
    - aic_systems
    annotations:
      iso22989_clause: '5.2'
    permissible_values:
      narrow_ai:
        description: Built for a bounded set of problems, and cannot move beyond them.
        annotations:
          iso22989_term: 3.1.24
      general_ai:
        description: Able to take on problems of many kinds, including ones it was not built for.
        annotations:
          iso22989_term: 3.1.14
  AicApproach:
    description: Whether a system works on explicit symbols or on learned numeric encodings.
    in_subset:
    - aic_systems
    annotations:
      iso22989_clause: '5.9'
    permissible_values:
      symbolic:
        description: Works by manipulating explicit symbols and the rules that relate them.
        annotations:
          iso22989_term: 3.1.33
      subsymbolic:
        description: Works on numeric encodings that carry meaning only as a whole, such as the weights
          of a network.
        annotations:
          iso22989_term: 3.1.34
  AicTechnique:
    description: A family of techniques a system is built with.
    in_subset:
    - aic_systems
    permissible_values:
      machine_learning:
        description: Fits a model's numbers to data rather than having a person write the logic.
        annotations:
          iso22989_term: 3.3.5
          iso22989_clause: '5.11'
      deep_learning:
        description: Machine learning that stacks many layers of a network.
        annotations:
          iso22989_term: 3.4.4
      cognitive_computing:
        description: Aims at interaction with people that feels closer to how people deal with one another.
        annotations:
          iso22989_term: 3.1.8
          iso22989_clause: '5.5'
      semantic_computing:
        description: Works out what content and requests mean, so that it can act on the meaning.
        annotations:
          iso22989_term: 3.1.31
          iso22989_clause: '5.6'
      soft_computing:
        description: Accepts inexact or uncertain reasoning where an exact answer would cost too much.
        annotations:
          iso22989_term: 3.1.32
          iso22989_clause: '5.7'
      genetic_algorithm:
        description: Searches by breeding and selecting candidate answers over many generations.
        annotations:
          iso22989_term: 3.1.15
          iso22989_clause: '5.8'
      logic_programming:
        description: States facts and rules in logic, and lets a solver reach the conclusions.
        annotations:
          iso22989_clause: 8.5.3
  AicAutonomy:
    description: Whether a system can change its own remit or stays under outside direction.
    in_subset:
    - aic_systems
    annotations:
      iso22989_clause: '5.13'
    permissible_values:
      autonomous:
        description: Can change what it is for or where it applies with nobody directing it.
        annotations:
          iso22989_term: 3.1.5
      heteronomous:
        description: Stays under the direction of a person or another system.
        annotations:
          iso22989_term: 3.1.16
  AicKnowledgeKind:
    description: Whether a body of knowledge states facts or steps.
    in_subset:
    - aic_systems
    annotations:
      iso22989_clause: '5.4'
    permissible_values:
      declarative:
        description: States what is the case.
        annotations:
          iso22989_term: 3.1.12
      procedural:
        description: States what to do, step by step.
        annotations:
          iso22989_term: 3.1.28
  AicFunctionalStep:
    description: A step in how a system gets from data to acting on its results.
    in_subset:
    - aic_functional_view
    annotations:
      iso22989_clause: '7'
    permissible_values:
      data_and_information:
        description: Taking in data and giving it meaning.
        annotations:
          iso22989_clause: '7.2'
      knowledge_and_learning:
        description: Building up what the system knows, and learning from more data.
        annotations:
          iso22989_clause: '7.3'
      prediction:
        description: Working out a likely result for the case in hand.
        annotations:
          iso22989_clause: 7.4.2
      decision:
        description: Choosing what to do, given the results so far.
        annotations:
          iso22989_clause: 7.4.3
      action:
        description: Carrying out what was chosen.
        annotations:
          iso22989_clause: 7.4.4
  AicLearningParadigm:
    description: How a model learns from its data.
    in_subset:
    - aic_machine_learning
    annotations:
      iso22989_clause: '5.11'
    permissible_values:
      supervised:
        description: Every example comes with the answer it should give.
        annotations:
          iso22989_term: 3.3.12
          iso22989_clause: 5.11.1
      unsupervised:
        description: No example comes with an answer, so the model looks for structure.
        annotations:
          iso22989_term: 3.3.17
          iso22989_clause: 5.11.2
      semi_supervised:
        description: Some examples come with answers and the rest do not.
        annotations:
          iso22989_term: 3.3.11
          iso22989_clause: 5.11.3
      reinforcement:
        description: The model acts, gets a reward or penalty, and adjusts to earn more reward.
        annotations:
          iso22989_term: 3.3.9
          iso22989_clause: 5.11.4
      transfer:
        description: What was learned on one problem gives a start on another.
        annotations:
          iso22989_clause: 5.11.5
  AicAlgorithmFamily:
    description: A family of algorithms that fit machine learning models.
    in_subset:
    - aic_machine_learning
    annotations:
      iso22989_term: 3.3.6
      iso22989_clause: '5.12'
    permissible_values:
      neural_network:
        description: Layers of simple units whose connection weights are tuned to the data.
        annotations:
          iso22989_clause: 5.12.1
      bayesian_network:
        description: A graph of variables and how the probability of one depends on others.
        annotations:
          iso22989_term: 3.3.1
          iso22989_clause: 5.12.2
      decision_tree:
        description: A series of branching tests that end in a result.
        annotations:
          iso22989_term: 3.3.2
          iso22989_clause: 5.12.3
      support_vector_machine:
        description: Finds the widest gap that separates the classes of example.
        annotations:
          iso22989_term: 3.3.13
          iso22989_clause: 5.12.4
  AicNetworkArchitecture:
    description: How the layers of a neural network are connected.
    in_subset:
    - aic_machine_learning
    annotations:
      iso22989_clause: 5.12.1
    permissible_values:
      feed_forward:
        description: Signals pass one way, from first layer to last, with no loops.
        annotations:
          iso22989_term: 3.4.6
      recurrent:
        description: Outputs feed back as inputs, so the network can follow a sequence.
        annotations:
          iso22989_term: 3.4.10
      long_short_term_memory:
        description: A recurrent design whose gates let it carry a signal across long sequences.
        annotations:
          iso22989_term: 3.4.7
      convolutional:
        description: Layers slide small filters across the input, as is usual for images.
        annotations:
          iso22989_term: 3.4.2
  AicDatasetRole:
    description: What a dataset is used for.
    in_subset:
    - aic_data
    permissible_values:
      training:
        description: Used to fit a model.
        annotations:
          iso22989_term: 3.3.16
          iso22989_clause: 5.11.6
      validation:
        description: Used while developing a model, to compare versions and tune settings.
        annotations:
          iso22989_term: 3.2.15
          iso22989_clause: 5.11.8
      test:
        description: Held back from development, to judge the finished model.
        annotations:
          iso22989_term: 3.2.14
          iso22989_clause: 5.11.8
      production:
        description: Gathered while the system runs, when it is deployed and in real use.
        annotations:
          iso22989_term: 3.2.12
      input:
        description: What a system is given so that it can work out a result.
        annotations:
          iso22989_term: 3.2.9
  AicDataProcessKind:
    description: A kind of work done on data before or while a model uses it.
    in_subset:
    - aic_data
    annotations:
      iso22989_clause: '5.10'
    permissible_values:
      data_annotation:
        description: Adds descriptive notes to data and leaves the data itself as it was.
        annotations:
          iso22989_term: 3.2.1
      data_quality_checking:
        description: Looks for gaps, skew and whatever else would limit the data's use.
        annotations:
          iso22989_term: 3.2.2
      data_augmentation:
        description: Makes new samples out of existing ones by altering them.
        annotations:
          iso22989_term: 3.2.3
      data_sampling:
        description: Picks a smaller part of the data that behaves like the whole.
        annotations:
          iso22989_term: 3.2.4
      exploratory_data_analysis:
        description: A first look at data to learn its shape and what it may hold.
        annotations:
          iso22989_term: 3.2.6
      imputation:
        description: Fills gaps with values worked out from what is there.
        annotations:
          iso22989_term: 3.2.8
  AicTrustworthinessProperty:
    description: A property a trustworthiness claim is about.
    in_subset:
    - aic_trustworthiness
    annotations:
      iso22989_clause: '5.15'
    comments:
    - 'Where a characteristic of NIST''s AI Risk Management Framework, as lmodel/nist-ai-100-1 renders
      it, holds a property, the value maps to it: broad where NIST joins the property with another, close
      for fairness.'
    permissible_values:
      robustness:
        description: Keeps performing well when conditions turn hostile or unusual.
        annotations:
          iso22989_term: 3.5.12
          iso22989_clause: 5.15.2
      reliability:
        description: Behaves and delivers as intended, time after time.
        annotations:
          iso22989_term: 3.5.9
          iso22989_clause: 5.15.3
        broad_mappings:
        - nist_ai_100_1:AiRmfCharacteristicName#valid_and_reliable
      resilience:
        description: Gets back to working order soon after something goes wrong.
        annotations:
          iso22989_term: 3.5.10
          iso22989_clause: 5.15.4
        broad_mappings:
        - nist_ai_100_1:AiRmfCharacteristicName#secure_and_resilient
      controllability:
        description: A person or another system can step in and steer it.
        annotations:
          iso22989_term: 3.5.5, 3.5.6
          iso22989_clause: 5.15.5
      explainability:
        description: Can say, in terms people follow, what drove a result.
        annotations:
          iso22989_term: 3.5.7
          iso22989_clause: 5.15.6
        broad_mappings:
        - nist_ai_100_1:AiRmfCharacteristicName#explainable_and_interpretable
      predictability:
        description: Lets people form sound expectations of what it will produce.
        annotations:
          iso22989_term: 3.5.8
          iso22989_clause: 5.15.7
      organizational_transparency:
        description: The organization tells those concerned what it does and decides.
        annotations:
          iso22989_term: 3.5.14
          iso22989_clause: 5.15.8
        broad_mappings:
        - nist_ai_100_1:AiRmfCharacteristicName#accountable_and_transparent
      system_transparency:
        description: Those concerned can learn what they need to know about the system.
        annotations:
          iso22989_term: 3.5.15
          iso22989_clause: 5.15.8
        broad_mappings:
        - nist_ai_100_1:AiRmfCharacteristicName#accountable_and_transparent
      bias_and_fairness:
        description: Whether the system treats some people or things worse than others, as a pattern.
        annotations:
          iso22989_term: 3.5.4
          iso22989_clause: 5.15.9
        close_mappings:
        - nist_ai_100_1:AiRmfCharacteristicName#fair_with_harmful_bias_managed
      accountability:
        description: Someone answers for what the system does and decides.
        annotations:
          iso22989_term: 3.5.1, 3.5.2
        broad_mappings:
        - nist_ai_100_1:AiRmfCharacteristicName#accountable_and_transparent
      availability:
        description: Those entitled to use it can reach it and use it when they ask.
        annotations:
          iso22989_term: 3.5.3
  AicAssessmentKind:
    description: Which question an assessment answers.
    in_subset:
    - aic_trustworthiness
    annotations:
      iso22989_clause: '5.16'
    permissible_values:
      verification:
        description: Evidence shows that the system meets what was specified for it.
        annotations:
          iso22989_term: 3.5.17
      validation:
        description: Evidence shows that the system suits the use it is meant for.
        annotations:
          iso22989_term: 3.5.18
  AicStakeholderRole:
    description: The part a party plays around an AI system.
    in_subset:
    - aic_stakeholders
    annotations:
      iso22989_clause: '5.19'
    permissible_values:
      ai_provider:
        description: Offers AI products or services, or the platform for them.
        annotations:
          iso22989_clause: 5.19.2
      ai_producer:
        description: Designs, builds, tests or runs AI systems.
        annotations:
          iso22989_clause: 5.19.3
      ai_customer:
        description: Takes an AI product or service for its own use.
        annotations:
          iso22989_clause: 5.19.4
      ai_partner:
        description: Helps others in the ecosystem, by integrating systems or supplying data.
        annotations:
          iso22989_clause: 5.19.5
      ai_subject:
        description: Is affected by an AI system, or has data about them used in it.
        annotations:
          iso22989_clause: 5.19.6
      relevant_authority:
        description: Sets policy for AI or holds others to the rules on it.
        annotations:
          iso22989_clause: 5.19.7
  AicStakeholderSubRole:
    description: A narrower part within one of the roles.
    in_subset:
    - aic_stakeholders
    comments:
    - Each value's role annotation names the role it sits under. The list is open, so a party whose part
      is not named here states its role alone.
    - lmodel/iso42001 names nine more parts under the AI producer role, from clause 4.1 of ISO/IEC 42001:2023.
      Only a copy of each standard can settle which parts each one names.
    permissible_values:
      ai_platform_provider:
        description: Offers the platform that others run AI on.
        annotations:
          role: ai_provider
      ai_product_or_service_provider:
        description: Offers a finished AI product or a service built on AI.
        annotations:
          role: ai_provider
      ai_developer:
        description: Writes and builds the system.
        annotations:
          role: ai_producer
      ai_user:
        description: Uses the system directly.
        annotations:
          role: ai_customer
      ai_system_integrator:
        description: Fits AI parts into a larger system.
        annotations:
          role: ai_partner
      data_provider:
        description: Supplies data that others build or run on.
        annotations:
          role: ai_partner
      data_subject:
        description: A person the data is about.
        annotations:
          role: ai_subject
      other_subject:
        description: Anyone else a system affects.
        annotations:
          role: ai_subject
      policy_maker:
        description: Decides policy on AI.
        annotations:
          role: relevant_authority
      regulator:
        description: Holds others to the rules on AI.
        annotations:
          role: relevant_authority
  AicLifecycleStage:
    description: A stage in an AI system's life.
    in_subset:
    - aic_lifecycle
    annotations:
      iso22989_term: 3.1.22
      iso22989_clause: '6.2'
    comments:
    - The related_mappings pair each stage with the OECD phase it answers to. Annex A of the standard
      sets the two accounts side by side, and this project has not checked the pairing against it; the
      retirement row rests on the OECD's text alone.
    permissible_values:
      inception:
        description: Deciding that a system is wanted, what it is for and whether it can be done.
        annotations:
          iso22989_clause: 6.2.2
        related_mappings:
        - iso22989:AicOecdLifecycleStage#plan_and_design
      design_and_development:
        description: Making the system, from its architecture through its data work to its models.
        annotations:
          iso22989_clause: 6.2.3
        related_mappings:
        - iso22989:AicOecdLifecycleStage#collect_and_process_data
        - iso22989:AicOecdLifecycleStage#build_and_use_model
      verification_and_validation:
        description: Checking what was made against its specification and against its purpose.
        annotations:
          iso22989_clause: 6.2.4
        related_mappings:
        - iso22989:AicOecdLifecycleStage#verify_and_validate
      deployment:
        description: Installing the system where it is to run, and making it ready for use.
        annotations:
          iso22989_clause: 6.2.5
        related_mappings:
        - iso22989:AicOecdLifecycleStage#deploy
      operation_and_monitoring:
        description: Running the system and keeping an eye on how it behaves.
        annotations:
          iso22989_clause: 6.2.6
        related_mappings:
        - iso22989:AicOecdLifecycleStage#operate_and_monitor
      continuous_validation:
        description: Repeating the checks on a system that goes on learning as it runs.
        annotations:
          iso22989_clause: 6.2.7
        related_mappings:
        - iso22989:AicOecdLifecycleStage#operate_and_monitor
      re_evaluation:
        description: Looking again at whether the running system still meets its aims.
        annotations:
          iso22989_clause: 6.2.8
        related_mappings:
        - iso22989:AicOecdLifecycleStage#operate_and_monitor
      retirement:
        description: Taking the system out of use.
        annotations:
          iso22989_clause: 6.2.9
        related_mappings:
        - iso22989:AicOecdLifecycleStage#retire_or_decommission
  AicOecdLifecycleStage:
    description: A phase of the OECD's account of an AI system's life, which Annex A sets beside the standard's.
    in_subset:
    - aic_lifecycle
    annotations:
      iso22989_clause: Annex A
      oecd_source: OECD/LEGAL/0449
    comments:
    - 'The first six values are the phases the OECD Recommendation on Artificial Intelligence (OECD/LEGAL/0449)
      named when the standard was published, as the OECD Framework for the Classification of AI Systems
      (2022) draws them. The Recommendation as revised on 3 May 2024 names seven: it adds retiring or
      decommissioning, widens building to adapting a model that exists, and widens checking to testing
      and evaluation. The descriptions follow the revised text, read at legalinstruments.oecd.org on 2026-11-05,
      and retire_or_decommission is here for a record that follows it.'
    - NIST's AI Risk Management Framework names the first six phases too, with deploy as deploy and use,
      and lmodel/nist-ai-100-1 renders them, so each maps to NIST's stage by close_mappings.
    permissible_values:
      plan_and_design:
        description: Setting out what the system is for and how it will work.
        close_mappings:
        - nist_ai_100_1:AiRmfLifecycleStageName#plan_and_design
      collect_and_process_data:
        description: Gathering and readying the data.
        close_mappings:
        - nist_ai_100_1:AiRmfLifecycleStageName#collect_and_process_data
      build_and_use_model:
        description: Making the model, or adapting one that exists, and trying it on the task.
        close_mappings:
        - nist_ai_100_1:AiRmfLifecycleStageName#build_and_use_model
      verify_and_validate:
        description: Testing and evaluating the system, and checking it against what was specified and
          what it is for.
        close_mappings:
        - nist_ai_100_1:AiRmfLifecycleStageName#verify_and_validate
      deploy:
        description: Making the system available for use.
        close_mappings:
        - nist_ai_100_1:AiRmfLifecycleStageName#deploy_and_use
      operate_and_monitor:
        description: Running the system and watching how it behaves.
        close_mappings:
        - nist_ai_100_1:AiRmfLifecycleStageName#operate_and_monitor
      retire_or_decommission:
        description: Taking the system out of service, a step that may come at any point while it runs.
  AicResourceKind:
    description: A kind of computing resource AI work runs on.
    in_subset:
    - aic_ecosystem
    annotations:
      iso22989_clause: '8.7'
    permissible_values:
      cloud:
        description: Computing bought as a shared service, in someone else's data centre.
        annotations:
          iso22989_clause: 8.6.2
      edge:
        description: Computing close to where data arises, rather than in a far data centre.
        annotations:
          iso22989_clause: 8.6.2
      application_specific_integrated_circuit:
        description: A chip made for one kind of work, such as training or running a model.
        annotations:
          iso22989_term: 3.1.6
          iso22989_clause: 8.7.2
  AicField:
    description: A field of AI a system belongs to.
    in_subset:
    - aic_fields_and_applications
    annotations:
      iso22989_clause: '9'
    permissible_values:
      computer_vision:
        description: Making sense of pictures and video.
        annotations:
          iso22989_term: 3.7.1
          iso22989_clause: '9.1'
      natural_language_processing:
        description: Making sense of, or producing, human language.
        annotations:
          iso22989_term: 3.6.9, 3.6.10
          iso22989_clause: '9.2'
      data_mining:
        description: Finding patterns in large amounts of numbers.
        annotations:
          iso22989_term: 3.1.11
          iso22989_clause: '9.3'
      planning:
        description: Working out a sequence of steps that reaches an aim.
        annotations:
          iso22989_term: 3.1.26
          iso22989_clause: '9.4'
  AicTaskKind:
    description: A named kind of task from the fields of language and vision.
    in_subset:
    - aic_fields_and_applications
    permissible_values:
      automatic_summarization:
        description: Cuts a text down to its main points.
        annotations:
          iso22989_term: 3.6.1
          iso22989_clause: 9.2.2
      dialogue_management:
        description: Decides what to say next in a conversation.
        annotations:
          iso22989_term: 3.6.2
          iso22989_clause: 9.2.2
      emotion_recognition:
        description: Works out the feeling a text or voice conveys.
        annotations:
          iso22989_term: 3.6.3
          iso22989_clause: 9.2.2
      information_retrieval:
        description: Finds stored documents that answer a need.
        annotations:
          iso22989_term: 3.6.4
          iso22989_clause: 9.2.2
      machine_translation:
        description: Renders text from one language in another.
        annotations:
          iso22989_term: 3.6.5
          iso22989_clause: 9.2.2
      named_entity_recognition:
        description: Spots the people, places and other named things in a text.
        annotations:
          iso22989_term: 3.6.6
          iso22989_clause: 9.2.2
      natural_language_generation:
        description: Writes text from data or from an internal form.
        annotations:
          iso22989_term: 3.6.8
          iso22989_clause: 9.2.2
      natural_language_understanding:
        description: Takes a text and draws out what it means.
        annotations:
          iso22989_term: 3.6.11
          iso22989_clause: 9.2.2
      optical_character_recognition:
        description: Reads printed or written characters from a picture.
        annotations:
          iso22989_term: 3.6.12
          iso22989_clause: 9.2.2
      part_of_speech_tagging:
        description: Marks each word as a noun, a verb and so on.
        annotations:
          iso22989_term: 3.6.13
          iso22989_clause: 9.2.2
      question_answering:
        description: Replies to a question put in everyday words.
        annotations:
          iso22989_term: 3.6.14
          iso22989_clause: 9.2.2
      relationship_extraction:
        description: Finds how the things a text names relate to one another.
        annotations:
          iso22989_term: 3.6.15
          iso22989_clause: 9.2.2
      sentiment_analysis:
        description: Works out the opinion a text expresses.
        annotations:
          iso22989_term: 3.6.16
          iso22989_clause: 9.2.2
      speech_recognition:
        description: Turns spoken words into text.
        annotations:
          iso22989_term: 3.6.17
          iso22989_clause: 9.2.2
      speech_synthesis:
        description: Turns text into spoken words.
        annotations:
          iso22989_term: 3.6.18
          iso22989_clause: 9.2.2
      face_recognition:
        description: Matches a face in a picture against stored faces.
        annotations:
          iso22989_term: 3.7.2
          iso22989_clause: '9.1'
      image_recognition:
        description: Says what a picture shows.
        annotations:
          iso22989_term: 3.7.4
          iso22989_clause: '9.1'
  AicApplicationDomain:
    description: A domain the standard works through as an application of AI.
    in_subset:
    - aic_fields_and_applications
    annotations:
      iso22989_clause: '10'
    permissible_values:
      fraud_detection:
        description: Spotting dishonest transactions or claims.
        annotations:
          iso22989_clause: '10.2'
      automated_vehicles:
        description: Vehicles that drive part or all of the way without a driver.
        annotations:
          iso22989_clause: '10.3'
      predictive_maintenance:
        description: Forecasting when equipment needs attention, before it fails.
        annotations:
          iso22989_clause: '10.4'
classes:
  AicRecordMixin:
    mixin: true
    description: 'What every record has, so that other records can refer to it: an identifier, a title
      and a description.'
    comments:
    - It is a mixin, not a base class, so that the adapt copy can re-root some record classes on LOKF's
      Concept and leave the others as they are. lokf adapt replaces aic_id with LOKF's id, and a class
      that declares id itself must descend from Concept.
    slots:
    - id
    - title
    - description
    slot_usage:
      title:
        required: true
        pattern: ^\s*\S
        range: string
      description:
        range: string
  AicEcosystem:
    mixins:
    - AicRecordMixin
    description: The AI systems around one context of use, with the data, resources and parties that surround
      them, each kind of record in a list of its own.
    in_subset:
    - aic_ecosystem
    annotations:
      iso22989_clause: '8'
    attributes:
      aic_ecosystem_systems:
        description: The AI systems.
        range: AicSystem
        multivalued: true
        inlined: true
        inlined_as_list: true
      aic_ecosystem_components:
        description: The parts of those systems.
        range: AicComponent
        multivalued: true
        inlined: true
        inlined_as_list: true
      aic_ecosystem_knowledge:
        description: The bodies of knowledge those systems draw on.
        range: AicKnowledge
        multivalued: true
        inlined: true
        inlined_as_list: true
      aic_ecosystem_tasks:
        description: The tasks those systems take on.
        range: AicTask
        multivalued: true
        inlined: true
        inlined_as_list: true
      aic_ecosystem_models:
        description: The models those systems use.
        range: AicModel
        multivalued: true
        inlined: true
        inlined_as_list: true
      aic_ecosystem_datasets:
        description: The datasets those systems and models use.
        range: AicDataset
        multivalued: true
        inlined: true
        inlined_as_list: true
      aic_ecosystem_stakeholders:
        description: The parties around those systems.
        range: AicStakeholder
        multivalued: true
        inlined: true
        inlined_as_list: true
      aic_ecosystem_lifecycle_processes:
        description: The work done at each stage of those systems' lives.
        range: AicLifecycleProcess
        multivalued: true
        inlined: true
        inlined_as_list: true
      aic_ecosystem_claims:
        description: The trustworthiness claims made for those systems.
        range: AicTrustworthinessClaim
        multivalued: true
        inlined: true
        inlined_as_list: true
      aic_ecosystem_assessments:
        description: The verification and validation of those systems.
        range: AicAssessment
        multivalued: true
        inlined: true
        inlined_as_list: true
      aic_ecosystem_predictions:
        description: The predictions those systems produced.
        range: AicPrediction
        multivalued: true
        inlined: true
        inlined_as_list: true
      aic_ecosystem_decisions:
        description: The decisions taken on those predictions.
        range: AicDecision
        multivalued: true
        inlined: true
        inlined_as_list: true
      aic_ecosystem_actions:
        description: The actions taken on those decisions.
        range: AicAction
        multivalued: true
        inlined: true
        inlined_as_list: true
      aic_ecosystem_applications:
        description: Where those systems are applied.
        range: AicApplication
        multivalued: true
        inlined: true
        inlined_as_list: true
      aic_ecosystem_resource_pools:
        description: The computing resources those systems run on.
        range: AicResourcePool
        multivalued: true
        inlined: true
        inlined_as_list: true
      aic_ecosystem_iot_devices:
        description: The connected devices in the ecosystem.
        range: AicIotDevice
        multivalued: true
        inlined: true
        inlined_as_list: true
      aic_ecosystem_iot_systems:
        description: The connected systems in the ecosystem.
        range: AicIotSystem
        multivalued: true
        inlined: true
        inlined_as_list: true
      aic_ecosystem_cyber_physical_systems:
        description: The cyber-physical systems in the ecosystem.
        range: AicCyberPhysicalSystem
        multivalued: true
        inlined: true
        inlined_as_list: true
  AicSystem:
    mixins:
    - AicRecordMixin
    description: A system built to produce results for goals set by people, using AI techniques, whatever
      else it is made of.
    in_subset:
    - aic_systems
    annotations:
      iso22989_term: 3.1.4
      iso22989_clause: '8.2'
    broad_mappings:
    - gist_ontology:System
    close_mappings:
    - nist_ai_100_1:AiSystem
    related_mappings:
    - spdx_ai:AIPackage
    comments:
    - gist's System is any composite whose parts work as a whole, so it is the wider term. SPDX's AIPackage
      describes a system as a distributed package.
    - NIST's AI system, as lmodel/nist-ai-100-1 renders it, is a machine-based system that produces outputs
      for given objectives, a definition NIST adapts from the OECD's, so the two are close.
    slots:
    - aic_system_type
    attributes:
      aic_system_purpose:
        description: What the system is meant to do.
      aic_system_scope:
        description: How wide a range of problems the system can take on.
        range: AicSystemScope
      aic_system_approaches:
        description: Whether it works symbolically, subsymbolically or both ways.
        range: AicApproach
        multivalued: true
      aic_system_techniques:
        description: The families of technique it is built with.
        range: AicTechnique
        multivalued: true
      aic_system_automated:
        description: Whether it runs without a person acting at each step, under the conditions given.
        range: boolean
        annotations:
          iso22989_term: 3.1.7
          iso22989_clause: '5.13'
      aic_system_autonomy:
        description: Whether it can change its own remit or stays under outside direction.
        range: AicAutonomy
      aic_system_human_teaming:
        description: How people and the system share the work, if they do.
        annotations:
          iso22989_term: 3.3.3
      aic_system_stage:
        description: The stage of its life the system is in now.
        range: AicLifecycleStage
      aic_system_fields:
        description: The fields of AI it belongs to.
        range: AicField
        multivalued: true
      aic_system_steps:
        description: The steps from data to action that it performs.
        range: AicFunctionalStep
        multivalued: true
      aic_system_components:
        description: The parts it is made of.
        range: AicComponent
        multivalued: true
      aic_system_models:
        description: The models it uses.
        range: AicModel
        multivalued: true
      aic_system_datasets:
        description: The datasets it uses.
        range: AicDataset
        multivalued: true
      aic_system_tasks:
        description: The tasks it takes on.
        range: AicTask
        multivalued: true
      aic_system_stakeholders:
        description: The parties around it.
        range: AicStakeholder
        multivalued: true
      aic_system_resource_pools:
        description: The computing resources it runs on.
        range: AicResourcePool
        multivalued: true
      aic_system_jurisdictional_issues:
        description: The legal questions that follow from where it is built, offered or used.
        multivalued: true
        annotations:
          iso22989_clause: '5.17'
      aic_system_societal_impacts:
        description: The effects it may have on people and society beyond its users.
        multivalued: true
        annotations:
          iso22989_clause: '5.18'
    is_a: Concept
  AicAgent:
    is_a: AicSystem
    description: A system that perceives its surroundings and acts on them in pursuit of goals.
    in_subset:
    - aic_systems
    annotations:
      iso22989_term: 3.1.1
      iso22989_clause: '5.3'
    attributes:
      aic_agent_goals:
        description: The goals the agent pursues.
        multivalued: true
        required: true
      aic_agent_environment:
        description: The surroundings the agent perceives and acts on.
  AicExpertSystem:
    is_a: AicSystem
    description: A system that puts what human specialists know into a form it can reason with.
    in_subset:
    - aic_systems
    annotations:
      iso22989_term: 3.1.13
      iso22989_clause: 8.5.2
    attributes:
      aic_expert_knowledge:
        description: The bodies of knowledge the system reasons with.
        range: AicKnowledge
        multivalued: true
        required: true
      aic_expert_inference:
        description: How the system draws conclusions from that knowledge.
        annotations:
          iso22989_term: 3.1.17
  AicRobot:
    is_a: AicSystem
    description: A system that moves or acts on physical things through its own actuators.
    in_subset:
    - aic_systems
    annotations:
      iso22989_term: 3.1.29
    broad_mappings:
    - gist_ontology:Equipment
    comments:
    - gist's Equipment is any tangible, human-made thing used for a task, so it is the wider term.
    attributes:
      aic_robot_actuators:
        description: The actuators through which the robot acts.
        multivalued: true
        required: true
      aic_robot_sensors:
        description: The sensors through which it perceives.
        multivalued: true
  AicComponent:
    mixins:
    - AicRecordMixin
    description: A part of a system that does one job in it.
    in_subset:
    - aic_systems
    annotations:
      iso22989_term: 3.1.2
    attributes:
      aic_component_step:
        description: The step from data to action this part performs.
        range: AicFunctionalStep
      aic_component_depends_on:
        description: The other parts this part needs.
        range: AicComponent
        multivalued: true
    is_a: Concept
  AicKnowledge:
    mixins:
    - AicRecordMixin
    description: A body of what a system knows, in a form it can use.
    in_subset:
    - aic_systems
    annotations:
      iso22989_term: 3.1.21
      iso22989_clause: '5.4'
    attributes:
      aic_knowledge_kind:
        description: Whether it states what is the case or what to do.
        range: AicKnowledgeKind
      aic_knowledge_representation:
        description: The form it is held in, such as rules, a graph or an ontology.
    is_a: Concept
  AicTask:
    mixins:
    - AicRecordMixin
    description: Something a system is asked to get done.
    in_subset:
    - aic_systems
    annotations:
      iso22989_term: 3.1.35
    related_mappings:
    - gist_ontology:Task
    comments:
    - gist's Task is a piece of work that is planned or under way, where this is what a system is asked
      to do.
    attributes:
      aic_task_kind:
        description: The named kind of task it is, where it is one.
        range: AicTaskKind
      aic_task_goal:
        description: What getting the task done achieves.
      aic_task_languages:
        description: The human languages the task works in, as language tags such as en or fr-CA.
        multivalued: true
        pattern: ^[A-Za-z]{2,8}(-[A-Za-z0-9]{1,8})*$
        annotations:
          iso22989_term: 3.6.7
      aic_task_performance_measures:
        description: What is measured to judge how well it is done, such as accuracy.
        multivalued: true
        annotations:
          iso22989_term: 3.1.25
    is_a: Concept
  AicModel:
    mixins:
    - AicRecordMixin
    description: A representation of something, made so that a system can compute with it.
    in_subset:
    - aic_machine_learning
    annotations:
      iso22989_term: 3.1.23
    slots:
    - aic_model_type
    attributes:
      aic_model_version:
        description: The version of the model, as its makers number it.
      aic_model_represents:
        description: What the model stands for, such as a process or a body of data.
    is_a: Concept
  AicMachineLearningModel:
    is_a: AicModel
    description: A model whose numbers were fitted to data by a training run.
    in_subset:
    - aic_machine_learning
    annotations:
      iso22989_term: 3.3.7, 3.3.14
      iso22989_clause: 5.11.7
    attributes:
      aic_ml_paradigm:
        description: How the model learned from its data.
        range: AicLearningParadigm
      aic_ml_algorithm:
        description: The family of algorithm that fitted it.
        range: AicAlgorithmFamily
      aic_ml_datasets:
        description: The datasets used to fit, tune and test it.
        range: AicDataset
        multivalued: true
      aic_ml_hyperparameters:
        description: The settings fixed before training, each as name=value.
        multivalued: true
        pattern: ^[^=\s]+=\S.*$
        annotations:
          iso22989_term: 3.3.4
      aic_ml_parameter_count:
        description: How many numbers training fitted.
        range: integer
        minimum_value: 0
        annotations:
          iso22989_term: 3.3.8
      aic_ml_trained_on:
        description: When the last training run ended.
        range: date
        annotations:
          iso22989_term: 3.3.15
      aic_ml_retrained_from:
        description: The earlier model that this one updates by training it again on other data.
        range: AicMachineLearningModel
        annotations:
          iso22989_term: 3.3.10
          iso22989_clause: 5.11.9
      aic_ml_continuous_learning:
        description: Whether it goes on learning in small steps while in use.
        range: boolean
        annotations:
          iso22989_term: 3.1.9
  AicNeuralNetworkModel:
    is_a: AicMachineLearningModel
    description: A kind of machine learning model built from layers of simple connected units.
    in_subset:
    - aic_machine_learning
    annotations:
      iso22989_term: 3.4.8
      iso22989_clause: 5.12.1
    attributes:
      aic_network_architecture:
        description: How its layers are connected.
        range: AicNetworkArchitecture
      aic_network_layer_count:
        description: How many layers it has.
        range: integer
        minimum_value: 1
      aic_network_activation_functions:
        description: The functions its units use to turn their inputs into an output.
        multivalued: true
        annotations:
          iso22989_term: 3.4.1
  AicDataset:
    mixins:
    - AicRecordMixin
    description: A set of data kept together in one format.
    in_subset:
    - aic_data
    annotations:
      iso22989_term: 3.2.5
    related_mappings:
    - spdx_dataset:DatasetPackage
    comments:
    - SPDX's DatasetPackage describes a dataset as a distributed package.
    attributes:
      aic_dataset_roles:
        description: What the dataset is used for.
        range: AicDatasetRole
        multivalued: true
      aic_dataset_source:
        description: Where the data comes from.
        annotations:
          iso22989_clause: 8.6.1
      aic_dataset_sample_count:
        description: How many samples it holds.
        range: integer
        minimum_value: 0
        annotations:
          iso22989_term: 3.2.13
      aic_dataset_labels:
        description: The labels its samples can carry.
        multivalued: true
        annotations:
          iso22989_term: 3.2.10
      aic_dataset_ground_truth:
        description: Where the correct answers for its samples come from.
        annotations:
          iso22989_term: 3.2.7
      aic_dataset_holds_pii:
        description: Whether it holds data that can identify a person.
        range: boolean
        annotations:
          iso22989_term: 3.2.11
      aic_dataset_processes:
        description: The work done on the data.
        range: AicDataProcess
        multivalued: true
        inlined: true
        inlined_as_list: true
    is_a: Concept
  AicDataProcess:
    description: One piece of work done on a dataset.
    in_subset:
    - aic_data
    annotations:
      iso22989_clause: '5.10'
    attributes:
      aic_data_process_kind:
        description: The kind of work.
        range: AicDataProcessKind
        required: true
      aic_data_process_method:
        description: How it was done, such as the tool used.
      aic_data_process_date:
        description: When it was done.
        range: date
  AicTrustworthinessClaim:
    mixins:
    - AicRecordMixin
    description: A claim that a system has a property people can rely on, with what backs it.
    in_subset:
    - aic_trustworthiness
    annotations:
      iso22989_term: 3.5.16
      iso22989_clause: 5.15.1
    attributes:
      aic_claim_system:
        description: The system the claim is about.
        range: AicSystem
        required: true
      aic_claim_property:
        description: The property claimed.
        range: AicTrustworthinessProperty
        required: true
      aic_claim_evidence:
        description: What backs the claim.
        multivalued: true
      aic_claim_measure:
        description: How the property was measured, if it was.
    is_a: Concept
  AicAssessment:
    mixins:
    - AicRecordMixin
    description: One verification or validation of a system.
    in_subset:
    - aic_trustworthiness
    annotations:
      iso22989_clause: '5.16'
    attributes:
      aic_assessment_kind:
        description: Whether it checks the system against its specification or against its purpose.
        range: AicAssessmentKind
        required: true
      aic_assessment_system:
        description: The system assessed.
        range: AicSystem
        required: true
      aic_assessment_method:
        description: How the system was assessed.
      aic_assessment_result:
        description: What the assessment found.
      aic_assessment_date:
        description: When it was done.
        range: date
    is_a: Concept
  AicLifecycleProcess:
    mixins:
    - AicRecordMixin
    description: A piece of work done at one stage of a system's life.
    in_subset:
    - aic_lifecycle
    annotations:
      iso22989_clause: '6.2'
    attributes:
      aic_lifecycle_stage:
        description: The stage the work belongs to.
        range: AicLifecycleStage
        required: true
      aic_lifecycle_system:
        description: The system the work is for.
        range: AicSystem
      aic_lifecycle_inputs:
        description: What the work starts from.
        multivalued: true
      aic_lifecycle_outputs:
        description: What the work produces.
        multivalued: true
      aic_lifecycle_responsible:
        description: The party that answers for the work.
        range: AicStakeholder
      aic_lifecycle_start:
        description: When the work began.
        range: date
      aic_lifecycle_end:
        description: When the work ended.
        range: date
    is_a: Concept
  AicStakeholder:
    mixins:
    - AicRecordMixin
    description: A person, group or organization with a part in an AI system or an interest in it.
    in_subset:
    - aic_stakeholders
    annotations:
      iso22989_term: 3.5.13
      iso22989_clause: 5.19.1
    related_mappings:
    - uco-role:Role
    comments:
    - UCO's Role is the function something has in context, which this record states for one party. A party
      with two roles has a record for each.
    - The rules hold each sub-role to the role its role annotation names, so a validator refuses a sub-role
      of another role. tests/test_data.py holds the rules and the annotations equal.
    rules:
    - description: A party in the ai_provider role takes only that role's sub-roles.
      preconditions:
        slot_conditions:
          aic_stakeholder_role:
            equals_string: ai_provider
          aic_stakeholder_sub_roles:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          aic_stakeholder_sub_roles:
            any_of:
            - equals_string: ai_platform_provider
            - equals_string: ai_product_or_service_provider
    - description: A party in the ai_producer role takes only that role's sub-roles.
      preconditions:
        slot_conditions:
          aic_stakeholder_role:
            equals_string: ai_producer
          aic_stakeholder_sub_roles:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          aic_stakeholder_sub_roles:
            any_of:
            - equals_string: ai_developer
    - description: A party in the ai_customer role takes only that role's sub-roles.
      preconditions:
        slot_conditions:
          aic_stakeholder_role:
            equals_string: ai_customer
          aic_stakeholder_sub_roles:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          aic_stakeholder_sub_roles:
            any_of:
            - equals_string: ai_user
    - description: A party in the ai_partner role takes only that role's sub-roles.
      preconditions:
        slot_conditions:
          aic_stakeholder_role:
            equals_string: ai_partner
          aic_stakeholder_sub_roles:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          aic_stakeholder_sub_roles:
            any_of:
            - equals_string: ai_system_integrator
            - equals_string: data_provider
    - description: A party in the ai_subject role takes only that role's sub-roles.
      preconditions:
        slot_conditions:
          aic_stakeholder_role:
            equals_string: ai_subject
          aic_stakeholder_sub_roles:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          aic_stakeholder_sub_roles:
            any_of:
            - equals_string: data_subject
            - equals_string: other_subject
    - description: A party in the relevant_authority role takes only that role's sub-roles.
      preconditions:
        slot_conditions:
          aic_stakeholder_role:
            equals_string: relevant_authority
          aic_stakeholder_sub_roles:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          aic_stakeholder_sub_roles:
            any_of:
            - equals_string: policy_maker
            - equals_string: regulator
