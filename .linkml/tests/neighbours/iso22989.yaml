      aic_decision_predictions:
        description: The predictions it rests on.
        range: AicPrediction
        multivalued: true
      aic_decision_criteria:
        description: How the choice was made, such as a threshold or a rule.
  AicAction:
    mixins:
    - AicRecordMixin
    description: What was done because of a decision.
    in_subset:
