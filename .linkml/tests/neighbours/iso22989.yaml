        range: AicStakeholderRole
        required: true
      aic_stakeholder_sub_roles:
        description: The narrower parts it plays within that role.
        range: AicStakeholderSubRole
        multivalued: true
      aic_stakeholder_organization:
        description: The organization the party is or belongs to.
      aic_stakeholder_contact:
        description: How to reach the party.
      aic_stakeholder_responsibilities:
        description: What the party answers for.
        multivalued: true
