# Generated by `lokf adapt` from nist_ai_rmf.yaml (nist_ai_rmf 1.0.0); do not edit.
# Imports lokf: a domain schema lists this file beside it (SPEC 6.2).
id: https://w3id.org/lmodel/nist-ai-rmf-lokf
name: nist-ai-rmf
title: NIST AI Risk Management Framework family
description: 'One LinkML schema for two NIST publications: the AI Risk Management Framework 1.0 (NIST
  AI 100-1) and its Generative AI Profile (NIST AI 600-1).'
version: 1.0.0
source: https://www.nist.gov/itl/ai-risk-management-framework
license: Apache-2.0
see_also:
- https://lmodel.github.io/nist-ai-rmf
- https://w3id.org/lmodel/nist-ai-100-1
- https://w3id.org/lmodel/nist-ai-600-1
comments:
- The version is the 1.0.0 both publications carry, and source is NIST's page for the framework. The release
  tags are the schema's own versions.
- Every module of lmodel/nist-ai-100-1 and lmodel/nist-ai-600-1 is vendored in this folder as released,
  so the schema needs no network, and tests/test_upstream.py holds them to their hashes. Each element
  keeps the IRI of its publication, and this schema adds only the class below.
- The AI RMF to ISO/IEC 42001 crosswalk pairs records, not schema elements, so it is no mapping of this
  schema. scripts/build_crosswalk.py writes it as SSSOM under tmp/, and the repository carries neither
  it nor its PDF, which states no licence.
prefixes:
  linkml: https://w3id.org/linkml/
  nist_ai_100_1: https://w3id.org/lmodel/nist-ai-100-1/
  schema: http://schema.org/
  xsd: http://www.w3.org/2001/XMLSchema#
  iso27001: https://w3id.org/lmodel/iso27001/
  prov: http://www.w3.org/ns/prov#
  nist_csf_v2: https://w3id.org/lmodel/nist-csf-v2/
  oscal: https://w3id.org/lmodel/oscal/
  nist_ai_600_1: https://w3id.org/lmodel/nist-ai-600-1/
  stix: https://w3id.org/lmodel/stix/
  spdx_software: https://spdx.org/rdf/3.0.1/terms/Software/
  nist_ai_rmf: https://w3id.org/lmodel/nist-ai-rmf/
default_prefix: nist_ai_rmf
default_range: string
imports:
- linkml:types
- lokf
classes:
  AiRmfRecord:
    abstract: true
    class_uri: nist_ai_100_1:Record
    description: The base of the classes that record an adopter's own facts, such as one of its AI systems
      or risks, as distinct from what the publication itself lists.
    slots:
    - id
    - title
    - description
    slot_usage:
      title:
        range: string
      description:
        range: string
    is_a: Concept
  AiRmfTrustworthinessCharacteristic:
    class_uri: nist_ai_100_1:TrustworthinessCharacteristic
    description: A characteristic of trustworthy AI systems, each with a subsection of section 3.
    comments:
    - Addressing the characteristics one by one does not make a system trustworthy, since they trade off
      against each other.
    slots:
    - description
    attributes:
      ai_rmf_characteristic_name:
        description: Which characteristic this is.
        range: AiRmfCharacteristicName
        required: true
      ai_rmf_characteristic_section:
        description: The subsection of the publication that describes it, such as 3.1.
        pattern: ^3\.[1-7]$
        required: true
      ai_rmf_characteristic_is_base:
        description: Whether Figure 4 shows it as the necessary condition under the others.
        range: boolean
      ai_rmf_characteristic_relates_to_all:
        description: Whether Figure 4 shows it relating to all the others.
        range: boolean
    slot_usage:
      description:
        range: string
    is_a: Concept
  AiRmfDimension:
    class_uri: nist_ai_100_1:Dimension
    description: One of the five key socio-technical dimensions of an AI system in Figure 2.
    slots:
    - description
    attributes:
      ai_rmf_dimension_name:
        description: Which dimension this is.
        range: AiRmfDimensionName
        required: true
      ai_rmf_dimension_audience:
        description: The AI RMF audience formed by the AI actors in this dimension.
        range: AiRmfAudience
        required: true
    slot_usage:
      description:
        range: string
    is_a: Concept
  AiRmfLifecycleStage:
    class_uri: nist_ai_100_1:LifecycleStage
    description: A stage of the AI lifecycle as a column of Figure 3 shows it, under its dimension.
    slots:
    - description
    attributes:
      ai_rmf_lifecycle_stage_name:
        description: Which stage this is.
        range: AiRmfLifecycleStageName
        required: true
      ai_rmf_lifecycle_stage_dimension:
        description: The dimension Figure 3 places the stage under.
        range: AiRmfDimensionName
        required: true
      ai_rmf_lifecycle_stage_tevv:
        description: The testing, evaluation, verification and validation (TEVV) Figure 3 gives the stage.
      ai_rmf_lifecycle_stage_representative_actors:
        description: The representative AI actors Figure 3 lists for the stage.
        multivalued: true
    slot_usage:
      description:
        range: string
    is_a: Concept
  AiRmfActorTask:
    class_uri: nist_ai_100_1:ActorTask
    description: A task or additional AI actor of Appendix A.
    slots:
    - description
    attributes:
      ai_rmf_actor_task_name:
        description: Which task or additional AI actor this is.
        range: AiRmfActorTaskName
        required: true
      ai_rmf_actor_task_is_additional_actor:
        description: Whether Appendix A lists it under Additional AI Actors rather than as a task.
        range: boolean
      ai_rmf_actor_task_representative_actors:
        description: The AI actors that Appendix A says carry out the task.
        multivalued: true
    slot_usage:
      description:
        range: string
    is_a: Concept
  AiRmfManagementChallenge:
    class_uri: nist_ai_100_1:ManagementChallenge
    description: One of the four challenges for AI risk management in section 1.2.
    slots:
    - description
    attributes:
      ai_rmf_management_challenge_name:
        description: Which challenge this is.
        range: AiRmfManagementChallengeName
        required: true
      ai_rmf_management_challenge_measurement_challenges:
        description: The risk measurement challenges of section 1.2.1, under the challenge of risk measurement.
        range: AiRmfMeasurementChallenge
        multivalued: true
        inlined: true
        inlined_as_list: true
    slot_usage:
      description:
        range: string
    is_a: Concept
  AiRmfMeasurementChallenge:
    class_uri: nist_ai_100_1:MeasurementChallenge
    description: One of the challenges of measuring AI risk in section 1.2.1.
    slots:
    - description
    attributes:
      ai_rmf_measurement_challenge_name:
        description: Which challenge this is.
        range: AiRmfMeasurementChallengeName
        required: true
    slot_usage:
      description:
        range: string
    is_a: Concept
  AiRmfSpecificRisk:
    class_uri: nist_ai_100_1:SpecificRisk
    description: A risk that Appendix B says is new or increased for AI compared with traditional software.
    slots:
    - title
    - description
    slot_usage:
      title:
        description: This project's short name for the item. Appendix B gives its items no names.
        required: true
        range: string
      description:
        range: string
    attributes:
      ai_rmf_specific_risk_position:
        description: The item's position in Appendix B's list, which is not numbered.
        range: integer
        minimum_value: 1
        required: true
    is_a: Concept
  AiRmfHumanAiIssue:
    class_uri: nist_ai_100_1:HumanAiIssue
    description: An issue of human-AI interaction that Appendix C says merits further consideration and
      research.
    slots:
    - title
    - description
    slot_usage:
      title:
        required: true
        range: string
      description:
        range: string
    attributes:
      ai_rmf_human_ai_issue_number:
        description: The issue's number in Appendix C.
        range: integer
        minimum_value: 1
        required: true
    is_a: Concept
  AiRmfAttribute:
    class_uri: nist_ai_100_1:Attribute
    description: A key attribute of the AI RMF in Appendix D, which guided its development.
    slots:
    - title
    - description
    slot_usage:
      title:
        required: true
        range: string
      description:
        range: string
    attributes:
      ai_rmf_attribute_number:
        description: The attribute's number in Appendix D.
        range: integer
        minimum_value: 1
        required: true
    is_a: Concept
  AiRmfSystem:
    is_a: AiRmfRecord
    class_uri: nist_ai_100_1:AiSystem
    description: A machine-based system that produces outputs such as predictions or decisions for given
      objectives, with varying autonomy.
    attributes:
      ai_rmf_system_intended_purposes:
        description: What the system is for, and its potentially beneficial uses, which MAP 1.1 asks an
          adopter to document.
        multivalued: true
      ai_rmf_system_deployment_settings:
        description: The settings the system is or will be deployed in, which MAP 1.1 asks an adopter
          to document.
        multivalued: true
      ai_rmf_system_lifecycle_stages:
        description: The lifecycle stages the record covers.
        range: AiRmfLifecycleStageName
        multivalued: true
      ai_rmf_system_actors:
        description: The AI actors with a role in the system's lifecycle, such as those MAP 1.6 says elicit
          its requirements.
        range: AiRmfActor
        multivalued: true
  AiRmfActor:
    is_a: AiRmfRecord
    class_uri: nist_ai_100_1:AiActor
    description: An organization or individual with an active role in an AI system's lifecycle.
    broad_mappings:
    - prov:Agent
    attributes:
      ai_rmf_actor_tasks:
        description: The tasks the actor carries out, or the additional AI actor it is.
        range: AiRmfActorTaskName
        multivalued: true
      ai_rmf_actor_audience:
        description: The AI RMF audience the actor belongs to.
        range: AiRmfAudience
      ai_rmf_actor_lifecycle_stages:
        description: The lifecycle stages the actor works in.
        range: AiRmfLifecycleStageName
        multivalued: true
  AiRmfRisk:
    is_a: AiRmfRecord
    class_uri: nist_ai_100_1:Risk
    description: How likely an event is, combined with how severe its consequences are.
    related_mappings:
    - iso27001:IsmsRisk
    slots:
    - ai_rmf_likelihood
    - ai_rmf_magnitude
    attributes:
      ai_rmf_risk_system:
        description: The AI system the risk concerns.
        range: AiRmfSystem
      ai_rmf_risk_impacts:
        description: The impacts that contribute to the risk.
        range: AiRmfImpact
        multivalued: true
        inlined: true
        inlined_as_list: true
      ai_rmf_risk_characteristics:
        description: The trustworthiness characteristics the risk bears on.
        range: AiRmfCharacteristicName
        multivalued: true
      ai_rmf_risk_lifecycle_stages:
        description: The lifecycle stages where the risk is measured or arises.
        range: AiRmfLifecycleStageName
        multivalued: true
      ai_rmf_risk_responses:
        description: The responses chosen for the risk.
        range: AiRmfRiskResponse
        multivalued: true
      ai_rmf_risk_priority:
        description: The priority the adopter gives the risk's treatment, on whatever scale it uses, as
          MANAGE 1.2 asks.
        comments:
        - MANAGE 1.3 speaks of risks deemed high priority and the publication sets no scale, so this is
          text.
      ai_rmf_risk_tolerance:
        description: The risk tolerance the risk is judged against, which GOVERN 1.3 and MAP 1.5 ask an
          adopter to document.
        range: AiRmfRiskTolerance
  AiRmfResidualRisk:
    is_a: AiRmfRisk
    class_uri: nist_ai_100_1:ResidualRisk
    description: The risk that remains after risk treatment.
    comments:
    - Section 1.2.3 defines residual risk this way, after ISO Guide 73. MANAGE 1.4 instead calls negative
      residual risks the sum of all unmitigated risks.
  AiRmfImpact:
    is_a: AiRmfRecord
    class_uri: nist_ai_100_1:Impact
    description: A consequence of an AI system, which may be an opportunity, a threat or both.
    slots:
    - ai_rmf_likelihood
    - ai_rmf_magnitude
    attributes:
      ai_rmf_impact_direction:
        description: Whether the consequence is positive, negative or both.
        range: AiRmfImpactDirection
        required: true
      ai_rmf_impact_affected_parties:
        description: Who or what experiences the consequence.
        range: AiRmfAffectedParty
        multivalued: true
  AiRmfHarm:
    is_a: AiRmfImpact
    class_uri: nist_ai_100_1:Harm
    description: A negative impact, sorted as in Figure 1 by whether it falls on people, an organization
      or an ecosystem.
    attributes:
      ai_rmf_harm_category:
        description: The heading of Figure 1 the harm falls under.
        range: AiRmfHarmCategory
        required: true
      ai_rmf_harm_example:
        description: The example of Figure 1 the harm matches, which must sit under the harm's category.
        range: AiRmfHarmExample
    rules:
    - description: A harm is a negative impact.
      preconditions:
        slot_conditions:
          ai_rmf_harm_category:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          ai_rmf_impact_direction:
            equals_string: negative
    - description: An example of harm to people goes with harm to people.
      preconditions:
        slot_conditions:
          ai_rmf_harm_category:
            equals_string: people
          ai_rmf_harm_example:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          ai_rmf_harm_example:
            any_of:
            - equals_string: individual
            - equals_string: group_or_community
            - equals_string: societal
    - description: An example of harm to an organization goes with harm to an organization.
      preconditions:
        slot_conditions:
          ai_rmf_harm_category:
            equals_string: organization
          ai_rmf_harm_example:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          ai_rmf_harm_example:
            any_of:
            - equals_string: business_operations
            - equals_string: security_breach_or_monetary_loss
            - equals_string: reputation
    - description: An example of harm to an ecosystem goes with harm to an ecosystem.
      preconditions:
        slot_conditions:
          ai_rmf_harm_category:
            equals_string: ecosystem
          ai_rmf_harm_example:
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          ai_rmf_harm_example:
            any_of:
            - equals_string: interdependent_elements
            - equals_string: financial_or_supply_systems
            - equals_string: natural_resources_and_environment
  AiRmfRiskTolerance:
    is_a: AiRmfRecord
    class_uri: nist_ai_100_1:RiskTolerance
    description: An organization's or AI actor's readiness to bear risk to achieve its objectives. The
      AI RMF prescribes none.
    attributes:
      ai_rmf_risk_tolerance_holder:
        description: The organization or AI actor whose tolerance this is.
        range: AiRmfActor
      ai_rmf_risk_tolerance_influences:
        description: What influences it, such as a law, a regulation, a policy or a norm.
        multivalued: true
  AiRmfBias:
    is_a: AiRmfRecord
    class_uri: nist_ai_100_1:Bias
    description: A bias to consider and manage, sorted into NIST's three major categories.
    see_also:
    - https://doi.org/10.6028/NIST.SP.1270
    attributes:
      ai_rmf_bias_categories:
        description: The categories it falls under.
        range: AiRmfBiasCategory
        required: true
        multivalued: true
        minimum_cardinality: 1
  AiRmfFunction:
    class_uri: nist_ai_100_1:Function
    description: One of the four functions that organize AI risk management at the highest level. GOVERN
      cuts across the other three.
    broad_mappings:
    - oscal:Group
    related_mappings:
    - nist_csf_v2:Function
    slots:
    - ai_rmf_function_id
    - description
    slot_usage:
      description:
        description: The one-sentence overview in NIST's catalog. The publication gives each function
          a section of its own instead.
        range: string
    attributes:
      ai_rmf_function_categories:
        description: The categories of the function. A knowledge bundle relates a category to its function
          with isPartOf instead.
        range: AiRmfCategory
        multivalued: true
        inlined: true
        inlined_as_list: true
    is_a: Concept
  AiRmfCategory:
    class_uri: nist_ai_100_1:Category
    description: A group of related outcomes within a function, such as GOVERN 1, which Tables 1 to 4
      state.
    broad_mappings:
    - oscal:Control
    related_mappings:
    - nist_csf_v2:Category
    slots:
    - ai_rmf_category_id
    - description
    slot_usage:
      description:
        description: The category's statement in the publication.
        required: true
        pattern: ^\s*\S
        range: string
    attributes:
      ai_rmf_category_subcategories:
        description: The subcategories of the category. A knowledge bundle relates a subcategory to its
          category with isPartOf instead.
        range: AiRmfSubcategory
        multivalued: true
        inlined: true
        inlined_as_list: true
    is_a: Concept
  AiRmfSubcategory:
    class_uri: nist_ai_100_1:Subcategory
    description: A specific outcome within a category, such as GOVERN 1.1, which Tables 1 to 4 state,
      and its Playbook material.
    comments:
    - Everything but the identifier and the statement comes from the Playbook, a companion NIST updates
      apart from the publication.
    broad_mappings:
    - oscal:Control
    related_mappings:
    - nist_csf_v2:Subcategory
    slots:
    - ai_rmf_subcategory_id
    - description
    slot_usage:
      description:
        description: The subcategory's statement in the publication.
        required: true
        pattern: ^\s*\S
        range: string
    attributes:
      ai_rmf_subcategory_about:
        description: The Playbook's discussion of the outcome.
        multivalued: true
      ai_rmf_subcategory_suggested_actions:
        description: The steps the Playbook suggests towards the outcome. They are voluntary and are not
          a checklist.
        range: AiRmfSuggestedAction
        multivalued: true
        inlined: true
        inlined_as_list: true
      ai_rmf_subcategory_documentation:
        description: What the Playbook suggests an organization document, mostly as questions.
        range: AiRmfDocumentationItem
        multivalued: true
        inlined: true
        inlined_as_list: true
      ai_rmf_subcategory_transparency_resources:
        description: The sources the Playbook names as AI transparency resources.
        range: AiRmfResource
        multivalued: true
        inlined: true
        inlined_as_list: true
      ai_rmf_subcategory_references:
        description: The Playbook's references for the outcome.
        range: AiRmfResource
        multivalued: true
        inlined: true
        inlined_as_list: true
      ai_rmf_subcategory_ai_actors:
        description: The AI actors the Playbook tags the outcome with.
        range: AiRmfActorTaskName
        multivalued: true
      ai_rmf_subcategory_topics:
        description: The topics the Playbook tags the outcome with. NIST keeps no closed list of them.
        multivalued: true
    is_a: Concept
  AiRmfSuggestedAction:
    class_uri: nist_ai_100_1:SuggestedAction
    description: One step the Playbook suggests towards a subcategory's outcome.
    broad_mappings:
    - oscal:Part
    slots:
    - ai_rmf_suggested_action_id
    - description
    slot_usage:
      description:
        required: true
        pattern: ^\s*\S
        range: string
  AiRmfDocumentationItem:
    class_uri: nist_ai_100_1:DocumentationItem
    description: One thing the Playbook suggests an organization document for a subcategory.
    broad_mappings:
    - oscal:Part
    slots:
    - ai_rmf_documentation_id
    - description
    slot_usage:
      description:
        required: true
        pattern: ^\s*\S
        range: string
  AiRmfResource:
    class_uri: nist_ai_100_1:Resource
    description: A source the Playbook points to, by the title and address NIST's catalog gives it.
    broad_mappings:
    - oscal:Resource
    slots:
    - title
    slot_usage:
      title:
        required: true
        range: string
    attributes:
      ai_rmf_resource_uuid:
        description: The UUID of the resource in the back matter of NIST's catalog.
        required: true
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      ai_rmf_resource_address:
        description: The address NIST's catalog gives the source. The catalog gives none for a few.
        range: uri
  AiRmfProfile:
    is_a: AiRmfRecord
    class_uri: nist_ai_100_1:Profile
    description: An implementation of the Core's functions, categories and subcategories for a setting,
      application or technology, based on the adopter's requirements, risk tolerance and resources.
    comments:
    - The publication prescribes no profile template, so only the kinds and the subcategories are structured.
    related_mappings:
    - oscal:Profile
    attributes:
      ai_rmf_profile_kinds:
        description: Which of the publication's kinds of profile this is. A current profile for one use
          case is both.
        range: AiRmfProfileKind
        required: true
        multivalued: true
        minimum_cardinality: 1
      ai_rmf_profile_setting:
        description: The sector, industry, technology, organization or end use the profile covers, such
          as hiring.
      ai_rmf_profile_subcategories:
        description: The subcategories the profile selects. An adopter may select from them rather than
          apply all.
        range: ai_rmf_subcategory_identifier
        multivalued: true
  AiRmfFramework:
    class_uri: nist_ai_100_1:Framework
    description: One edition of the AI RMF as a whole, with the Core and the lists the publication gives.
    broad_mappings:
    - oscal:Catalog
    attributes:
      ai_rmf_version:
        description: The edition in NIST's two-number form, such as 1.0.
        required: true
        pattern: ^[0-9]+\.[0-9]+$
      ai_rmf_functions:
        description: The four functions, in the publication's order.
        range: AiRmfFunction
        required: true
        multivalued: true
        minimum_cardinality: 1
        inlined: true
        inlined_as_list: true
      ai_rmf_characteristics:
        description: The trustworthiness characteristics of section 3.
        range: AiRmfTrustworthinessCharacteristic
        multivalued: true
        inlined: true
        inlined_as_list: true
      ai_rmf_dimensions:
        description: The key dimensions of Figure 2.
        range: AiRmfDimension
        multivalued: true
        inlined: true
        inlined_as_list: true
      ai_rmf_lifecycle_stages:
        description: The lifecycle stages of Figure 3.
        range: AiRmfLifecycleStage
        multivalued: true
        inlined: true
        inlined_as_list: true
      ai_rmf_actor_task_list:
        description: The AI actor tasks and additional AI actors of Appendix A.
        range: AiRmfActorTask
        multivalued: true
        inlined: true
        inlined_as_list: true
      ai_rmf_management_challenges:
        description: The challenges for AI risk management of section 1.2.
        range: AiRmfManagementChallenge
        multivalued: true
        inlined: true
        inlined_as_list: true
      ai_rmf_specific_risks:
        description: The AI-specific risks of Appendix B.
        range: AiRmfSpecificRisk
        multivalued: true
        inlined: true
        inlined_as_list: true
      ai_rmf_human_ai_issues:
        description: The human-AI interaction issues of Appendix C.
        range: AiRmfHumanAiIssue
        multivalued: true
        inlined: true
        inlined_as_list: true
      ai_rmf_attributes:
        description: The attributes of the AI RMF in Appendix D.
        range: AiRmfAttribute
        multivalued: true
        inlined: true
        inlined_as_list: true
  GaiRisk:
    class_uri: nist_ai_600_1:Risk
    description: A risk that section 2 defines as unique to or made worse by the development and use of
      GAI.
    comments:
    - The publication gives a risk its section, its definition, its trustworthiness characteristics and,
      in a footnote, its groupings. It assigns no lifecycle stage, scope, source or time scale to a risk,
      since those depend on the model, system or use case. An adopter fills them in.
    related_mappings:
    - nist_ai_100_1:Risk
    slots:
    - description
    slot_usage:
      description:
        description: The risk's definition in section 2.
        range: string
    attributes:
      gai_risk_name:
        description: Which of the 12 risks this is.
        range: GaiRiskName
        required: true
      gai_risk_section:
        description: The subsection of section 2 that discusses the risk, such as 2.1.
        pattern: ^2\.([1-9]|1[0-2])$
        required: true
      gai_risk_characteristics:
        description: The AI RMF's trustworthiness characteristics that the subsection names for the risk.
        range: AiRmfCharacteristicName
        multivalued: true
      gai_risk_groupings:
        description: The groups footnote 5 suggests for the risk. The footnote lists Data Privacy under
          all three.
        range: GaiRiskGrouping
        multivalued: true
      gai_risk_lifecycle_stages:
        description: The lifecycle stages where the risk can arise for the adopter's model, system or
          use case.
        range: GaiLifecycleStage
        multivalued: true
      gai_risk_scopes:
        description: The levels where the risk exists for the adopter's model, system or use case.
        range: GaiRiskScope
        multivalued: true
      gai_risk_sources:
        description: Where the risk comes from for the adopter's model, system or use case.
        range: GaiRiskSource
        multivalued: true
      gai_risk_time_scales:
        description: How the risk materializes over time for the adopter's model, system or use case.
        range: GaiRiskTimeScale
        multivalued: true
    is_a: Concept
  GaiSubcategory:
    class_uri: nist_ai_600_1:Subcategory
    description: An AI RMF subcategory as one table of section 3 addresses it. The Profile covers only
      some of the 72.
    related_mappings:
    - nist_ai_100_1:Subcategory
    slots:
    - ai_rmf_subcategory_id
    - description
    slot_usage:
      description:
        description: The subcategory's statement as the table restates it.
        required: true
        pattern: ^\s*\S
        range: string
    attributes:
      gai_subcategory_actions:
        description: The suggested actions the table lists.
        range: GaiSuggestedAction
        required: true
        multivalued: true
        minimum_cardinality: 1
        inlined: true
        inlined_as_list: true
      gai_subcategory_actor_tasks:
        description: 'The AI actor tasks the table names. They belong to the table and not to one action:
          the publication says not every task applies to every action.'
        range: AiRmfActorTaskName
        multivalued: true
    is_a: Concept
  GaiSuggestedAction:
    class_uri: nist_ai_600_1:SuggestedAction
    description: A step an organization or AI actor can take to manage GAI risks, which one row of a table
      states.
    broad_mappings:
    - oscal:Part
    related_mappings:
    - nist_ai_100_1:SuggestedAction
    - stix:StixCourseOfAction
    slots:
    - gai_action_id
    - description
    slot_usage:
      description:
        description: The action's text in the table.
        required: true
        pattern: ^\s*\S
        range: string
    attributes:
      gai_action_risks:
        description: The GAI risks the row tags the action with.
        range: GaiRiskName
        multivalued: true
  GaiPrimaryConsideration:
    abstract: true
    class_uri: nist_ai_600_1:PrimaryConsideration
    description: One of the four primary considerations of Appendix A, which also inform the suggested
      actions.
    slots:
    - gai_consideration_type
    - title
    - description
    slot_usage:
      title:
        required: true
        range: string
      description:
        range: string
    attributes:
      gai_consideration_sections:
        description: The subsections of Appendix A that discuss the consideration, such as A.1.2.
        pattern: ^A\.1(\.[1-8])?$
        multivalued: true
    is_a: Concept
  GaiGovernanceConsideration:
    is_a: GaiPrimaryConsideration
    class_uri: nist_ai_600_1:GovernanceConsideration
    description: How an organization's governance can be revisited for GAI, including across the AI value
      chain.
    attributes:
      gai_governance_plans:
        description: The plans and actions that section A.1.2 lists from other AI governance.
        range: GaiGovernancePlan
        multivalued: true
      gai_third_party_controls:
        description: The existing controls that section A.1.3 says can apply to third-party GAI.
        range: GaiThirdPartyControl
        multivalued: true
  GaiPreDeploymentTestingConsideration:
    is_a: GaiPrimaryConsideration
    class_uri: nist_ai_600_1:PreDeploymentTestingConsideration
    description: How GAI can be tested before deployment while better approaches mature, and where current
      tests fall short.
    comments:
    - Section A.1.7 calls the feedback approaches of section A.1.5 part of this consideration.
    attributes:
      gai_structured_feedback:
        description: The kinds of structured public feedback section A.1.5 gives as examples.
        range: GaiStructuredFeedback
        multivalued: true
        inlined: true
        inlined_as_list: true
  GaiContentProvenanceConsideration:
    is_a: GaiPrimaryConsideration
    class_uri: nist_ai_600_1:ContentProvenanceConsideration
    description: How tracking the origin and history of content helps tell authentic content from synthetic
      content.
    attributes:
      gai_provenance_techniques:
        description: The well-known techniques for provenance data tracking that section A.1.6 names.
        range: GaiProvenanceTechnique
        multivalued: true
  GaiIncidentDisclosureConsideration:
    is_a: GaiPrimaryConsideration
    class_uri: nist_ai_600_1:IncidentDisclosureConsideration
    description: How documenting, reporting and sharing AI incidents helps prevent harm, though no formal
      channels exist.
    attributes:
      gai_incident_harms:
        description: The kinds of harm that section A.1.8's definition of an AI incident names.
        range: GaiIncidentHarm
        multivalued: true
  GaiStructuredFeedback:
    abstract: true
    class_uri: nist_ai_600_1:StructuredFeedback
    description: A way of using structured public feedback to evaluate whether GAI systems perform as
      intended.
    slots:
    - gai_feedback_type
    - title
    - description
    slot_usage:
      title:
        required: true
        range: string
      description:
        range: string
    is_a: Concept
  GaiParticipatoryEngagement:
    is_a: GaiStructuredFeedback
    class_uri: nist_ai_600_1:ParticipatoryEngagement
    description: Asking civil society groups, affected communities and users for feedback, such as through
      focus groups or surveys.
  GaiFieldTesting:
    is_a: GaiStructuredFeedback
    class_uri: nist_ai_600_1:FieldTesting
    description: Structured settings that show how people interact with and use AI-generated information.
  GaiAiRedTeaming:
    is_a: GaiStructuredFeedback
    class_uri: nist_ai_600_1:AiRedTeaming
    description: A structured exercise that probes an AI system for flaws and vulnerabilities, often with
      its developers.
    attributes:
      gai_red_teaming_types:
        description: The kinds of AI red-teaming that may suit the use case.
        range: GaiRedTeamingType
        multivalued: true
  GaiProfile:
    is_a: AiRmfProfile
    class_uri: nist_ai_600_1:Profile
    description: The Generative AI Profile as a whole, a cross-sectoral profile of the AI RMF and a companion
      resource to it.
    comments:
    - It holds actions for only some subcategories, and the publication says more may be added later.
    attributes:
      gai_risks:
        description: The 12 risks of section 2.
        range: GaiRisk
        required: true
        multivalued: true
        minimum_cardinality: 1
        inlined: true
        inlined_as_list: true
      gai_subcategories:
        description: The tables of section 3, in the publication's order.
        range: GaiSubcategory
        required: true
        multivalued: true
        minimum_cardinality: 1
        inlined: true
        inlined_as_list: true
      gai_primary_considerations:
        description: The four primary considerations of Appendix A.
        range: GaiPrimaryConsideration
        multivalued: true
        inlined: true
        inlined_as_list: true
  NistAiRmfFamily:
    description: The two publications held in one document, each as its own schema renders it.
    comments:
    - Each publication's root stays a root, so a file that holds one publication alone validates against
      AiRmfFramework or GaiProfile. The JSON Schema's top level is this class, and it refuses a document
      that holds neither.
    any_of:
    - slot_conditions:
        nist_ai_rmf_framework:
          required: true
    - slot_conditions:
        nist_ai_rmf_generative_ai_profile:
          required: true
    attributes:
      nist_ai_rmf_framework:
        description: The AI RMF, as lmodel/nist-ai-100-1 renders it.
        see_also:
        - https://doi.org/10.6028/NIST.AI.100-1
        range: AiRmfFramework
        inlined: true
      nist_ai_rmf_generative_ai_profile:
        description: The Generative AI Profile, as lmodel/nist-ai-600-1 renders it.
        see_also:
        - https://doi.org/10.6028/NIST.AI.600-1
        range: GaiProfile
        inlined: true
slots:
  ai_rmf_subcategory_id:
    description: The subcategory's identifier, such as GOVERN 1.1.
    range: ai_rmf_subcategory_identifier
    required: true
    slot_uri: nist_ai_100_1:ai_rmf_subcategory_id
  ai_rmf_likelihood:
    description: How likely the event or impact is, on whatever scale the adopter uses.
    comments:
    - The publication sets no scale, and the Playbook allows qualitative ones, so this is text rather
      than a probability.
    slot_uri: nist_ai_100_1:ai_rmf_likelihood
  ai_rmf_magnitude:
    description: How large the consequences are, on whatever scale the adopter uses.
    slot_uri: nist_ai_100_1:ai_rmf_magnitude
  ai_rmf_function_id:
    description: The function's name, such as GOVERN.
    range: ai_rmf_function_identifier
    required: true
    slot_uri: nist_ai_100_1:ai_rmf_function_id
  ai_rmf_category_id:
    description: The category's identifier, such as GOVERN 1.
    range: ai_rmf_category_identifier
    required: true
    slot_uri: nist_ai_100_1:ai_rmf_category_id
  ai_rmf_suggested_action_id:
    description: The suggested action's identifier, such as SA-GOVERN_1.1-1.
    range: ai_rmf_suggested_action_identifier
    required: true
    slot_uri: nist_ai_100_1:ai_rmf_suggested_action_id
  ai_rmf_documentation_id:
    description: The documentation prompt's identifier, such as D-GOVERN_1.1-1.
    range: ai_rmf_documentation_identifier
    required: true
    slot_uri: nist_ai_100_1:ai_rmf_documentation_id
  gai_action_id:
    description: The action's identifier, such as GV-1.1-001.
    range: gai_action_identifier
    required: true
    slot_uri: nist_ai_600_1:gai_action_id
  gai_consideration_type:
    description: Which of the four classes this record is.
    range: string
    required: true
    slot_uri: nist_ai_600_1:gai_consideration_type
  gai_feedback_type:
    description: Which of the three classes this record is.
    range: string
    required: true
    slot_uri: nist_ai_600_1:gai_feedback_type
enums:
  AiRmfCharacteristicName:
    description: The seven characteristics of trustworthy AI systems in section 3 of the publication.
    permissible_values:
      valid_and_reliable:
        title: Valid and Reliable
        description: Shown by evidence to meet the needs of its intended use, and works without failure
          over time. Figure 4 makes it a necessary condition for the others.
      safe:
        title: Safe
        description: Keeps people, property and the environment out of danger under defined conditions.
      secure_and_resilient:
        title: Secure and Resilient
        description: Withstands adverse events and recovers from them, and keeps confidentiality, integrity
          and availability through protections against attack.
      accountable_and_transparent:
        title: Accountable and Transparent
        description: Answerable for outcomes, which rests on people being able to get information about
          the system and its outputs. Figure 4 shows it relating to all the others.
      explainable_and_interpretable:
        title: Explainable and Interpretable
        description: Its working can be represented (how a decision was made) and its output understood
          in context (why, and what it means for the user).
      privacy_enhanced:
        title: Privacy-Enhanced
        description: Guided by the norms and practices that protect human autonomy, identity and dignity,
          such as anonymity, confidentiality and control.
      fair_with_harmful_bias_managed:
        title: Fair – with Harmful Bias Managed
        description: Addresses equality and equity, including harmful bias and discrimination, knowing
          that views of fairness differ across cultures and applications.
    enum_uri: nist_ai_100_1:AiRmfCharacteristicName
  AiRmfActorTaskName:
    description: The ten AI actor tasks and five additional AI actors of Appendix A.
    comments:
    - 'One list holds both kinds because NIST tags them together: the Playbook under its AI Actors key,
      and AI 600-1 under AI Actor Tasks. Each alias is the spelling those tags use where it differs from
      the title in Appendix A.'
    permissible_values:
      ai_design:
        title: AI Design
        description: Setting what the system is for, planning and designing it, and gathering and preparing
          its data.
      ai_development:
        title: AI Development
        description: Providing the initial infrastructure, and creating, selecting, calibrating, training
          and testing models.
      ai_deployment:
        title: AI Deployment
        description: Deciding how the system is used and putting it into production, including pilots
          and compliance checks.
      operation_and_monitoring:
        title: Operation and Monitoring
        description: Running the system and regularly assessing its output and impacts.
      tevv:
        title: Test, Evaluation, Verification, and Validation (TEVV)
        aliases:
        - TEVV
        description: Examining the system or its components and finding and fixing problems, throughout
          the lifecycle.
      human_factors:
        title: Human Factors
        description: Human-centered design and evaluation, involving end users and bringing context-specific
          norms and values into design.
      domain_expert:
        title: Domain Expert
        aliases:
        - Domain Experts
        description: Giving knowledge of the sector or setting where the system is used.
      ai_impact_assessment:
        title: AI Impact Assessment
        description: Assessing accountability, harmful bias, impacts, product safety, liability and security.
      procurement:
        title: Procurement
        description: Acquiring AI from another party, under financial, legal or policy authority.
      governance_and_oversight:
        title: Governance and Oversight
        description: Holding management, fiduciary and legal authority for the organization where the
          system is designed, developed or deployed.
      third_party_entities:
        title: Third-party entities
        description: Outside organizations that supply or evaluate the data, models, systems or services
          an organization acquires.
      end_users:
        title: End users
        aliases:
        - End-Users
        - End Users
        description: The people or groups who use the system, whether new to technology or expert in AI.
      affected_individuals_and_communities:
        title: Affected individuals/communities
        aliases:
        - Affected Individuals and Communities
        description: Those directly or indirectly affected by the system or its output, whether or not
          they interact with it.
      other_ai_actors:
        title: Other AI actors
        description: Those who may provide norms or guidance on AI risk, such as standards bodies, advocacy
          groups and researchers.
      general_public:
        title: General public
        description: Those most likely to experience the impacts directly, who may motivate what other
          AI actors do.
    enum_uri: nist_ai_100_1:AiRmfActorTaskName
  AiRmfDimensionName:
    description: The key dimensions of an AI system in Figure 2.
    permissible_values:
      application_context:
        title: Application Context
        description: The setting the system is planned for and operated in.
      data_and_input:
        title: Data and Input
        description: The data the system is built from and takes in.
      ai_model:
        title: AI Model
        description: The models built, used, verified and validated.
      task_and_output:
        title: Task and Output
        description: What the system does and produces once deployed.
      people_and_planet:
        title: People and Planet
        description: Human rights and the well-being of society and the planet, at the center of Figure
          2.
    enum_uri: nist_ai_100_1:AiRmfDimensionName
  AiRmfLifecycleStageName:
    description: The AI lifecycle stages in Figure 3, of which Figure 2 shows the first six.
    permissible_values:
      plan_and_design:
        title: Plan and Design
        description: Documenting the concept, objectives, assumptions, context and requirements.
      collect_and_process_data:
        title: Collect and Process Data
        description: Gathering, validating and cleaning data, and recording what it holds.
      build_and_use_model:
        title: Build and Use Model
        description: Creating or selecting algorithms and training models.
      verify_and_validate:
        title: Verify and Validate
        description: Verifying, validating, calibrating and interpreting model output.
      deploy_and_use:
        title: Deploy and Use
        description: Piloting, checking compatibility and compliance, managing change and evaluating user
          experience.
      operate_and_monitor:
        title: Operate and Monitor
        description: Operating the system and continually assessing its recommendations and impacts.
      use_or_impacted_by:
        title: Use or Impacted by
        description: Using the technology or being affected by it, which Figure 3 places under People
          and Planet.
    enum_uri: nist_ai_100_1:AiRmfLifecycleStageName
  AiRmfAudience:
    description: The two AI RMF audiences of section 2.
    permissible_values:
      primary:
        title: Primary audience
        description: AI actors who carry out or manage work on AI systems and drive their risk management.
      informing:
        title: Informing audience
        description: AI actors in the People and Planet dimension, who inform the primary audience.
    enum_uri: nist_ai_100_1:AiRmfAudience
  AiRmfManagementChallengeName:
    description: The challenges for AI risk management in section 1.2.
    permissible_values:
      risk_measurement:
        title: Risk Measurement
        description: AI risks that are poorly defined or understood are hard to measure, which does not
          mean they are high or low.
      risk_tolerance:
        title: Risk Tolerance
        description: The AI RMF can prioritize risk but prescribes no tolerance, which depends on context
          and changes over time.
      risk_prioritization:
        title: Risk Prioritization
        description: Eliminating all negative risk is unrealistic, so effort goes first to the highest
          risks in a context of use.
      organizational_integration_and_management_of_risk:
        title: Organizational Integration and Management of Risk
        description: AI risk belongs inside broader enterprise risk management, with accountability and
          commitment from senior levels.
    enum_uri: nist_ai_100_1:AiRmfManagementChallengeName
  AiRmfMeasurementChallengeName:
    description: The challenges of measuring AI risk in section 1.2.1.
    permissible_values:
      third_party_software_hardware_and_data:
        title: Risks related to third-party software, hardware, and data
        description: Third-party parts can speed work, but their metrics may not match or be disclosed,
          and how they are used adds risk.
      tracking_emergent_risks:
        title: Tracking emergent risks
        description: New risks need identifying, tracking and measuring, which impact assessment helps
          with.
      availability_of_reliable_metrics:
        title: Availability of reliable metrics
        description: There is no consensus on robust, verifiable methods, and metrics can be oversimplified
          or gamed.
      risk_at_different_lifecycle_stages:
        title: Risk at different stages of the AI lifecycle
        description: Results differ by stage, some risks stay latent, and AI actors see risk differently.
      risk_in_real_world_settings:
        title: Risk in real-world settings
        description: What a laboratory measures may differ from what emerges in operation.
      inscrutability:
        title: Inscrutability
        description: Opaque systems, poor documentation and inherent uncertainty complicate measurement.
      human_baseline:
        title: Human baseline
        description: A system that augments or replaces human activity needs a baseline, which is hard
          to systematize.
    enum_uri: nist_ai_100_1:AiRmfMeasurementChallengeName
  AiRmfRiskResponse:
    description: The risk response options MANAGE 1.3 names.
    permissible_values:
      mitigating:
        title: Mitigating
        description: Reducing the likelihood or magnitude of the risk.
      transferring:
        title: Transferring
        description: Shifting the risk to another party.
      avoiding:
        title: Avoiding
        description: Not carrying out what creates the risk.
      accepting:
        title: Accepting
        description: Bearing the risk without further action.
    enum_uri: nist_ai_100_1:AiRmfRiskResponse
  AiRmfImpactDirection:
    description: Whether an impact is positive, negative or both, as section 1.1 puts it.
    permissible_values:
      positive:
        title: Positive
        description: An opportunity or benefit.
      negative:
        title: Negative
        description: A threat or harm.
      both:
        title: Both
        description: Positive and negative at once.
    enum_uri: nist_ai_100_1:AiRmfImpactDirection
  AiRmfAffectedParty:
    description: Who section 1.1 says can experience negative impact or harm.
    permissible_values:
      individuals:
        title: Individuals
        description: Particular people.
      groups:
        title: Groups
        description: Groups of people.
      communities:
        title: Communities
        description: Communities of people.
      organizations:
        title: Organizations
        description: Organizations.
      society:
        title: Society
        description: Society at large.
      environment:
        title: The environment
        description: The natural environment.
      planet:
        title: The planet
        description: The planet as a whole.
    enum_uri: nist_ai_100_1:AiRmfAffectedParty
  AiRmfHarmCategory:
    description: The three headings of Figure 1.
    permissible_values:
      people:
        title: Harm to People
        description: Harm that falls on individuals, groups, communities or society.
      organization:
        title: Harm to an Organization
        description: Harm that falls on an organization.
      ecosystem:
        title: Harm to an Ecosystem
        description: Harm that falls on interconnected systems and resources.
    enum_uri: nist_ai_100_1:AiRmfHarmCategory
  AiRmfHarmExample:
    description: The examples of potential harm in Figure 1, which NIST offers as examples and not as
      a closed list.
    permissible_values:
      individual:
        title: Individual
        description: To a person's civil liberties, rights, safety or economic opportunity.
      group_or_community:
        title: Group/Community
        description: To a group, such as discrimination against a sub-group of a population.
      societal:
        title: Societal
        description: To democratic participation or educational access.
      business_operations:
        title: Business operations
        description: To how an organization operates.
      security_breach_or_monetary_loss:
        title: Security breaches or monetary loss
        description: To an organization through a breach of security or a loss of money.
      reputation:
        title: Reputation
        description: To an organization's standing.
      interdependent_elements:
        title: Interconnected and interdependent elements and resources
        description: To parts and resources that depend on each other.
      financial_or_supply_systems:
        title: Global financial system, supply chain, or interrelated systems
        description: To large systems that link organizations.
      natural_resources_and_environment:
        title: Natural resources, the environment, and planet
        description: To the natural world.
    enum_uri: nist_ai_100_1:AiRmfHarmExample
  AiRmfBiasCategory:
    description: The three major categories of AI bias in section 3.7, each of which can occur without
      prejudice or discriminatory intent.
    see_also:
    - https://doi.org/10.6028/NIST.SP.1270
    permissible_values:
      systemic:
        title: Systemic
        description: In datasets, in organizational norms and processes, and in the wider society that
          uses AI.
      computational_and_statistical:
        title: Computational and statistical
        description: In datasets and algorithms, often from systematic errors due to samples that are
          not representative.
      human_cognitive:
        title: Human-cognitive
        description: In how people perceive system information to decide, or think about what a system
          is for.
    enum_uri: nist_ai_100_1:AiRmfBiasCategory
  AiRmfProfileKind:
    description: The kinds of AI RMF profile that section 6 names.
    permissible_values:
      use_case:
        title: Use-case profile
        description: The Core implemented for a specific setting or application.
      current:
        title: Current Profile
        description: A temporal profile saying how AI is managed today and the related risks, in terms
          of current outcomes.
      target:
        title: Target Profile
        description: A temporal profile saying which outcomes the desired risk management goals need.
      cross_sectoral:
        title: Cross-sectoral profile
        description: Covers risks of models or applications used across use cases or sectors, or activities
          common to them, such as using large language models.
    enum_uri: nist_ai_100_1:AiRmfProfileKind
  GaiRiskName:
    description: The 12 risks of section 2.
    comments:
    - The tables of section 3 tag actions with these risks, in slightly different spellings from the definitions
      in section 2. Each alias is a spelling the tables use.
    permissible_values:
      cbrn_information_or_capabilities:
        title: CBRN Information or Capabilities
        aliases:
        - CBRN Information and Capability
        description: Easier access to dangerous information or design abilities for chemical, biological,
          radiological or nuclear weapons.
      confabulation:
        title: Confabulation
        description: Confident but wrong output that can mislead users.
      dangerous_violent_or_hateful_content:
        title: Dangerous, Violent, or Hateful Content
        description: Easier production of content that incites or threatens, recommends harm, or disparages.
      data_privacy:
        title: Data Privacy
        description: Leaks, misuse or de-anonymization of personal or sensitive data.
      environmental_impacts:
        title: Environmental Impacts
        aliases:
        - Environmental
        description: Effects on ecosystems from the heavy computing that training and operating models
          need.
      harmful_bias_or_homogenization:
        title: Harmful Bias or Homogenization
        aliases:
        - Harmful Bias and Homogenization
        description: Worse systemic bias, unequal performance across groups or languages, and output skewed
          by sameness.
      human_ai_configuration:
        title: Human-AI Configuration
        aliases:
        - Human AI Configuration
        description: Interaction that leads people to over-rely on, anthropomorphize or become entangled
          with a system, or to distrust it.
      information_integrity:
        title: Information Integrity
        description: Easier creation and spread of content that blurs fact and opinion, or that can drive
          large disinformation campaigns.
      information_security:
        title: Information Security
        description: Easier offensive cyber activity, and a larger attack surface on a system, its data,
          code or weights.
      intellectual_property:
        title: Intellectual Property
        description: Easier unauthorized copying of protected content, exposure of trade secrets, and
          plagiarism.
      obscene_degrading_or_abusive_content:
        title: Obscene, Degrading, and/or Abusive Content
        description: Easier production of harmful imagery, including synthetic abuse material and intimate
          images without consent.
      value_chain_and_component_integration:
        title: Value Chain and Component Integration
        description: Opaque use of third-party components and data, and poor supplier vetting, that weaken
          accountability downstream.
    enum_uri: nist_ai_600_1:GaiRiskName
  GaiRiskGrouping:
    description: The three groups into which footnote 5 says an organization could sort the risks, as
      one possible way.
    permissible_values:
      technical_or_model:
        title: Technical / Model risks
        description: Risks from malfunction.
      misuse_by_humans:
        title: Misuse by humans
        description: Risks from malicious use.
      ecosystem_or_societal:
        title: Ecosystem / societal risks
        description: Systemic risks.
    enum_uri: nist_ai_600_1:GaiRiskGrouping
  GaiLifecycleStage:
    description: The lifecycle stages section 2 names for GAI. They differ from the seven stages of the
      AI RMF's Figure 3.
    permissible_values:
      design:
        title: Design
        description: Setting out the system before it is built.
      development:
        title: Development
        description: Building and training it.
      deployment:
        title: Deployment
        description: Putting it into use.
      operation:
        title: Operation
        description: Running it.
      decommissioning:
        title: Decommissioning
        description: Retiring it.
    enum_uri: nist_ai_600_1:GaiLifecycleStage
  GaiRiskScope:
    description: The levels where section 2 says a risk may exist.
    permissible_values:
      model_or_system:
        title: Model or system
        description: The level of one model or system.
      application_or_implementation:
        title: Application or implementation
        description: The level of one specific use case.
      ecosystem:
        title: Ecosystem
        description: Beyond one system or organization, such as algorithmic monocultures or effects on
          labor markets.
    enum_uri: nist_ai_600_1:GaiRiskScope
  GaiRiskSource:
    description: Where section 2 says a risk may come from.
    permissible_values:
      design:
        title: Design
        description: The design of the model itself.
      training:
        title: Training
        description: The training of the model.
      operation:
        title: Operation
        description: The operation of the model.
      inputs:
        title: Inputs
        description: What goes into the model or system.
      outputs:
        title: Outputs
        description: What the system produces.
      human_behavior:
        title: Human behavior
        description: Abuse, misuse or unsafe repurposing by people, whether adversarial or not.
      human_ai_interaction:
        title: Human-AI interaction
        description: How a person and a system act on each other.
    enum_uri: nist_ai_600_1:GaiRiskSource
  GaiRiskTimeScale:
    description: How section 2 says a risk may materialize over time.
    permissible_values:
      abrupt:
        title: Abruptly
        description: All at once, such as immediate emotional harm from a harmful deepfake image.
      extended:
        title: Across extended periods
        description: Slowly, such as the long-term effect of disinformation on trust in institutions.
    enum_uri: nist_ai_600_1:GaiRiskTimeScale
  GaiGovernancePlan:
    description: The plans and actions that section A.1.2 says apply to GAI from other AI governance.
    permissible_values:
      accessibility_and_reasonable_accommodations:
        title: Accessibility and reasonable accommodations
      ai_actor_credentials_and_qualifications:
        title: AI actor credentials and qualifications
      alignment_to_organizational_values:
        title: Alignment to organizational values
      auditing_and_assessment:
        title: Auditing and assessment
      change_management_controls:
        title: Change-management controls
      commercial_use:
        title: Commercial use
      data_provenance:
        title: Data provenance
      data_protection:
        title: Data protection
      data_retention:
        title: Data retention
      consistency_in_use_of_defining_key_terms:
        title: Consistency in use of defining key terms
      decommissioning:
        title: Decommissioning
      discouraging_anonymous_use:
        title: Discouraging anonymous use
      education:
        title: Education
      impact_assessments:
        title: Impact assessments
      incident_response:
        title: Incident response
      monitoring:
        title: Monitoring
      opt_outs:
        title: Opt-outs
      risk_based_controls:
        title: Risk-based controls
      risk_mapping_and_measurement:
        title: Risk mapping and measurement
      science_backed_tevv_practices:
        title: Science-backed TEVV practices
      secure_software_development_practices:
        title: Secure software development practices
      stakeholder_engagement:
        title: Stakeholder engagement
      synthetic_content_detection_and_labeling_tools_and_techniques:
        title: Synthetic content detection and labeling tools and techniques
      whistleblower_protections:
        title: Whistleblower protections
      workforce_diversity_and_interdisciplinary_teams:
        title: Workforce diversity and interdisciplinary teams
    enum_uri: nist_ai_600_1:GaiGovernancePlan
  GaiThirdPartyControl:
    description: The existing controls that section A.1.3 says can apply to third-party GAI.
    permissible_values:
      acquisition_and_procurement_due_diligence:
        title: Acquisition and procurement due diligence
        description: Checking a provider before acquiring its GAI technology or data.
      software_bills_of_materials:
        title: Requests for software bills of materials
        description: Asking a provider what its software is made of.
        related_mappings:
        - spdx_software:Sbom
      service_level_agreements:
        title: Application of service level agreements
        description: Holding a provider to agreed levels of service.
      ssae_reports:
        title: Statement on standards for attestation engagement reports
        description: Asking for a provider's attestation reports.
    enum_uri: nist_ai_600_1:GaiThirdPartyControl
  GaiRedTeamingType:
    description: The types of AI red-teaming in section A.1.5.
    permissible_values:
      general_public:
        title: General Public
        description: By general users who are not necessarily AI or technical experts.
      expert:
        title: Expert
        description: By specialists in the domain or the context of use.
      combination:
        title: Combination
        description: By both experts and general public participants.
      human_ai:
        title: Human / AI
        description: By GAI together with human teams, specialist or not.
    enum_uri: nist_ai_600_1:GaiRedTeamingType
  GaiProvenanceTechnique:
    description: The techniques for provenance data tracking in section A.1.6.
    permissible_values:
      digital_watermarking:
        title: Digital watermarking
        description: Placing visible or hidden marks on content.
      metadata_recording:
        title: Metadata recording
        description: Recording facts about the content, such as its creator, date and sources.
      digital_fingerprinting:
        title: Digital fingerprinting
        description: Identifying content from its own characteristics.
      human_authentication:
        title: Human authentication
        description: Having people confirm where content came from.
    enum_uri: nist_ai_600_1:GaiProvenanceTechnique
  GaiIncidentHarm:
    description: The kinds of harm that section A.1.8's definition of an AI incident names.
    permissible_values:
      injury_or_harm_to_health:
        title: Injury or harm to health
        description: To a person or group, including psychological harm and harm to mental health.
      critical_infrastructure_disruption:
        title: Disruption of critical infrastructure
        description: To its management and operation.
      rights_violations:
        title: Violations of rights or legal obligations
        description: Of human rights, or of obligations under law that protects fundamental, labor and
          intellectual property rights.
      harm_to_property_communities_or_environment:
        title: Harm to property, communities, or the environment
        description: To things and groups beyond the individual.
    enum_uri: nist_ai_600_1:GaiIncidentHarm
types:
  ai_rmf_function_identifier:
    typeof: string
    base: str
    uri: xsd:string
    description: The name of one of the four Core functions, written in capitals, such as GOVERN.
    pattern: ^(GOVERN|MAP|MEASURE|MANAGE)$
  ai_rmf_category_identifier:
    typeof: string
    base: str
    uri: xsd:string
    description: A category's identifier, its function's name and a number, such as GOVERN 1.
    pattern: ^(GOVERN [1-6]|MAP [1-5]|MEASURE [1-4]|MANAGE [1-4])$
  ai_rmf_subcategory_identifier:
    typeof: string
    base: str
    uri: xsd:string
    description: A subcategory's identifier, its category's identifier, a dot and a number, such as GOVERN
      1.1.
    pattern: ^(GOVERN [1-6]|MAP [1-5]|MEASURE [1-4]|MANAGE [1-4])\.[1-9][0-9]?$
  ai_rmf_suggested_action_identifier:
    typeof: string
    base: str
    uri: xsd:string
    description: The identifier NIST's catalog gives a Playbook suggested action, such as SA-GOVERN_1.1-1.
      Each further number, as in SA-GOVERN_1.4-1.2, marks a sub-item.
    pattern: ^SA-(GOVERN|MAP|MEASURE|MANAGE)_[1-6]\.[1-9][0-9]?-[1-9][0-9]?(\.[1-9][0-9]?)*$
  ai_rmf_documentation_identifier:
    typeof: string
    base: str
    uri: xsd:string
    description: The identifier NIST's catalog gives a Playbook documentation prompt, such as D-GOVERN_1.1-1.
    pattern: ^D-(GOVERN|MAP|MEASURE|MANAGE)_[1-6]\.[1-9][0-9]?-[1-9][0-9]?$
  gai_action_identifier:
    typeof: string
    base: str
    uri: xsd:string
    description: 'An Action ID: the function''s two letters, its subcategory''s numbers and a three-digit
      number, such as GV-1.1-001 for the first action of GOVERN 1.1.'
    pattern: ^(GV-[1-6]|MP-[1-5]|MS-[1-4]|MG-[1-4])\.[1-9][0-9]?-[0-9]{3}$
