description: 'A LinkML model of the JSON formats Open Policy Agent defines: the IR
  plan, the bundle manifest, the authorization policy input, the capabilities document,
  the built-in function metadata and the version index. Each module renders one format,
  and keeps OPA''s keys, so a document OPA writes validates against this schema unchanged.
  The lokf adapt copy renames six keys LOKF defines with another meaning.'
title: Open Policy Agent (OPA)
source: https://github.com/open-policy-agent/opa/tree/482d9e368c2ddfed67ced59259fa6a247bb5f1e5
see_also:
- https://lmodel.github.io/opa
- https://www.openpolicyagent.org/docs
keywords:
- policy as code
- Open Policy Agent
- Rego
- CNCF
id: https://w3id.org/lmodel/opa
version: 1.22.2
imports:
- linkml:types
- common
- capabilities
- builtin_metadata
- version_index
- authorization_input
- bundle_manifest
- ir_plan
license: Apache-2.0
