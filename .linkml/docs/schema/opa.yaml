classes:
  OpaObject:
    name: OpaObject
    definition_uri: https://w3id.org/lmodel/opa/OpaObject
    description: A JSON object whose keys OPA leaves open.
    from_schema: https://w3id.org/lmodel/opa/common
    class_uri: openpolicyagent:OpaObject
    extra_slots:
      allowed: true
  OpaValue:
    name: OpaValue
    definition_uri: https://w3id.org/lmodel/opa/OpaValue
    description: Any JSON value.
    from_schema: https://w3id.org/lmodel/opa/common
    exact_mappings:
    - linkml:Any
    class_uri: linkml:Any
  OpaType:
    name: OpaType
    definition_uri: https://w3id.org/lmodel/opa/OpaType
    description: A Rego type, as OPA's types package writes it in JSON. A named type
      is an argument or result of a built-in function, with a name and a description.
    from_schema: https://w3id.org/lmodel/opa/common
    abstract: true
    slots:
    - opaType__name
    - opaType__description
    attributes:
      name:
        name: name
        description: The argument's or result's name, on a named type.
        slot_uri: schema:name
      description:
        name: description
        description: What the argument or result holds, on a named type.
        slot_uri: schema:description
    class_uri: openpolicyagent:OpaType
  OpaAnyType:
    name: OpaAnyType
    definition_uri: https://w3id.org/lmodel/opa/OpaAnyType
    description: A union of the types it lists in `of`, or any value when it lists
      none.
    from_schema: https://w3id.org/lmodel/opa/common
    is_a: OpaType
    slots:
    - opaType__name
    - opaType__description
    - OpaAnyType_type
    - opaAnyType__of
    slot_usage:
      type:
        name: type
        description: The kind of type.
        range: string
        required: true
        equals_string: any
    attributes:
      of:
        name: of
        description: The types the union admits.
        range: OpaType
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: openpolicyagent:OpaAnyType
  OpaArrayType:
    name: OpaArrayType
    definition_uri: https://w3id.org/lmodel/opa/OpaArrayType
    description: An array, with a type per position in `static` and one for the rest
      in `dynamic`.
    from_schema: https://w3id.org/lmodel/opa/common
    is_a: OpaType
    slots:
    - opaType__name
    - opaType__description
    - OpaArrayType_type
    - opaArrayType__static
    - opaArrayType__dynamic
    slot_usage:
      type:
        name: type
        description: The kind of type.
        range: string
        required: true
        equals_string: array
    attributes:
      static:
        name: static
        description: The type of each element by position.
        range: OpaType
        multivalued: true
        inlined: true
        inlined_as_list: true
      dynamic:
        name: dynamic
        description: The type of the elements after the static ones.
        range: OpaType
        inlined: true
    class_uri: openpolicyagent:OpaArrayType
  OpaBooleanType:
    name: OpaBooleanType
    definition_uri: https://w3id.org/lmodel/opa/OpaBooleanType
    description: A boolean.
    from_schema: https://w3id.org/lmodel/opa/common
    is_a: OpaType
    slots:
    - opaType__name
    - opaType__description
    - OpaBooleanType_type
    slot_usage:
      type:
        name: type
        description: The kind of type.
        range: string
        required: true
        equals_string: boolean
    class_uri: openpolicyagent:OpaBooleanType
  OpaFunctionType:
    name: OpaFunctionType
    definition_uri: https://w3id.org/lmodel/opa/OpaFunctionType
    description: A function, with its arguments, its result and a variadic argument
      type.
    from_schema: https://w3id.org/lmodel/opa/common
    is_a: OpaType
    slots:
    - opaType__name
    - opaType__description
    - OpaFunctionType_type
    - opaFunctionType__args
    - opaFunctionType__result
    - opaFunctionType__variadic
    slot_usage:
      type:
        name: type
        description: The kind of type.
        range: string
        required: true
        equals_string: function
    attributes:
      args:
        name: args
        description: The argument types, in order.
        range: OpaType
        multivalued: true
        inlined: true
        inlined_as_list: true
      result:
        name: result
        description: The result type.
        range: OpaType
        inlined: true
      variadic:
        name: variadic
        description: The type of any further arguments.
        range: OpaType
        inlined: true
    class_uri: openpolicyagent:OpaFunctionType
  OpaNullType:
    name: OpaNullType
    definition_uri: https://w3id.org/lmodel/opa/OpaNullType
    description: The null value.
    from_schema: https://w3id.org/lmodel/opa/common
    is_a: OpaType
    slots:
    - opaType__name
    - opaType__description
    - OpaNullType_type
    slot_usage:
      type:
        name: type
        description: The kind of type.
        range: string
        required: true
        equals_string: 'null'
    class_uri: openpolicyagent:OpaNullType
  OpaNumberType:
    name: OpaNumberType
    definition_uri: https://w3id.org/lmodel/opa/OpaNumberType
    description: A number.
    from_schema: https://w3id.org/lmodel/opa/common
    is_a: OpaType
    slots:
    - opaType__name
    - opaType__description
    - OpaNumberType_type
    slot_usage:
      type:
        name: type
        description: The kind of type.
        range: string
        required: true
        equals_string: number
    class_uri: openpolicyagent:OpaNumberType
  OpaObjectType:
    name: OpaObjectType
    definition_uri: https://w3id.org/lmodel/opa/OpaObjectType
    description: An object, with typed known keys in `static` and a key and value
      type for the rest in `dynamic`.
    from_schema: https://w3id.org/lmodel/opa/common
    is_a: OpaType
    slots:
    - opaType__name
    - opaType__description
    - OpaObjectType_type
    - opaObjectType__static
    - opaObjectType__dynamic
    slot_usage:
      type:
        name: type
        description: The kind of type.
        range: string
        required: true
        equals_string: object
    attributes:
      static:
        name: static
        description: The known keys and the types of their values.
        range: OpaStaticProperty
        multivalued: true
        inlined: true
        inlined_as_list: true
      dynamic:
        name: dynamic
        description: The key type and value type of the other keys.
        range: OpaDynamicProperty
        inlined: true
    class_uri: openpolicyagent:OpaObjectType
  OpaSetType:
    name: OpaSetType
    definition_uri: https://w3id.org/lmodel/opa/OpaSetType
    description: A set, whose members have the type in `of`.
    from_schema: https://w3id.org/lmodel/opa/common
    is_a: OpaType
    slots:
    - opaType__name
    - opaType__description
    - OpaSetType_type
    - opaSetType__of
    slot_usage:
      type:
        name: type
        description: The kind of type.
        range: string
        required: true
        equals_string: set
    attributes:
      of:
        name: of
        description: The type of the set's members.
        range: OpaType
        inlined: true
    class_uri: openpolicyagent:OpaSetType
  OpaStringType:
    name: OpaStringType
    definition_uri: https://w3id.org/lmodel/opa/OpaStringType
    description: A string.
    from_schema: https://w3id.org/lmodel/opa/common
    is_a: OpaType
    slots:
    - opaType__name
    - opaType__description
    - OpaStringType_type
    slot_usage:
      type:
        name: type
        description: The kind of type.
        range: string
        required: true
        equals_string: string
    class_uri: openpolicyagent:OpaStringType
  OpaStaticProperty:
    name: OpaStaticProperty
    definition_uri: https://w3id.org/lmodel/opa/OpaStaticProperty
    description: A known key of an object type and the type of its value.
    from_schema: https://w3id.org/lmodel/opa/common
    slots:
    - opaStaticProperty__key
    - opaStaticProperty__value
    attributes:
      key:
        name: key
        description: The key, as a JSON value.
        range: OpaValue
        required: true
      value:
        name: value
        description: The type of the key's value.
        range: OpaType
        required: true
        inlined: true
    class_uri: openpolicyagent:OpaStaticProperty
  OpaDynamicProperty:
    name: OpaDynamicProperty
    definition_uri: https://w3id.org/lmodel/opa/OpaDynamicProperty
    description: The key type and value type that an object type gives its other keys.
    from_schema: https://w3id.org/lmodel/opa/common
    slots:
    - opaDynamicProperty__key
    - opaDynamicProperty__value
    attributes:
      key:
        name: key
        description: The type of the keys.
        range: OpaType
        required: true
        inlined: true
      value:
        name: value
        description: The type of the values.
        range: OpaType
        required: true
        inlined: true
    class_uri: openpolicyagent:OpaDynamicProperty
  OpaCapabilities:
    name: OpaCapabilities
    definition_uri: https://w3id.org/lmodel/opa/OpaCapabilities
    description: What an OPA version supports, which a policy can be checked against.
    from_schema: https://w3id.org/lmodel/opa/capabilities
    slots:
    - opaCapabilities__builtins
    - opaCapabilities__future_keywords
    - opaCapabilities__wasm_abi_versions
    - opaCapabilities__features
    - opaCapabilities__allow_net
    attributes:
      builtins:
        name: builtins
        description: The built-in functions.
        range: OpaBuiltin
        multivalued: true
        inlined: true
        inlined_as_list: true
      future_keywords:
        name: future_keywords
        description: The keywords a policy may import from future.keywords.
        range: OpaFutureKeyword
        multivalued: true
      wasm_abi_versions:
        name: wasm_abi_versions
        description: The Wasm ABI versions supported.
        range: OpaWasmAbiVersion
        multivalued: true
        inlined: true
        inlined_as_list: true
      features:
        name: features
        description: The language features supported.
        range: OpaFeature
        multivalued: true
      allow_net:
        name: allow_net
        description: The hosts OPA may connect to, as host names or IP addresses.
          OPA reaches any host when the key is absent, and none when the list is empty.
        multivalued: true
    class_uri: openpolicyagent:OpaCapabilities
    tree_root: true
  OpaBuiltin:
    name: OpaBuiltin
    definition_uri: https://w3id.org/lmodel/opa/OpaBuiltin
    description: A built-in function and its type declaration.
    from_schema: https://w3id.org/lmodel/opa/capabilities
    slots:
    - opaBuiltin__name
    - opaBuiltin__description
    - opaBuiltin__categories
    - opaBuiltin__decl
    - opaBuiltin__infix
    - opaBuiltin__relation
    - opaBuiltin__deprecated
    - opaBuiltin__nondeterministic
    attributes:
      name:
        name: name
        description: The function's name, such as `array.concat`.
        slot_uri: schema:name
        required: true
      description:
        name: description
        description: What the function does.
        slot_uri: schema:description
      categories:
        name: categories
        description: The categories the function belongs to.
        multivalued: true
      decl:
        name: decl
        description: The function's type declaration.
        range: OpaFunctionType
        required: true
        inlined: true
      infix:
        name: infix
        description: The infix operator that calls the function, such as `+`.
      relation:
        name: relation
        description: Whether the function acts as a relation.
        range: boolean
      deprecated:
        name: deprecated
        description: Whether the function is deprecated.
        range: boolean
      nondeterministic:
        name: nondeterministic
        description: Whether the function may return different results for the same
          arguments.
        range: boolean
    class_uri: openpolicyagent:OpaBuiltin
  OpaWasmAbiVersion:
    name: OpaWasmAbiVersion
    definition_uri: https://w3id.org/lmodel/opa/OpaWasmAbiVersion
    description: A Wasm ABI version, as a major and a minor number.
    from_schema: https://w3id.org/lmodel/opa/capabilities
    slots:
    - OpaWasmAbiVersion_version
    - opaWasmAbiVersion__minor_version
    slot_usage:
      version:
        name: version
        description: The major version.
        range: integer
        required: true
    attributes:
      minor_version:
        name: minor_version
        description: The minor version.
        range: integer
        required: true
    class_uri: openpolicyagent:OpaWasmAbiVersion
  OpaBuiltinMetadataCatalog:
    name: OpaBuiltinMetadataCatalog
    definition_uri: https://w3id.org/lmodel/opa/OpaBuiltinMetadataCatalog
    description: 'The catalogue: two keys that start with an underscore, and one key
      per built-in function, whose value describes it.'
    from_schema: https://w3id.org/lmodel/opa/builtin_metadata
    slots:
    - opaBuiltinMetadataCatalog__categories
    - opaBuiltinMetadataCatalog__implementations
    attributes:
      categories:
        name: categories
        description: The categories, each with the names of its functions.
        alias: _categories
        range: OpaBuiltinCategory
        multivalued: true
        inlined: true
      implementations:
        name: implementations
        description: The implementations of Rego besides OPA that the catalogue tracks.
        alias: _implementations
        range: OpaImplementation
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: openpolicyagent:OpaBuiltinMetadataCatalog
    tree_root: true
    extra_slots:
      range_expression:
        range: OpaBuiltinMetadata
  OpaBuiltinCategory:
    name: OpaBuiltinCategory
    definition_uri: https://w3id.org/lmodel/opa/OpaBuiltinCategory
    description: A category of built-in functions.
    from_schema: https://w3id.org/lmodel/opa/builtin_metadata
    slots:
    - opaBuiltinCategory__name
    - opaBuiltinCategory__builtins
    attributes:
      name:
        name: name
        description: The category's name.
        slot_uri: schema:name
        key: true
      builtins:
        name: builtins
        description: The names of the category's functions.
        required: true
        multivalued: true
    class_uri: openpolicyagent:OpaBuiltinCategory
  OpaImplementation:
    name: OpaImplementation
    definition_uri: https://w3id.org/lmodel/opa/OpaImplementation
    description: An implementation of Rego besides OPA.
    from_schema: https://w3id.org/lmodel/opa/builtin_metadata
    slots:
    - OpaImplementation_version
    - opaImplementation__id
    - opaImplementation__label
    - opaImplementation__repo
    slot_usage:
      version:
        name: version
        description: The implementation's version the catalogue reflects.
        required: true
    attributes:
      id:
        name: id
        description: The implementation's key in each function's `implementations`.
        slot_uri: schema:identifier
        required: true
      label:
        name: label
        description: The implementation's display name.
        required: true
      repo:
        name: repo
        description: The implementation's GitHub repository, as owner/name.
        required: true
    class_uri: openpolicyagent:OpaImplementation
  OpaBuiltinMetadata:
    name: OpaBuiltinMetadata
    definition_uri: https://w3id.org/lmodel/opa/OpaBuiltinMetadata
    description: What the catalogue says about one built-in function.
    from_schema: https://w3id.org/lmodel/opa/builtin_metadata
    slots:
    - opaBuiltinMetadata__description
    - opaBuiltinMetadata__introduced
    - opaBuiltinMetadata__available
    - opaBuiltinMetadata__wasm
    - opaBuiltinMetadata__args
    - opaBuiltinMetadata__result
    - opaBuiltinMetadata__implementations
    - opaBuiltinMetadata__infix
    - opaBuiltinMetadata__relation
    - opaBuiltinMetadata__deprecated
    attributes:
      description:
        name: description
        description: What the function does.
        slot_uri: schema:description
      introduced:
        name: introduced
        description: The OPA version that added the function.
        required: true
      available:
        name: available
        description: The OPA versions that have the function, and `edge`.
        required: true
        multivalued: true
      wasm:
        name: wasm
        description: Whether OPA's Wasm target implements the function.
        range: boolean
        required: true
      args:
        name: args
        description: The arguments, in order.
        range: OpaBuiltinArgument
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
      result:
        name: result
        description: The result.
        range: OpaBuiltinResult
        required: true
        inlined: true
      implementations:
        name: implementations
        description: The other implementations that support the function, with the
          version that added it.
        range: OpaImplementationSupport
        required: true
        multivalued: true
        inlined: true
      infix:
        name: infix
        description: The infix operator that calls the function.
      relation:
        name: relation
        description: Whether the function acts as a relation.
        range: boolean
      deprecated:
        name: deprecated
        description: Whether the function is deprecated.
        range: boolean
    class_uri: openpolicyagent:OpaBuiltinMetadata
  OpaBuiltinArgument:
    name: OpaBuiltinArgument
    definition_uri: https://w3id.org/lmodel/opa/OpaBuiltinArgument
    description: An argument of a built-in function.
    from_schema: https://w3id.org/lmodel/opa/builtin_metadata
    slots:
    - OpaBuiltinArgument_type
    - opaBuiltinArgument__name
    - opaBuiltinArgument__description
    slot_usage:
      type:
        name: type
        description: The argument's type, written as OPA prints types, such as `array[string]`.
        required: true
    attributes:
      name:
        name: name
        description: The argument's name.
        slot_uri: schema:name
      description:
        name: description
        description: What the argument holds.
        slot_uri: schema:description
    class_uri: openpolicyagent:OpaBuiltinArgument
  OpaBuiltinResult:
    name: OpaBuiltinResult
    definition_uri: https://w3id.org/lmodel/opa/OpaBuiltinResult
    description: The result of a built-in function. Some functions declare none.
    from_schema: https://w3id.org/lmodel/opa/builtin_metadata
    slots:
    - OpaBuiltinResult_type
    - opaBuiltinResult__name
    - opaBuiltinResult__description
    slot_usage:
      type:
        name: type
        description: The result's type, written as OPA prints types.
    attributes:
      name:
        name: name
        description: The result's name.
        slot_uri: schema:name
      description:
        name: description
        description: What the result holds.
        slot_uri: schema:description
    class_uri: openpolicyagent:OpaBuiltinResult
  OpaImplementationSupport:
    name: OpaImplementationSupport
    definition_uri: https://w3id.org/lmodel/opa/OpaImplementationSupport
    description: An implementation that supports a function, and the version that
      added it.
    from_schema: https://w3id.org/lmodel/opa/builtin_metadata
    slots:
    - OpaImplementationSupport_version
    - opaImplementationSupport__implementation
    slot_usage:
      version:
        name: version
        description: The implementation's version that added the function.
        required: true
    attributes:
      implementation:
        name: implementation
        description: The implementation's id.
        key: true
    class_uri: openpolicyagent:OpaImplementationSupport
  OpaVersionIndex:
    name: OpaVersionIndex
    definition_uri: https://w3id.org/lmodel/opa/OpaVersionIndex
    description: The version index.
    from_schema: https://w3id.org/lmodel/opa/version_index
    slots:
    - opaVersionIndex__builtins
    - opaVersionIndex__features
    - opaVersionIndex__keywords
    attributes:
      builtins:
        name: builtins
        description: The builtins, keyed by name, each with the version that introduced
          it.
        range: OpaVersionEntry
        required: true
        multivalued: true
        inlined: true
      features:
        name: features
        description: The features, keyed by name, each with the version that introduced
          it.
        range: OpaVersionEntry
        required: true
        multivalued: true
        inlined: true
      keywords:
        name: keywords
        description: The keywords, keyed by name, each with the version that introduced
          it.
        range: OpaVersionEntry
        required: true
        multivalued: true
        inlined: true
    class_uri: openpolicyagent:OpaVersionIndex
    tree_root: true
  OpaVersionEntry:
    name: OpaVersionEntry
    definition_uri: https://w3id.org/lmodel/opa/OpaVersionEntry
    description: A built-in function, feature or keyword, and the OPA version that
      introduced it.
    from_schema: https://w3id.org/lmodel/opa/version_index
    slots:
    - opaVersionEntry__name
    - opaVersionEntry__major
    - opaVersionEntry__minor
    - opaVersionEntry__patch
    - opaVersionEntry__pre_release
    attributes:
      name:
        name: name
        description: The name of the function, feature or keyword.
        slot_uri: schema:name
        key: true
      major:
        name: major
        description: The major version.
        alias: Major
        range: integer
        required: true
      minor:
        name: minor
        description: The minor version.
        alias: Minor
        range: integer
        required: true
      patch:
        name: patch
        description: The patch version.
        alias: Patch
        range: integer
        required: true
      pre_release:
        name: pre_release
        description: The pre-release label, such as `rc2`.
        alias: PreRelease
    class_uri: openpolicyagent:OpaVersionEntry
  OpaAuthorizationInput:
    name: OpaAuthorizationInput
    definition_uri: https://w3id.org/lmodel/opa/OpaAuthorizationInput
    description: The OPA Authorization Policy Input document.
    from_schema: https://w3id.org/lmodel/opa/authorization_input
    slots:
    - OpaAuthorizationInput_body
    - opaAuthorizationInput__identity
    - opaAuthorizationInput__client_certificates
    - opaAuthorizationInput__method
    - opaAuthorizationInput__path
    - opaAuthorizationInput__params
    - opaAuthorizationInput__headers
    slot_usage:
      body:
        name: body
        description: The request body.
        range: OpaObject
        required: true
        inlined: true
    attributes:
      identity:
        name: identity
        description: The bearer token or client certificate subject that identifies
          the caller.
        range: string
        required: true
      client_certificates:
        name: client_certificates
        description: The client's TLS certificates.
        range: OpaObject
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
      method:
        name: method
        description: The HTTP method of the request.
        range: string
        required: true
      path:
        name: path
        description: The request path, one segment per element.
        range: string
        required: true
        multivalued: true
      params:
        name: params
        description: The query parameters.
        range: OpaObject
        required: true
        inlined: true
      headers:
        name: headers
        description: The request headers.
        range: OpaObject
        required: true
        inlined: true
    class_uri: openpolicyagent:OpaAuthorizationInput
    tree_root: true
    extra_slots:
      allowed: true
  OpaManifest:
    name: OpaManifest
    definition_uri: https://w3id.org/lmodel/opa/OpaManifest
    description: A bundle manifest. OPA's schema leaves the manifest open to other
      keys.
    from_schema: https://w3id.org/lmodel/opa/bundle_manifest
    exact_mappings:
    - opa_manifest:Manifest
    slots:
    - OpaManifest_revision
    - opaManifest__file_rego_versions
    - opaManifest__metadata
    - opaManifest__rego_version
    - opaManifest__roots
    - opaManifest__wasm
    slot_usage:
      revision:
        name: revision
        description: The bundle's revision, a string the bundle's author chooses.
        range: string
        required: true
    attributes:
      file_rego_versions:
        name: file_rego_versions
        description: Rego versions for single files, which override `rego_version`.
        range: OpaFileRegoVersion
        multivalued: true
        inlined: true
      metadata:
        name: metadata
        description: Metadata the bundle's author adds.
        range: OpaObject
        inlined: true
      rego_version:
        name: rego_version
        description: 'The Rego version of the bundle''s files: 0 for v0, 1 for v1.'
        range: integer
      roots:
        name: roots
        description: The paths in the data tree the bundle owns. A bundle without
          the key owns the whole tree.
        range: string
        multivalued: true
      wasm:
        name: wasm
        description: The Wasm modules the bundle holds, and the entrypoints they resolve.
        range: OpaWasmResolver
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: openpolicyagent:OpaManifest
    tree_root: true
    extra_slots:
      allowed: true
  OpaWasmResolver:
    name: OpaWasmResolver
    definition_uri: https://w3id.org/lmodel/opa/OpaWasmResolver
    description: A Wasm module in a bundle, and the entrypoint it resolves.
    from_schema: https://w3id.org/lmodel/opa/bundle_manifest
    exact_mappings:
    - opa_manifest:WasmResolver
    slots:
    - opaWasmResolver__annotations
    - opaWasmResolver__entrypoint
    - opaWasmResolver__module
    attributes:
      annotations:
        name: annotations
        description: The entrypoint's Rego annotations. OPA's schema leaves their
          shape open.
        range: OpaObject
        multivalued: true
        inlined: true
        inlined_as_list: true
      entrypoint:
        name: entrypoint
        description: The entrypoint the module resolves.
        range: string
      module:
        name: module
        description: The module's path in the bundle.
        range: string
    class_uri: openpolicyagent:OpaWasmResolver
  OpaFileRegoVersion:
    name: OpaFileRegoVersion
    definition_uri: https://w3id.org/lmodel/opa/OpaFileRegoVersion
    description: The Rego version of one file in the bundle.
    from_schema: https://w3id.org/lmodel/opa/bundle_manifest
    slots:
    - OpaFileRegoVersion_version
    - opaFileRegoVersion__path
    slot_usage:
      version:
        name: version
        description: The file's Rego version.
        range: integer
        required: true
    attributes:
      path:
        name: path
        description: The file's path in the bundle.
        key: true
    class_uri: openpolicyagent:OpaFileRegoVersion
  OpaPolicy:
    name: OpaPolicy
    definition_uri: https://w3id.org/lmodel/opa/OpaPolicy
    description: Policy represents a planned policy query.
    from_schema: https://w3id.org/lmodel/opa/ir_plan
    exact_mappings:
    - opa_plan:Policy
    slots:
    - opaPolicy__funcs
    - opaPolicy__plans
    - opaPolicy__static
    - opaPolicy__unplanned_rules
    attributes:
      funcs:
        name: funcs
        description: The functions the plans call.
        range: OpaFuncs
        inlined: true
      plans:
        name: plans
        description: The query plans the policy exposes.
        range: OpaPlans
        inlined: true
      static:
        name: static
        description: The constants the plan indexes into.
        range: OpaStatic
        inlined: true
      unplanned_rules:
        name: unplanned_rules
        description: The rules left out because no entrypoint reaches them.
        range: OpaUnplannedRule
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: openpolicyagent:OpaPolicy
    tree_root: true
  OpaStatic:
    name: OpaStatic
    definition_uri: https://w3id.org/lmodel/opa/OpaStatic
    description: Static represents a static data segment that is indexed into by the
      policy.
    from_schema: https://w3id.org/lmodel/opa/ir_plan
    exact_mappings:
    - opa_plan:Static
    slots:
    - opaStatic__builtin_funcs
    - opaStatic__files
    - opaStatic__strings
    attributes:
      builtin_funcs:
        name: builtin_funcs
        description: The built-in functions the plan calls.
        range: OpaBuiltinFunc
        multivalued: true
        inlined: true
        inlined_as_list: true
      files:
        name: files
        description: The names of the policy files, which a location refers to by
          position.
        range: OpaStringConst
        multivalued: true
        inlined: true
        inlined_as_list: true
      strings:
        name: strings
        description: The string constants, which a string index refers to by position.
        range: OpaStringConst
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: openpolicyagent:OpaStatic
  OpaStringConst:
    name: OpaStringConst
    definition_uri: https://w3id.org/lmodel/opa/OpaStringConst
    description: StringConst represents a string value.
    from_schema: https://w3id.org/lmodel/opa/ir_plan
    exact_mappings:
    - opa_plan:StringConst
    slots:
    - opaStringConst__value
    attributes:
      value:
        name: value
        description: The string.
        range: string
        required: true
    class_uri: openpolicyagent:OpaStringConst
  OpaBuiltinFunc:
    name: OpaBuiltinFunc
    definition_uri: https://w3id.org/lmodel/opa/OpaBuiltinFunc
    description: BuiltinFunc represents a built-in function that may be required by
      the policy.
    from_schema: https://w3id.org/lmodel/opa/ir_plan
    exact_mappings:
    - opa_plan:BuiltinFunc
    slots:
    - opaBuiltinFunc__decl
    - opaBuiltinFunc__name
    attributes:
      decl:
        name: decl
        description: BuiltinFunc declaration; opaque in this schema.
        range: OpaFunctionType
        inlined: true
      name:
        name: name
        description: The function's name.
        slot_uri: schema:name
        range: string
        required: true
    class_uri: openpolicyagent:OpaBuiltinFunc
  OpaPlans:
    name: OpaPlans
    definition_uri: https://w3id.org/lmodel/opa/OpaPlans
    description: Plans represents a collection of named query plans to expose in the
      policy.
    from_schema: https://w3id.org/lmodel/opa/ir_plan
    exact_mappings:
    - opa_plan:Plans
    slots:
    - opaPlans__plans
    attributes:
      plans:
        name: plans
        description: The plans.
        range: OpaPlan
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: openpolicyagent:OpaPlans
  OpaPlan:
    name: OpaPlan
    definition_uri: https://w3id.org/lmodel/opa/OpaPlan
    description: Plan represents an ordered series of blocks to execute. Plan execution
      stops when a return statement is reached.
    from_schema: https://w3id.org/lmodel/opa/ir_plan
    exact_mappings:
    - opa_plan:Plan
    slots:
    - opaPlan__blocks
    - opaPlan__name
    attributes:
      blocks:
        name: blocks
        description: The blocks, run in order.
        range: OpaBlock
        multivalued: true
        inlined: true
        inlined_as_list: true
      name:
        name: name
        description: The plan's name, which is its entrypoint.
        slot_uri: schema:name
        range: string
        required: true
    class_uri: openpolicyagent:OpaPlan
  OpaFuncs:
    name: OpaFuncs
    definition_uri: https://w3id.org/lmodel/opa/OpaFuncs
    description: Funcs represents a collection of planned functions to include in
      the policy.
    from_schema: https://w3id.org/lmodel/opa/ir_plan
    exact_mappings:
    - opa_plan:Funcs
    slots:
    - opaFuncs__funcs
    attributes:
      funcs:
        name: funcs
        description: The functions.
        range: OpaFunc
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: openpolicyagent:OpaFuncs
  OpaFunc:
    name: OpaFunc
    definition_uri: https://w3id.org/lmodel/opa/OpaFunc
    description: Func represents a named plan (function) that can be invoked. Functions
      accept one or more parameters and return a value.
    from_schema: https://w3id.org/lmodel/opa/ir_plan
    exact_mappings:
    - opa_plan:Func
    slots:
    - opaFunc__blocks
    - opaFunc__name
    - opaFunc__params
    - opaFunc__path
    - opaFunc__return_local
    attributes:
      blocks:
        name: blocks
        description: The blocks, run in order.
        range: OpaBlock
        multivalued: true
        inlined: true
        inlined_as_list: true
      name:
        name: name
        description: The function's name.
        slot_uri: schema:name
        range: string
        required: true
      params:
        name: params
        description: The locals that hold the parameters. The first two are the input
          and data documents.
        range: integer
        multivalued: true
      path:
        name: path
        description: Where the function is in the data tree, when it has a path.
        range: string
        multivalued: true
      return_local:
        name: return_local
        description: The local that holds the return value.
        alias: return
        range: integer
        required: true
    class_uri: openpolicyagent:OpaFunc
  OpaBlock:
    name: OpaBlock
    definition_uri: https://w3id.org/lmodel/opa/OpaBlock
    description: Block represents an ordered sequence of statements to execute. Blocks
      are executed until a return statement is encountered, a statement is undefined,
      or there are no more statements.
    from_schema: https://w3id.org/lmodel/opa/ir_plan
    exact_mappings:
    - opa_plan:Block
    slots:
    - opaBlock__stmts
    attributes:
      stmts:
        name: stmts
        description: The statements, run in order.
        range: OpaStmt
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: openpolicyagent:OpaBlock
  OpaUnplannedRule:
    name: OpaUnplannedRule
    definition_uri: https://w3id.org/lmodel/opa/OpaUnplannedRule
    description: UnplannedRule represents a rule that was parsed but not included
      in the plan because it is not reachable from the entrypoint. This is used for
      coverage reporting, to distinguish rules that were never planned from rules
      that were planned but never executed.
