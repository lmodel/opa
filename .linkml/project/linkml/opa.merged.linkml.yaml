            "OpaBundleStatus",
            "OpaPluginStatus"
          ],
          "range": "string"
        },
        "description": {
          "name": "description",
          "description": "What the argument or result holds, on a named type.",
          "from_schema": "https://w3id.org/lmodel/opa/common",
          "slot_uri": "schema:description",
          "owner": "OpaType",
          "domain_of": [
            "OpaType",
            "OpaBuiltin",
            "OpaBuiltinMetadata",
            "OpaBuiltinArgument",
            "OpaBuiltinResult"
          ],
          "range": "string"
        }
