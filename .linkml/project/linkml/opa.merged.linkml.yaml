  "classes": {
    "OpaObject": {
      "name": "OpaObject",
      "description": "A JSON object whose keys OPA leaves open.",
      "from_schema": "https://w3id.org/lmodel/opa",
      "extra_slots": {
        "allowed": true
      }
    },
    "OpaValue": {
      "name": "OpaValue",
      "description": "Any JSON value.",
      "comments": [
        "LinkML 1.12.1's JSON Schema leaves arrays out of linkml:Any. A slot that may hold an array also admits a list of values, so an array nested directly in such a list fails. LinkML writes a required slot's range beside that list, so a static property's key, which is required, refuses every list. No capabilities file OPA includes has a list as a key."
      ],
      "from_schema": "https://w3id.org/lmodel/opa",
      "class_uri": "linkml:Any"
    },
    "OpaLabels": {
      "name": "OpaLabels",
      "description": "Labels as text keys and text values, such as an OPA instance's `id` and `version`.",
      "from_schema": "https://w3id.org/lmodel/opa",
      "extra_slots": {
        "range_expression": {
          "range": "string"
        }
      }
    },
    "OpaStringListMap": {
      "name": "OpaStringListMap",
      "description": "An object whose every value is a list of strings, as Go writes HTTP headers and query parameters.",
